# Per-package CI settings, read by scripts/ci/ci.py.
#
# Every workspace package runs in CI by default. A section here only says how a
# package differs from [defaults].
#
# Keys:
#   skip            = "why"   leave the package out of CI entirely
#   fmt / build / clippy / test  "enforce" (failure fails CI) | "report" (warning
#                             only) | "off" (don't run)
#   runs            = [...]   one `cargo test` per entry; each entry is the
#                             feature flags for that run: "" (defaults),
#                             "a b" (--features a,b), or raw flags starting
#                             with "-" (e.g. "--no-default-features")
#   test-args       = [...]   passed after `--` to the test binaries
#   timeout-minutes = N       per-package job timeout
#   reason          = "why"   shown next to report-only failures
#   env             = { K = "v" }  environment for every cargo command of the
#                             package (e.g. CARGO_BUILD_JOBS to bound memory).
#                             Merges key by key over [defaults.env]; a variable
#                             already set in the caller's environment wins.
#
# Run what CI runs, locally:   make ci-package PACKAGE=foundation_ai
# See every package's settings: make ci-list

[defaults]
# Most crates are not rustfmt-clean yet; formatting is reported, not enforced,
# until they are. Packages that are already clean enforce it below.
fmt = "report"
build = "enforce"
clippy = "enforce"
test = "enforce"
runs = [""]
timeout-minutes = 60

# ---------------------------------------------------------------------------
# Already rustfmt-clean: keep them that way.

[packages.answerme-agent]
fmt = "enforce"

[packages.ewe_platform_benches]
fmt = "enforce"

[packages.ewe_platform_tests]
fmt = "enforce"

[packages.foundation_cedar]
fmt = "enforce"

[packages.foundation_conditional]
fmt = "enforce"

[packages.foundation_config]
fmt = "enforce"

[packages.foundation_errstacks]
fmt = "enforce"

[packages.foundation_logging]
fmt = "enforce"

[packages.foundation_runtimes]
fmt = "enforce"

[packages.foundation_shell]
fmt = "enforce"

[packages.infrastructure_llama_bindings]
fmt = "enforce"

# ---------------------------------------------------------------------------
# Packages that need specific features for their tests.

[packages.foundation_ai]
# Every test target needs `testing` (mocks); defaults bring llamacpp + candle.
# The second run drops the local backends: cloud providers + the agent layer
# only (what a wasm or cloud-only consumer builds). `testing` stays on because
# the agentic/tool/model suites need the mocks; targets that need llamacpp or
# candle are skipped by their `required-features`, and the llama/candle-only
# tests inside the model suite are gated on those features. This keeps the
# harness and backends compiling without llama.cpp or candle.
runs = ["testing", "--no-default-features --features testing"]
timeout-minutes = 90

[packages.foundation_jsonschema]
# `no_std + alloc` is a supported configuration (`--no-default-features`):
# test it as well so std-only items cannot creep back into that path
# (ewe-studios/ewe_platform#49).
runs = ["", "--no-default-features"]

[packages.foundation_signals]
# The reactive graph is `no_std + alloc` (the wasm UI crates use it that way);
# test that configuration too (ewe-studios/ewe_platform#51, #52).
runs = ["", "--no-default-features --features single_threaded"]

[packages.foundation_deployment_platform]
# VM orchestration (QEMU/UTM) is behind the non-default `vms` feature; its
# tests (moved here from foundation_testbed with the code, spec-53 F11) only
# compile with it, so test that configuration as well.
runs = ["", "vms"]

[packages.foundation_testbed]
# `vms` re-exports foundation_deployment_platform (with its `vms` feature) as
# `foundation_testbed::platform`; the VM e2e target (tests/e2e_tauri.rs, its
# tests `#[ignore]`d — they need KVM and VM images) only compiles with it.
# Test that configuration so the target cannot silently rot again.
runs = ["", "vms"]

[packages.foundation_deployment_docker]
# The Docker client (`client`, `error`, `streaming`) is behind the `docker`
# feature; with default features none of it compiles, so its mock-daemon tests
# (API version negotiation, error classification, every endpoint wrapper)
# never ran. Test that configuration as well. The real-daemon tests stay
# behind `integration-tests`.
runs = ["", "docker"]
# ---------------------------------------------------------------------------
# Packages that need more memory than the runner has to spare.

[packages.foundation_deployment_cloudflare]
# The whole Cloudflare API (~10 MB of generated code) in one crate. Since the
# generator merges duplicate types (10,348 structs -> 4,373) and shares one
# send/parse function across endpoints, a single rustc for the lib peaks at
# ~7 GB (was ~12.8 GB). `--all-targets` builds the lib and its unit-test twin
# at the same time; two of those still do not fit the 16 GB runner, so one job
# at a time. Splitting the generated groups into their own crates is what
# would remove this.
env = { CARGO_BUILD_JOBS = "1" }
