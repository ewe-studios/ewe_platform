# ---------------------------------------------------------------------------
# Packages that need specific features for their tests.

[packages.foundation_ai]
# 67 pedantic warnings in test targets; clear them and delete this override (#441).
clippy-deny-warnings = false
reason = "67 pedantic warnings; clear them and delete this override (#441)"
# Every test target needs `testing` (mocks); defaults bring llamacpp + candle.
# The second run drops the local backends: cloud providers + the agent layer
# only (what a wasm or cloud-only consumer builds). `testing` stays on because
# the agentic/tool/model suites need the mocks; targets that need llamacpp or
# candle are skipped by their `required-features`, and the llama/candle-only
# tests inside the model suite are gated on those features. This keeps the
# harness and backends compiling without llama.cpp or candle.
runs = ["testing", "--no-default-features --features testing"]
timeout-minutes = 90
# Wasm gate (spec 65 00-foundation): the agentic layer + cloud providers must
# compile to wasm32 with no local (llamacpp/candle) backends.
wasm = "enforce"
wasm-runs = ["--no-default-features"]

[packages.foundation_core]
# valtron has two executors chosen at compile time: the single-threaded one
# (default features) and the thread pool (`multi`). Many tests are gated on
# `multi` or `not(multi)`, so test both executors. The `test-clock` run enables
# the `SimulatedClock` and its six clock-injection tests. The default run used
# to get `multi` anyway through a dev-dependency (foundation_testing ->
# foundation_netio's default `multi`), which meant the single-threaded executor
# was never tested.
runs = ["", "multi", "test-clock"]
# The executors differ by feature, so lint both trees: the `multi` tree compiles
# `valtron/extensions/streams/sendable.rs` and the thread pool, the default tree
# the single-threaded executor. `test-clock` compiles `SimulatedClock`, which
# exists in no other tree.
clippy-runs = ["", "multi", "test-clock"]
# At zero clippy warnings in both trees: a new one fails CI (spec 70 feature 116).
clippy-deny-warnings = true
wasm = "enforce"
# The plain wasm build plus both JS backends: `js-foundation-wasm` is the owned
# path (foundation_compact's `host-abi` time/entropy, no wasm-bindgen glue),
# `js-wasmbindgen` the one Workers run.
wasm-runs = [
  "--no-default-features --features std",
  "--no-default-features --features std,js-foundation-wasm",
  "--no-default-features --features std,js-wasmbindgen",
]
# The bare build (neither `std` nor `alloc`) is unsupported: `valtron::Ctx` and
# its executors need `std`, and `alloc`-only support is deferred. The crate
# refuses it with a `compile_error!`; keep that refusal checked so the message
# and the documented minimum cannot drift.
wasm-expect-error = { run = "--no-default-features", contains = "foundation_core needs the `std` feature" }

[packages.foundation_nostd]
# The crate had no clippy runs of its own; its lints were only seen through the
# crates that depend on it. Lint it directly and fail on a warning (spec 70
# feature 49 E10).
clippy-deny-warnings = true

[packages.foundation_macros]
# At zero clippy warnings across its one feature tree (spec 70 feature 120):
# a new warning fails CI. The crate has no features, so the default run is
# the only tree to lint.
clippy-deny-warnings = true

[packages.foundation_jsonschema]
# 14 pedantic warnings; clear them and delete this override (#441).
clippy-deny-warnings = false
reason = "14 pedantic warnings; clear them and delete this override (#441)"
# `no_std + alloc` is a supported configuration (`--no-default-features`):
# test it as well so std-only items cannot creep back into that path
# (ewe-studios/ewe_platform#49).
runs = ["", "--no-default-features"]

[packages.foundation_signals]
# The reactive graph is `no_std + alloc` (the wasm UI crates use it that way);
# test that configuration too (ewe-studios/ewe_platform#51, #52).
runs = ["", "--no-default-features --features single_threaded"]

[packages.foundation_deployment_platform]
# VM orchestration (QEMU/UTM) is behind the non-default `vms` feature; its
# tests (moved here from foundation_testbed with the code, spec-53 F11) only
# compile with it, so test that configuration as well.
runs = ["", "vms"]
# Lint both feature trees: a warning in `vms` code must fail CI too
# (spec 70 feature 79).
clippy-runs = ["", "vms"]
# At zero clippy warnings in both feature trees: a new one fails CI.
clippy-deny-warnings = true

[packages.foundation_testbed]
# `vms` re-exports foundation_deployment_platform (with its `vms` feature) as
# `foundation_testbed::platform`; the VM e2e target (tests/e2e_tauri.rs, its
# tests `#[ignore]`d — they need KVM and VM images) only compiles with it.
# Test that configuration so the target cannot silently rot again.
runs = ["", "vms"]

[packages.foundation_deployment_docker]
# The Docker client (`client`, `error`, `streaming`) is behind the `docker`
# feature; with default features none of it compiles, so its mock-daemon tests
# (API version negotiation, error classification, every endpoint wrapper)
# never ran. Test that configuration as well. The real-daemon tests stay
# behind `integration-tests`; that target is built (`--no-run`) so it cannot
# silently rot, but never run — daemon-backed runs stay manual.
runs = ["", "docker", "--no-run --features docker,integration-tests"]
# Lint every feature set and fail on a warning, so the docker clippy debt
# cannot return (spec 70 feature 49 E3).
clippy-runs = ["", "--all-features"]
clippy-deny-warnings = true
# ---------------------------------------------------------------------------
# Packages that need more memory than the runner has to spare.

[packages.foundation_deployment_cloudflare]
# The whole Cloudflare API (~10 MB of generated code) in one crate. Since the
# generator merges duplicate types (10,348 structs -> 4,373) and shares one
# send/parse function across endpoints, a single rustc for the lib peaks at
# ~7 GB (was ~12.8 GB). `--all-targets` builds the lib and its unit-test twin
# at the same time; two of those still do not fit the 16 GB runner, so one job
# at a time. Splitting the generated groups into their own crates is what
# would remove this.
env = { CARGO_BUILD_JOBS = "1" }
# The default-feature wasm32 build (Workers consumers get default features). It
# broke unnoticed when the generated group crates pulled `foundation_core/multi`
# into wasm32 (fixed 2026-11-03: group crates are native-only dependencies).
# `workers` is the wasm-only feature set Workers code uses.
wasm = "enforce"
wasm-runs = ["", "--no-default-features --features workers"]

# ---------------------------------------------------------------------------
# Wasm32 compile gates (spec 65 00-foundation / spec 28 feature 07).
#
# The foundation crates that must compile for Cloudflare Workers get a
# `cargo check --target wasm32-unknown-unknown` gate on their wasm-relevant
# feature set. This re-establishes the spec-28 `wasm-check` job (lost in the
# per-package refactor) and extends it to the AI crates, so a native-dep that
# leaks into a wasm build — most often `foundation_netio`'s `multi` feature
# (Send-required valtron) reaching netio's single-threaded `!Send` wasm code —
# fails CI instead of regressing silently. The `--no-default-features` entries
# are deliberate: several defaults (netio's `multi`, auth's `turso`, db's
# `turso`/`d1`/`r2`) are native-only and would break the wasm build.

# foundation_core's wasm gate lives in its table above (TOML allows one
# [packages.foundation_core]).

[packages.foundation_auth]
# `server-test` runs the IdP server suite (handlers, storage, services).
runs = ["", "server-test"]
# Clippy covers the server tree too, so its lint count stays at zero.
clippy-runs = ["", "server-test"]
# At zero clippy warnings: a new one fails CI.
clippy-deny-warnings = true
wasm = "enforce"
wasm-runs = ["--no-default-features --features wasm"]

[packages.foundation_http]
# `multi` compiles the macOS branch of tests/h2_parking_tests.rs.
macos-runs = ["", "multi"]
# tests/integration_tests.rs (and the other server suites) are gated on
# `multi`; without this run CI never compiled or ran them. `quic` adds the
# HTTP/3 server suite (tests/http3_server_tests.rs).
runs = ["", "multi quic"]
# Clippy covers the default tree, the multi/quic server tests and the TLS
# server feature consumers enable; all are at zero warnings (spec 70 feature
# 63), so a new one fails CI.
clippy-runs = ["", "multi quic ssl"]
clippy-deny-warnings = true
wasm = "enforce"
wasm-runs = ["--no-default-features --features wasm"]

[packages.foundation_db]
# `libsql` adds the libsql KV/state/document-store and rate-limit tests.
runs = ["", "libsql"]
clippy-runs = ["", "libsql"]
# At zero clippy warnings in both feature trees (spec 70 feature 56): a new one fails CI.
clippy-deny-warnings = true
wasm = "enforce"
# Plain wasm (no JS host), and with the Cloudflare bindings
# (`wasm-bindgen-storage` turns on valtron's JS mode).
wasm-runs = [
  "--no-default-features --features wasm",
  "--no-default-features --features wasm-bindgen-storage",
]

[packages.foundation_netio]
# `quic` adds the QUIC, HTTP/3 and WebTransport suites (tests/quic, tests/http3,
# tests/webtransport), which no run compiled before.
runs = ["", "quic"]
# Clippy must cover the quic-gated code, not only the default features.
clippy-runs = ["", "quic"]
# Both runs are at zero clippy warnings under `--all-targets`: a new one fails CI.
clippy-deny-warnings = true
wasm = "enforce"
wasm-runs = ["--no-default-features --features wasm-fetch"]

[packages.foundation_browser]
# At zero clippy warnings under `--all-targets` (spec 70 feature 109): a new one
# fails CI.
clippy-deny-warnings = true

[packages.foundation_vectors]
# `sql-store` adds the SQL / libsql vector stores and their tests; `code-graph`
# adds the tree-sitter code-graph module and its tests.
runs = ["", "sql-store", "code-graph"]
clippy-runs = ["", "sql-store", "code-graph"]
# At zero clippy warnings (spec 70 feature 56): a new one fails CI.
clippy-deny-warnings = true
wasm = "enforce"
# `turbopuffer` takes the fetch client on wasm32 (foundation_netio `wasm-fetch`).
# `sql-store` is the portable full-scan store over foundation_db's shared core.
wasm-runs = ["", "turbopuffer", "sql-store"]

[packages.foundation_keychain]
# Runs on Cloudflare Workers (D1 + the fetch client for the icon proxy, #140);
# the wasm32 target pulls its own backend features, so the default set is the
# wasm build.
wasm = "enforce"
wasm-runs = [""]

[packages.foundation_nativeapis]
# The D1/R2 delta VFS tests skip without the local Cloudflare emulator; the
# blob-delta and native VFS tests always run. `fd` adds the shared-reactor
# readiness suite (tests/reactor_shared_selector_tests.rs), which is gated on
# `feature = "fd"` and so runs in no other run. `netstack` adds the WireGuard
# overlay data-plane suite (tests/dataplane), which no run compiled before.
# `vfs-fuse` builds and runs the FUSE adapter tests (mount tests skip without
# /dev/fuse). `vfs-preload` builds the `LD_PRELOAD` shim and its `vfs_shim_vfs`
# suite (Linux); it did not compile for a while, so it gets its own run.
# `fd,uring` compiles and runs the io_uring suites (`uring_completion_*` and
# `completion_source_seam`); their code is Linux-only, and the run compiles to
# empty test binaries elsewhere. `vfs-native,vfs-ptrace` is the ptrace spawn
# suite (`tests/ptrace_vfs`), named on its own so a failure says "ptrace",
# not "the full VFS set". It needs a native amd64 kernel: under emulation
# `PTRACE_GETREGS` returns `EIO`. The last run compiles every remaining VFS
# backend together so a backend that only breaks under a specific feature set is
# caught in CI.
runs = ["", "fd", "fd,uring", "vfs-native,vfs-d1,vfs-r2", "netstack", "vfs-fuse", "vfs-preload", "vfs-native,vfs-ptrace", "vfs-native,vfs-search-fff,vfs-sqlite,vfs-ipc,vfs-fjall,vfs-nfs,vfs-ptrace,vfs-d1,vfs-r2,vfs-arrow"]
# At zero clippy warnings in the default build, the `vfs-preload` shim tree
# (spec 70 feature 113) and the `ipc` message bus (issue #487): a new one fails CI.
clippy-runs = ["", "vfs-preload", "ipc"]
clippy-deny-warnings = true
# The crate builds for wasm32 (issue #411): the native and signal modules are
# gated at the crate root, and only the shared VFS tree compiles. The default
# set and the `vfs,vfs-search` set that foundation_ai's wasm build enables are
# both checked.
wasm = "enforce"
wasm-runs = ["", "--no-default-features --features vfs,vfs-search"]
# `uring_completion_*` and `completion_source_seam` skip on a kernel without
# io_uring. Set the variable so CI fails instead of silently losing the suite.
# The ptrace spawn tests must likewise fail on a kernel that cannot trace a
# child, not pass as an empty or skipping binary.
# `container-options` is read by `scripts/ci/ci.py` and added to this job's
# container, because Docker's default seccomp profile blocks `io_uring_setup`
# and `ptrace`.
env = { EWE_REQUIRE_IO_URING = "1", EWE_REQUIRE_PTRACE = "1" }
container-options = "--security-opt seccomp=unconfined"
# macOS runs (job `macos-test`): the kqueue reactor (`fd`), the macOS signal
# handler (default `signal`), the polling watcher (`watcher-macos`), the Mach
# port IPC transport (`vfs-ipc`) and the userspace data plane (`netstack`). The
# `tun` (needs root), `uring`, `ptrace`, FUSE and preload sets are Linux-only.
macos-runs = ["", "fd", "watcher-macos", "netstack", "vfs-native,vfs-ipc"]

[packages.foundation_iogate]
# 3 pedantic warnings; clear them and delete this override (#441).
clippy-deny-warnings = false
reason = "3 pedantic warnings; clear them and delete this override (#441)"
# Its io_uring tests fail when `EWE_REQUIRE_IO_URING=1` and io_uring is missing.
# Docker's default seccomp profile blocks `io_uring_setup`, so this job's
# container runs with `seccomp=unconfined`. This is the io_uring exception only;
# every other package keeps the default profile. The `io_uring_probe` target
# prints whether the kernel allows it before the package tests run.
env = { EWE_REQUIRE_IO_URING = "1" }
container-options = "--security-opt seccomp=unconfined"

[packages.foundation_proxy]
# `quic` adds the HTTP/3 front end (F19) and its suites (tests/h3_*). No run
# compiled them before, so the H3 code was never built or linted in CI.
runs = ["", "quic"]
# Clippy covers the quic tree too, at zero warnings (clippy-deny-warnings is
# the default), so a new H3 warning fails CI.
clippy-runs = ["", "quic"]
# The default run also compiles the macOS branch of the completion dial tests.
macos-runs = [""]
# The completion dial and splice tests need io_uring; fail instead of skipping.
env = { EWE_REQUIRE_IO_URING = "1" }
container-options = "--security-opt seccomp=unconfined"

[packages.foundation_reactor]
# The macOS reactor uses kqueue. `uring` is Linux-only, so only the default run.
macos-runs = [""]
# At zero clippy warnings under `--all-targets`: a new one fails CI. Without
# this, a warning here blocked the clippy gate of every crate that depends on it.
clippy-deny-warnings = true
# The poll module compiles on wasm32 (the reactor module is Unix-only), so keep
# it warning-free there. This is the check that caught the dead `rearm_readable`.
wasm = "enforce"
wasm-runs = [""]

[packages.foundation_compact]
# The default run covers the macOS entropy and errno backends.
macos-runs = [""]
wasm = "enforce"
# Defaults use the wasm-bindgen time/entropy backend; the second run is the
# owned path's `host-abi` backend.
wasm-runs = ["", "--no-default-features --features std,host-abi"]

[packages.foundation_context]
wasm = "enforce"
# The plain wasm build plus both time and entropy backends of foundation_compact.
wasm-runs = [
  "",
  "--no-default-features --features host-abi",
  "--no-default-features --features wasm-bindgen",
]

[packages.foundation_arrow]
wasm = "enforce"
wasm-runs = [""]

[packages.foundation_connectrpc]
# `h3` adds the HTTP/3 suites (tests/h3_*), which no run compiled before.
runs = ["", "h3"]
wasm = "enforce"
wasm-runs = ["--no-default-features --features rpc"]
# Spec 70 feature 128: the rpc wasm build is at zero warnings, and the gate
# keeps it there. The native-dep items in `dispatch.rs` are gated to non-wasm.
wasm-deny-warnings = true

[packages.foundation_boringtun]
# The `device` feature builds the kqueue poller and the utun device that only
# exist on macOS. Without `device`, the macOS code is not compiled.
macos-runs = ["", "device"]

# ---------------------------------------------------------------------------
# Example workspaces

[packages.examples]
# The `examples/cf-*` directories are self-contained wasm32 workspaces excluded
# from the main workspace, so cargo metadata never lists them. The synthetic
# `examples` package (see `examples_commands` in scripts/ci/ci.py) compiles each
# of them for wasm32-unknown-unknown and builds the native `answerme-agent` app.
fmt = "off"
build = "enforce"
clippy = "off"
test = "off"
wasm = "off"

# ---------------------------------------------------------------------------
# Wasm runtime test suites (feature 22 E4).

[packages.wasm-tests]
# The wasm `wasm_bindgen_test` / `#[wasm_test]` suites are wasm32-only test
# targets, and the standalone wasm_tests crate sits outside the root workspace,
# so cargo metadata's library-only wasm gate never compiled them. This synthetic
# package (see `wasm_tests_commands` in scripts/ci/ci.py) compile-checks those
# tests with `--tests --target wasm32-unknown-unknown` and then runs the two
# embedded-Deno harnesses. The env selects mise.wasm.toml, which pins only
# deno + wasm-bindgen and turns off auto_install (E6).
fmt = "off"
build = "enforce"
clippy = "off"
test = "enforce"
wasm = "off"
timeout-minutes = 90
env = { MISE_ENV = "wasm" }

# At zero clippy warnings (spec 70 feature 55): a new one fails CI.
[packages.foundation_openapi]
clippy-deny-warnings = true

[packages.foundation_codegentools]
clippy-deny-warnings = true
