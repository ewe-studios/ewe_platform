# Per-package CI settings, read by scripts/ci/ci.py.
#
# Every workspace package runs in CI by default. A section here only says how a
# package differs from [defaults].
#
# Keys:
#   skip            = "why"   leave the package out of CI entirely
#   fmt / build / clippy / test / wasm  "enforce" (failure fails CI) | "report"
#                             (warning only) | "off" (don't run)
#   runs            = [...]   one `cargo test` per entry; each entry is the
#                             feature flags for that run: "" (defaults),
#                             "a b" (--features a,b), or raw flags starting
#                             with "-" (e.g. "--no-default-features")
#   clippy-runs     = [...]   one `cargo clippy --all-targets` per entry, same
#                             feature-flag syntax as `runs`. Default: only the
#                             first entry of `runs`. Set it when a feature tree
#                             (e.g. a server module) is not in the default build.
#   wasm            = "enforce"|"report"|"off"  run the wasm32-unknown-unknown
#                             compile gate (`cargo check --target wasm32`) for
#                             this package; "off" (the default) skips it — most
#                             crates are not wasm targets.
#   wasm-runs       = [...]   one `cargo check --target wasm32` per entry, same
#                             feature-flag syntax as `runs`. Only the wasm-
#                             relevant crates set this.
#   wasm-deny-warnings = true  run every wasm check of this package with
#                             `RUSTFLAGS=-D warnings`, so a warning fails CI.
#                             Default false. `cargo check` takes no trailing
#                             rustc arguments, so the flag cannot use `--`.
#                             Set it only for packages at zero warnings (with
#                             every feature tree in `wasm-runs`).
#   clippy-deny-warnings = true  pass `--no-deps -- -D warnings` to every clippy run of this
#                             package, so a clippy warning fails CI. Default
#                             true. A package that still carries warnings sets
#                             it to false with a `reason` until its list is
#                             empty, and must keep every feature tree in
#                             `clippy-runs` so the list stays complete.
#   macos-runs      = [...]   one `cargo test` per entry on the macOS runner (job
#                             `macos-test` in check.yaml), same feature-flag
#                             syntax as `runs`. Only the feature sets that
#                             build on macOS belong here: leave out `uring`,
#                             `ptrace`, `vfs-fuse` and `vfs-preload`. A
#                             package without this key is not tested on macOS.
#                             ci.py uses it when it runs on a macOS host.
#                             List a package only if its tests reach code that
#                             is gated on `target_os = "macos"`.
#   macos-env       = { K = "v" }  environment for the macOS test commands. It
#                             replaces `env` on macOS, so the Linux-only
#                             `EWE_REQUIRE_IO_URING` and `EWE_REQUIRE_PTRACE`
#                             never reach a macOS run.
#   test-args       = [...]   passed after `--` to the test binaries
#   timeout-minutes = N       per-package job timeout
#   failure-lines = N         failed-test lines kept per command for the end-of-run
#                             summary (default 200)
#   reason          = "why"   shown next to report-only failures
#   env             = { K = "v" }  environment for every cargo command of the
#                             package (e.g. CARGO_BUILD_JOBS to bound memory).
#                             Merges key by key over [defaults.env]; a variable
#                             already set in the caller's environment wins.
#
# Run what CI runs, locally:   make ci-package PACKAGE=foundation_ai
# See every package's settings: make ci-list

[defaults]
# Most crates are not rustfmt-clean yet; formatting is reported, not enforced,
# until they are. Packages that are already clean enforce it below.
fmt = "report"
build = "enforce"
clippy = "enforce"
# A clippy warning fails CI for every package. Without this, a crate kept its
# warnings for as long as nobody touched it (issue #436, and #434 for
# `foundation_reactor`). A package that still carries warnings sets this to
# false with a `reason` until its list is empty.
clippy-deny-warnings = true
test = "enforce"
# Most crates are not wasm32 targets; only the foundation crates that must
# compile for Cloudflare Workers opt in below.
wasm = "off"
runs = [""]
timeout-minutes = 60

