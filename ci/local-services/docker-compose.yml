# Local stand-ins for the cloud services the tests use (spec 92 feature 00).
#
# moto serves AWS KMS over the real REST API and SigV4 shape. Vault runs its dev
# server for the Transit backend. Both images are pinned by digest so a CI run and
# a laptop run use the same bytes.
#
# The host port of moto is 5055: macOS gives port 5000 to ControlCenter.
#
#   docker compose -f ci/local-services/docker-compose.yml up -d --wait
#   export AWS_ENDPOINT_URL_KMS=http://127.0.0.1:5055
#   export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root
name: ewe-local-services

services:
  moto:
    image: motoserver/moto@sha256:344e076f31ad1f5ff1ec4492f741e7d42911d1c7a1ef9b1590f56c340b968513
    ports:
      - "5055:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"
      interval: 3s
      timeout: 2s
      retries: 40
    restart: unless-stopped

  vault:
    image: hashicorp/vault@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          VAULT_ADDR=http://127.0.0.1:8200 vault status
      interval: 3s
      timeout: 2s
      retries: 40
    restart: unless-stopped

  # Dev mode starts with no secrets engine. Enable Transit once the server answers.
  # This service exits when the engine exists, so `up --wait` treats it as done.
  vault-init:
    image: hashicorp/vault@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until vault status >/dev/null 2>&1; do sleep 1; done
        vault secrets enable transit 2>/dev/null || true
        echo "transit enabled"
    restart: "no"
