# The Durable Streams transport conformance matrix (spec 71, handoff section
# 4.6). One Given/When/Then scenario suite runs on the embedded, HTTP,
# WebSocket and ConnectRPC transports, and on a Durable Object worker. Each
# driver is checked against the model oracle, then against the other drivers.
#
# The shared code (`driver`, `scenario`, `model`) builds for wasm32, so a
# Durable Object fixture can depend on it with `default-features = false`.
# The native drivers sit behind `native-drivers`, which `default` enables.
#
# A new transport adds one driver and runs the same scenario list unchanged.
[package]
name = "durable_transport_matrix"
version = "0.0.1"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The protocol core. The shared code uses the store types and the wire offset
# codec. The native drivers add `multi` for the valtron pool.
foundation_core = { path = "../../backends/foundation_core", default-features = false, features = ["std", "alloc"] }
# The context bundle that carries the injected clock.
foundation_context = { path = "../../backends/foundation_context" }
# The observation types cross the Durable Object route as JavaScript Object
# Notation (JSON), so they carry serde derives on every target.
serde = { workspace = true }
# The native HTTP server, the Durable handler and the Durable WebSocket handler.
foundation_http = { path = "../../backends/foundation_http", optional = true }
# The native HTTP client transport and the platform WebSocket client.
foundation_netio = { path = "../../backends/foundation_netio", optional = true }
# The ConnectRPC service, the server adapters and the generated client.
foundation_connectrpc = { path = "../../backends/foundation_connectrpc", optional = true }
# The concrete RPC error trace, so the driver reads the RPC code.
foundation_errstacks = { path = "../../backends/foundation_errstacks", optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The serial lock and the test timeout for the scenario functions.
foundation_macros = { workspace = true }
serial_test = { workspace = true }

[features]
# The native drivers need the valtron multi-thread pool and the platform
# transports. A wasm fixture turns this off and uses the shared code only.
default = ["native-drivers"]
native-drivers = [
  "dep:foundation_http",
  "dep:foundation_netio",
  "dep:foundation_connectrpc",
  "dep:foundation_errstacks",
  "dep:base64",
  "dep:serde_json",
  "foundation_core/multi",
  "foundation_http/multi",
  "foundation_netio/multi",
  "foundation_connectrpc/rpc_multi",
]
# The Durable Object driver test starts `wrangler dev --local`. It is off by
# default, so the normal suite does not need wrangler.
do-driver = ["native-drivers"]

[lints]
workspace = true
