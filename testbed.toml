# testbed.toml — project-level VM configuration
# Generated by `ewe_platform testbed init`

[[vms]]
name = "windows-build"
profile = "windows-build"
mount = { host_path = ".", guest_path = "C:/Users/vagrant/project", readonly = false }
artefacts = { "vsb_layout.windows.zip" = ".testbed/windows-build/artifacts/vsb_layout.windows.zip" }
# Optional: Custom state directory for this VM (defaults to `$PWD/.testbed/windows-build/state/`)
# state_directory = "/var/lib/testbed/windows-build"

[[vms]]
name = "linux-build"
profile = "linux-build"
mount = { host_path = ".", guest_path = "/mnt/project", readonly = false }

[[vms]]
name = "macos-build"
profile = "macos-build"
mount = { host_path = ".", guest_path = "/Users/vagrant/project", readonly = false }

# Artifact mirroring
[artifacts]
sync = true                           # Mirror build outputs

# Image stores — ordered sources for VM disk images.
# First store with a matching image wins.

# macOS pre-baked tarball (BaseSystem.qcow2 + opencore.qcow2 + macOS-data.qcow2)
[[image_stores]]
name = "macos-build"
type = "http"
destination = "https://pub-abc123.r2.dev/testbed-images"
key_prefix = "macos-build/"

# Vagrant Cloud — default fallback for Windows/Linux images
[[image_stores]]
name = "vagrant_cloud"
type = "vagrant"
registry = "libvirt"

# Local image store — user home directory
[[image_stores]]
name = "local"
type = "local"
destination = "/home/darkvoid/.testbed"
key_prefix = ""


# EweStore — local filesystem image store
[[image_stores]]
name = "ewe_store"
type = "local"
destination = "/home/darkvoid/EweStore/Testbed"
key_prefix = ""
