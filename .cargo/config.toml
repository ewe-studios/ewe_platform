[env]
EWE_PLATFORM_DIR = { value = ".", relative = true, force = true }
ARTEFACTS_DIR = { value = "artefacts", relative=true, force = true }
ARTEFACTS_TEMPLES_DIR = { value = "artefacts/temples", relative=true, force = true }
ARTEFACTS_TEMPLATES_DIR = { value = "artefacts/temples/templates", relative=true, force = true }
BACKENDS_DIR = { value = "backends", relative=true, force = true }
INFRASTRUCTURE_DIR = { value = "infrastructure", relative=true, force = true }

# build environment variables for infrastructure
TOOLS_DIR = { value = "tools", relative=true, force = true }
LLAMA_BINDINGS_DIR = { value = "infrastructure/llama-bindings", relative=true, force = true }
LLAMA_DIR = { value = "tools/llama.cpp", relative = true, force = true }
DAWN_DIR = { value = "tools/dawn", relative=true, force = true }
EMSDK_DIR = { value = "tools/emsdk", relative=true, force = true }

# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=/home/linuxbrew/.linuxbrew/bin/mold", "-Z", "macro-backtrace", ]

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]


# No `[unstable]` table: stable cargo (which builds releases) ignores it, and
# the Cranelift opt-in it carried now lives in mise.toml's [env]
# (CARGO_UNSTABLE_CODEGEN_BACKEND) next to the profile backend it enables.

# ── Android cross-compilation targets (spec-55 mobile) ──────────────────
# The NDK lives in a different place and uses a different host prebuilt per OS
# (darwin-x86_64 vs linux-x86_64), so each linker is a repo-relative wrapper
# that resolves the NDK at build time. Install it with `mise run setup:android`
# (NDK r27, 27.0.12077973), or point ANDROID_NDK_HOME at an existing NDK.
# Usage: cargo build --target aarch64-linux-android --package foundation_wireguard

[target.aarch64-linux-android]
linker = "scripts/android-ndk/aarch64-linux-android"

[target.x86_64-linux-android]
linker = "scripts/android-ndk/x86_64-linux-android"

[target.armv7-linux-androideabi]
linker = "scripts/android-ndk/armv7-linux-androideabi"

# ── Windows cross-compilation (spec-62 F07 validation) ─────────────────────
# mingw-w64 provides x86_64-w64-mingw32-gcc (brew on macOS, pacman on Arch).
# Install with `mise run setup:windows`. `cargo check` needs only the Rust std
# target; a full `cargo build` needs the linker.
# Usage: cargo check --target x86_64-pc-windows-gnu -p foundation_nativeapis

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
