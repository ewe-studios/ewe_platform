[package]
name = "ewe_platform_tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "mod.rs"

[dependencies]
foundation_nostd = { path = "../backends/foundation_nostd", version = "0.0.4" }
foundation_core = { path = "../backends/foundation_core", version = "0.0.3" }
foundation_netio = { path = "../backends/foundation_netio", version = "0.0.1" }
foundation_testing = { path = "../backends/foundation_testing", version = "0.0.1" }
serde = { version = "1.0", features = ["derive"] }

regex = { workspace = true}
tracing = { workspace = true}
base64 = "0.21"
sha1 = { version = "0.10", features = ["std"] }

[dev-dependencies]
serial_test = { workspace = true }
ntest = { workspace = true }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
reqwest = { version = "0.13", features = ["blocking"] }

[features]
std = ["foundation_core/std"]
multi = ["foundation_core/multi"]
alloc = ["foundation_core/alloc"]
gzip = ["foundation_netio/gzip"]
deflate = ["foundation_netio/gzip"]
brotli = ["foundation_netio/compression"]
socks5 = ["foundation_netio/socks5"]
ssl-rustls = ["foundation_netio/ssl-rustls"]
default  = ["std"]
