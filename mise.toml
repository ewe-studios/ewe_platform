# =============================================================================
# EWE Platform - mise configuration
# =============================================================================
# Replaces: root Makefile, assets/public/Makefile, examples/todo/Makefile,
#           backends/foundation_nostd/Makefile
#
# Usage:
#   mise install          Install all tools
#   mise run <task>       Run a task
#   mise tasks            List all available tasks
# =============================================================================

[env]
CARGO_TERM_COLOR = "always"
PROJECT_ROOT = "{{config_root}}"
TOOLS_DIR = "{{config_root}}/tools"
DEPOT_DIR = "{{env.TOOLS_DIR}}/depot_tools"
DAWN_DIR = "{{env.TOOLS_DIR}}/dawn"
EMSDK_DIR = "{{env.TOOLS_DIR}}/emsdk"
WHISPER_DIR = "{{env.TOOLS_DIR}}/whisper.cpp"
LLAMA_SUBMODULE_PATH = "tools/llama.cpp"
LLAMA_DIR = "{{config_root}}/{{env.LLAMA_SUBMODULE_PATH}}"
LLAMA_BINDINGS_DIR = "{{config_root}}/infrastructure/llama-bindings"
LLAMA_SYMLINK_DIR = "{{env.LLAMA_BINDINGS_DIR}}/llama.cpp"
_.path = ["./node_modules/.bin", "{{env.DEPOT_DIR}}"]

# =============================================================================
# Test model — single source of truth for llama-server integration tests.
# Change the model here and every task/test that references it updates.
# =============================================================================
LLAMA_TEST_MODEL_DIR = "{{config_root}}/artefact/models"
LLAMA_TEST_MODEL_FILE = "{{config_root}}/artefact/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
LLAMA_TEST_MODEL_NAME = "qwen2.5-0.5b-instruct"
LLAMA_TEST_MODEL_URL = "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
LLAMA_TEST_MODEL_DESC = "Qwen2.5-0.5B-Instruct q4_k_m, ~370MB"

# =============================================================================
# Tool versions - mise manages these automatically
# =============================================================================
# NOTE: Rust toolchain is managed by rust-toolchain.toml (rustup).
# mise defers to rust-toolchain.toml when present, so we don't duplicate it.

[tools]
node = "23"
pnpm = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:bacon" = "latest"
"aqua:nushell/nushell" = "latest"
pitchfork = "latest"
# wrangler is managed via project devDependencies (pnpm), not mise —
# mise's npm shim installs wrangler into a nested tree where sharp's
# prebuilt-binary check fails and falls back to a node-gyp build.

# =============================================================================
# Tasks - Setup
# =============================================================================

[tasks.setup]
description = "Install all dev tools and WASM targets"
depends = ["setup:tools", "setup:wasm", "setup:cloudflare"]
run = 'echo "✓ Development environment setup complete"'

[tasks."setup:tools"]
description = "Install rustfmt, clippy, rust-analyzer, cargo-nextest, cargo-audit, and C/C++ toolchains"
depends = ["tools:llama:init", "tools:emsdk:init", "tools:dawn:clone"]
run = """
echo "Installing development tools..."
rustup component add rustfmt clippy rust-analyzer 2>/dev/null || true
echo "Installing pnpm dependencies..."
pnpm install
echo "✓ Tools installed (cargo-nextest and cargo-audit managed by mise)"
"""

[tasks."setup:wasm"]
description = "Install WASM compilation targets"
run = """
echo "Installing WASM targets..."
rustup target add wasm32-unknown-unknown
rustup target add wasm32-wasip1
echo "✓ WASM targets installed"
"""

[tasks."setup:playwright"]
alias = "setup-playwright"
description = "Install Playwright + chromium for the owned wasm-testbed web runner (spec-39 feature 12)"
dir = "backends/foundation_testbed/integration"
run = """
echo "Installing Playwright (browser runner for wasm-testbed web)..."
npm install
npx playwright install --with-deps chromium
echo "✓ Playwright + chromium installed"
"""

# ── spec-43: pure-Rust browser testing (no node/Playwright) ──────────────────
# The foundation_browser driver speaks CDP directly to a system Chromium; these
# tasks install it per-distro and run the suite. Set PRIMAL_TEST_CHROMIUM_BIN to
# point at a specific binary.
[tasks."test:browsers"]
alias = "test-browsers"
description = "Install browsers for the pure-Rust browser test driver (spec-43)"
depends = ["test:browsers:chromium", "test:browsers:firefox"]
run = 'echo "✓ test browsers installed"'

[tasks."test:browsers:chromium"]
description = "Install Chromium for foundation_browser tests (per-distro)"
run = """
#!/usr/bin/env bash
set -euo pipefail
case "$(. /etc/os-release; echo "$ID")" in
  arch)          sudo pacman -S --needed --noconfirm chromium ;;
  debian|ubuntu) sudo apt-get update && (sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser) ;;
  fedora)        sudo dnf install -y chromium ;;
  *) echo "Install a Chromium build and set PRIMAL_TEST_CHROMIUM_BIN" >&2; exit 1 ;;
esac
echo "✓ chromium installed"
"""

[tasks."test:browsers:firefox"]
description = "Install Firefox for foundation_browser BiDi tests (per-distro)"
run = """
#!/usr/bin/env bash
set -euo pipefail
case "$(. /etc/os-release; echo "$ID")" in
  arch)          sudo pacman -S --needed --noconfirm firefox ;;
  debian|ubuntu) sudo apt-get update && sudo apt-get install -y firefox-esr || sudo apt-get install -y firefox ;;
  fedora)        sudo dnf install -y firefox ;;
  *) echo "Install Firefox and set PRIMAL_TEST_FIREFOX_BIN" >&2; exit 1 ;;
esac
echo "✓ firefox installed"
"""

[tasks."test:browser"]
alias = "test-browser"
description = "Run the pure-Rust browser test suite against a real Chromium (spec-43)"
run = """
echo "Running foundation_browser suite (needs chromium — run 'mise run test:browsers')..."
cargo test -p foundation_browser --features browser-tests --test smoke
echo "✓ browser tests passed (PRIMAL_TEST_HEADFUL=1 to watch them live)"
"""

[tasks."test:cert:regen"]
description = "Regenerate the localhost dev TLS cert for #[wasm_ui_server(https = true)]"
dir = "backends/foundation_browser/src/test/fixtures"
run = """
#!/usr/bin/env bash
set -euo pipefail
openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem \
  -days 3650 -subj "/CN=localhost" \
  -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
echo "✓ regenerated cert.pem + key.pem (dev only; the browser trusts it via --ignore-certificate-errors)"
"""

[tasks."setup:depot-tools"]
description = "Install Chromium depot_tools into tools/depot_tools (for Dawn/gclient)"
run = """
#!/usr/bin/env bash
set -e
if [ -d "$DEPOT_DIR/.git" ]; then
    echo "depot_tools already present, updating..."
    git -C "$DEPOT_DIR" pull --ff-only
else
    echo "Cloning depot_tools into $DEPOT_DIR..."
    mkdir -p "$TOOLS_DIR"
    git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_DIR"
fi
echo "✓ depot_tools installed. Ensure tools/depot_tools is on PATH (mise handles this)."
"""

[tasks."tools:dawn:clone"]
description = "Clone Dawn into tools/dawn and run gclient sync (requires depot_tools)"
depends = ["setup:depot-tools"]
run = """
#!/usr/bin/env bash
set -e
if [ -d "$DAWN_DIR/.git" ]; then
    echo "Dawn already cloned at $DAWN_DIR"
else
    echo "Cloning Dawn into $DAWN_DIR..."
    mkdir -p "$TOOLS_DIR"
    git clone https://dawn.googlesource.com/dawn "$DAWN_DIR"
fi

cd "$DAWN_DIR"
if [ ! -f .gclient ]; then
    echo "Bootstrapping gclient config from scripts/standalone.gclient..."
    cp scripts/standalone.gclient .gclient
fi

echo "Running gclient sync..."
gclient sync
echo "✓ Dawn cloned and synced at $DAWN_DIR"
"""

[tasks."tools:llama:symlink"]
description = "Create symlink from LLAMA_SYMLINK_DIR to ../../tools/llama.cpp"
run = """
#!/usr/bin/env bash
set -e
LINK="$LLAMA_SYMLINK_DIR"
TARGET="../../{{env.LLAMA_SUBMODULE_PATH}}"
if [ -L "$LINK" ]; then
    echo "Symlink already exists: $LINK"
else
    if [ -d "$LINK" ]; then
        echo "ERROR: directory exists at $LINK, cannot create symlink"
        echo "Remove the directory first, then re-run this task"
        exit 1
    fi
    ln -s "$TARGET" "$LINK"
    echo "Created symlink: $LINK -> $TARGET"
fi
"""

[tasks."tools:llama:init"]
description = "Initialize and update llama.cpp submodule"
depends = ["tools:llama:symlink"]
run = """
#!/usr/bin/env bash
set -e
echo "Initializing llama.cpp submodule..."
git submodule update --init --recursive {{env.LLAMA_SUBMODULE_PATH}}
echo "✓ llama.cpp submodule ready"
"""

[tasks."tools:emsdk:init"]
description = "Initialize and update emsdk submodule"
run = """
#!/usr/bin/env bash
set -e
echo "Initializing emsdk submodule..."
git submodule update --init --recursive tools/emsdk
echo "✓ emsdk submodule ready"
"""

[tasks."setup:cloudflare"]
description = "Install Cloudflare tools (wrangler via mise)"
depends = ["install:cloudflare"]
run = """
echo "✓ Cloudflare tools installed"
echo ""
echo "Usage:"
echo "  mise run cf:start   - Start local wrangler dev"
echo "  mise run test:cf    - Run R2/D1 integration tests"
"""

[tasks."install:cloudflare"]
description = "Install wrangler (Cloudflare CLI) via pnpm"
