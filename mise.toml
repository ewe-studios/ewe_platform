[tasks."macos:create-image"]
description = "Create a macOS VM image using quickget (downloads from Apple CDN)"
run = """
#!/usr/bin/env bash
set -e

VERSION="${1:-sonoma}"
echo "Creating macOS ${VERSION} VM image..."
echo ""

if ! command -v quickget &>/dev/null; then
    echo "ERROR: quickget not installed."
    echo "Run: mise run sys:install-testbed  (then install quickemu)"
    exit 1
fi

# quickget downloads the installer and creates the VM config
# Output directory: macos-<version>/
quickget macos "$VERSION"

echo ""
echo "✓ macOS ${VERSION} image created in ./macos-${VERSION}/"
echo "  Disk image: macos-${VERSION}/macOS.qcow2"
echo "  EFI disk:   macos-${VERSION}/OpenCore/OpenCore.qcow2"
echo ""
echo "Next: cargo run -p ewe_platform -- testbed import macos-build"
"""

