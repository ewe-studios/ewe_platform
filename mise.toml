[tasks."sys:install-testbed"]
description = "Install testbed dependencies (auto-detects Debian / Ubuntu / Arch Linux)"
run = """
#!/usr/bin/env bash
set -e

# Detect distro from /etc/os-release
if [ -f /etc/os-release ]; then
    ID=$(. /etc/os-release && echo "$ID" | tr -d '"')
    ID_LIKE=$(. /etc/os-release && echo "${ID_LIKE:-}" | tr -d '"')
else
    ID=""
    ID_LIKE=""
fi

echo "=== Testbed Dependencies Installer ==="
echo "Detected distro: ${ID:-unknown} (ID_LIKE: ${ID_LIKE:-none})"
echo ""

install_debian() {
    echo "Using apt (Debian/Ubuntu)..."
    sudo apt-get update
    sudo apt-get install -y --no-install-recommends \\
        qemu-system-x86 \\
        qemu-system-gui \\
        qemu-utils \\
        ovmf \\
        gvncviewer \\
        openssh-client \\
        curl \\
        spice-client-gtk \\
        virt-viewer
    echo ""
    echo "✓ QEMU with SPICE/UI + OVMF installed"
    echo "  OVMF firmware: /usr/share/OVMF/"
}

install_ubuntu() {
    echo "Using apt (Ubuntu)..."
    sudo apt-get update
    sudo apt-get install -y --no-install-recommends \\
        qemu-system-x86 \\
        qemu-system-gui \\
        qemu-utils \\
        ovmf \\
        gvncviewer \\
        openssh-client \\
        curl \\
        spice-client-gtk \\
        virt-viewer
    echo ""
    echo "✓ QEMU with SPICE/UI + OVMF installed"
    echo "  OVMF firmware: /usr/share/OVMF/"
}

install_arch() {
    PKGS=(qemu-base qemu-system-x86 qemu-ui-spice-app qemu-ui-spice-core qemu-chardev-spice qemu-ui-gtk qemu-ui-opengl edk2-ovmf gvncviewer openssh curl)

    echo "Packages: ${PKGS[*]}"
    echo ""

    if command -v yay &>/dev/null; then
        echo "Using yay (AUR helper)..."
        yay -Syu --needed --noconfirm "${PKGS[@]}"
    elif command -v pacman &>/dev/null; then
        echo "Using pacman (requires sudo)..."
        sudo pacman -Syu --needed --noconfirm "${PKGS[@]}"
    else
        echo "ERROR: Neither yay nor pacman found."
        exit 1
    fi

    echo ""
    echo "✓ QEMU with SPICE/UI + OVMF installed"
    echo "  OVMF firmware: /usr/share/edk2/x64/"
}

case "$ID" in
    debian|debian-like)
        install_debian
        ;;
    ubuntu)
        install_ubuntu
        ;;
    arch)
        install_arch
        ;;
    *)
        # Fallback: try ID_LIKE for derivatives
        case "$ID_LIKE" in
            *debian*) install_debian ;;
            *ubuntu*) install_ubuntu ;;
            *arch*)   install_arch ;;
            *)
                echo "ERROR: Unsupported distro '$ID'."
                echo "Install QEMU + OVMF + a VNC/SPICE viewer manually, then retry."
                exit 1
                ;;
        esac
        ;;
esac
"""

