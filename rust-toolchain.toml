[toolchain]
# Development toolchain (Cranelift dev builds via mise's env). Releases build on
# stable: see ci/release-rust-toolchain and docs/releasing.md.
#
# Pinned: a floating `nightly` breaks CI whenever an upstream nightly removes
# something a dependency uses (nightly-2026-10-08 removed
# `core::intrinsics::abort`, breaking the `branches` crate). Bump deliberately.
#
# This channel gives rustfmt 1.10.0-nightly (feaadeeaca 2026-09-19). It matches
# the CI image, so local and CI format the same way. Bump both together.
channel = "nightly-2026-09-20"
components = ["clippy", "rustfmt", "rustc-dev", "rust-src", "rustc-codegen-cranelift"]
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-apple-ios",
    "x86_64-linux-android",
    "x86_64-pc-windows-gnu",
]
profile = "default"
