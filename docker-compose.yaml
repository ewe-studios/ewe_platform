# ewe_platform development environment
#
#   docker compose up macos -d     # macOS Sequoia (iOS build + simulator)
#   docker compose up android -d   # Android emulator
#   docker compose up windows -d   # Windows VM (testing + artifacts)
#   docker compose up -d           # all active services
#
# First boot takes 10-15 minutes — macOS/Windows download base images.
# Access: VNC to localhost:5900 (macOS), web UI at localhost:8007 (android) / localhost:8008 (windows),
#         RDP to localhost:3389 (windows, user: Docker, pass: admin).

services:
  macos:
    image: dockurr/macos
    container_name: macos
    environment:
      VERSION: "15"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - /home/darkvoid/Boxxed/@dev/macos:/storage
      - /home/darkvoid/Boxxed/@dev/ewe_platform:/shared
    restart: unless-stopped
    stop_grace_period: 2m
    profiles: [macos]

  android:
    image: dockurr/android
    container_name: ewe_android
    environment:
      ANDROID_VERSION: "14.0"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm
    ports:
      - "8007:8006"   # web UI (VNC viewer)
    volumes:
      - ./android_shared:/shared
    profiles: [android]

  windows:
    image: dockurr/windows
    container_name: ewe_windows
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "128G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8008:8006"       # web UI (VNC viewer)
      - "3389:3389/tcp"   # RDP (preferred after install)
      - "3389:3389/udp"   # RDP (UDP for better performance)
    volumes:
      - /home/darkvoid/Boxxed/@dev/windows:/storage
      - /home/darkvoid/Boxxed/@dev/ewe_platform:/shared
    restart: unless-stopped
    stop_grace_period: 2m
    profiles: [windows]
