services:
  qemu:
    image: ewestudios/qemu
    container_name: qemu
    environment:
      BOOT: "mint"
      CLIPBOARD: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./qemu:/storage
    restart: always
    stop_grace_period: 2m
