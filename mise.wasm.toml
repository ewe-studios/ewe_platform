# =============================================================================
# EWE Platform - wasm mise environment
# =============================================================================
# Loaded when MISE_ENV=wasm is set: `MISE_ENV=wasm mise run <task>`.
# This file overlays mise.toml. It pins only the two tools the wasm runtime
# tests need (deno and wasm-bindgen) and turns off automatic install, so a
# wasm task does not first build every tool in mise.toml.
# =============================================================================

[settings]
auto_install = false

[tools]
"aqua:denoland/deno" = "2.9.7"
# Must match the wasm-bindgen version in Cargo.lock (CI checks this).
"github:wasm-bindgen/wasm-bindgen" = "0.2.126"

[tasks."test:wasm-testbed:deno"]
alias = "test-wasm-testbed-deno"
description = "Owned #[wasm_test] harness e2e on the EMBEDDED Deno runtime (spec-44) — in-process, zero node/deno install. Sample crate + ported JS-yield tests."
run = """
echo "Owned wasm-testbed sample (embedded deno, filtered green subset)..."
cargo run -p foundation_testbed --no-default-features --features wasm-embedded-js --profile uat --bin wasm-testbed -- deno backends/foundation_testbed/integration/module --filter passes
echo "Ported foundation_core JS-yield tests (embedded deno)..."
cargo run -p foundation_testbed --no-default-features --features wasm-embedded-js --profile uat --bin wasm-testbed -- deno backends/foundation_core/integration/wasm_tests
echo "✓ owned embedded-deno harness green"
"""

[tasks."test:wasm-bindgen:deno"]
alias = "test-wasm-bindgen-deno"
description = "valtron's js-wasmbindgen backend (the one Workers run) under Deno: park → wake → microtask resume, JS yield (spec 68). Needs the mise-pinned deno + wasm-bindgen."
run = """
# Full tool names: the short names are looked up in mise's registry, which
# has no `wasm-bindgen`, and would also ignore the pins above.
mise install aqua:denoland/deno github:wasm-bindgen/wasm-bindgen
cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-deno ./backends/foundation_core --features js-wasmbindgen,std --filter wasm_js_yield_integration
"""

[tasks."test:wasm-bindgen:core"]
alias = "test-wasm-bindgen-core"
description = "foundation_core's 19 `dual!` wasm-bindgen cases on the Deno host (#575). Needs the mise-pinned deno + wasm-bindgen."
run = """
mise install aqua:denoland/deno github:wasm-bindgen/wasm-bindgen
cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-deno ./backends/foundation_core --features js-wasmbindgen,std --filter async_first_api
"""

[tasks."test:wasm-bindgen:netio"]
alias = "test-wasm-bindgen-netio"
description = "foundation_netio's wasm suite on the Deno host: the streaming body, the exchange client, SSE and WebSocket (spec 85 T6). Needs the mise-pinned deno + wasm-bindgen."
run = """
mise install aqua:denoland/deno github:wasm-bindgen/wasm-bindgen
cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-deno ./backends/foundation_netio --features wasm-fetch
"""

[tasks."test:wasm-bindgen:connectrpc"]
alias = "test-wasm-bindgen-connectrpc"
description = "The standalone wasm test crate for foundation_connectrpc's streaming sink and foundation_http's streaming inbound bridge (spec 85 T6)."
run = """
mise install aqua:denoland/deno github:wasm-bindgen/wasm-bindgen
cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-deno ./backends/foundation_connectrpc/integration/wasm
"""

[tasks."test:wasm-bindgen:web"]
alias = "test-wasm-bindgen-web"
description = "The wasm-bindgen web runner in headless Chromium: foundation_core's 34 wasm-bindgen cases (spec 88 T9, #586)."
depends = ["test:browsers:chromium"]
run = """
mise install github:wasm-bindgen/wasm-bindgen
cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-web ./backends/foundation_core --features js-wasmbindgen,std --headless
"""

[tasks."test:wasm-testbed:bindgen-fails"]
alias = "test-wasm-testbed-bindgen-fails"
description = "Regression check: a case that fails turns both wasm-bindgen runners red (spec 88 rules I1, I7, R14). The step passes only when both commands fail."
run = """
#!/usr/bin/env bash
set -uo pipefail
fixture="backends/foundation_testbed/integration/bindgen_failing_case"
if cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-deno "$fixture" --filter b_fails; then
  echo "bindgen-deno reported success for a failing case" >&2
  exit 1
fi
if cargo run -p foundation_testbed --features wasm --profile uat --bin wasm-testbed -- test bindgen-web "$fixture" --filter b_fails --headless; then
  echo "bindgen-web reported success for a failing case" >&2
  exit 1
fi
echo "✓ both wasm-bindgen runners reject a failing case"
"""
