name: Windows database recipe verification
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_UAT_DEBUG: "0"
jobs:
  windows-test:
    name: Windows database recipes
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      CARGO_HOME: D:/c
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Allow long Git paths
        run: git config --global core.longpaths true

      - name: Put CMake on the PATH
        run: |
          if command -v cmake >/dev/null 2>&1; then cmake --version; exit 0; fi
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs="$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')"
          dir="$(cygpath -u "$vs")/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin"
          if [ ! -x "$dir/cmake.exe" ]; then
            echo "::error::no cmake.exe under $vs"
            exit 1
          fi
          cygpath -w "$dir" >> "$GITHUB_PATH"
          "$dir/cmake.exe" --version

      - name: Install the pinned toolchain
        # Same logic as `macos-test`. `python` is the Windows interpreter name.
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Install the pinned protoc
        # The build script of foundation_agent_rpc runs protoc. The Linux CI
        # image pins 36.2 (ci/platform-images/mise/mise.toml). The hosted
        # macOS and Windows runners have no protoc, so the build failed there
        # (#599). The asset and the checksum are the same as in mise.lock.
        shell: bash
        run: |
          version=36.2
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  asset="osx-aarch_64"; sha="9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466" ;;
            Darwin-x86_64) asset="osx-x86_64"; sha="228cc7add4616cc14ca5e80dee83209d44449a7aee95a914ae748fa374efb078" ;;
            MINGW*-x86_64) asset="win64"; sha="f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3" ;;
            *)
              echo "::error::no pinned protoc $version asset for $(uname -s)-$(uname -m)"
              exit 1
              ;;
          esac
          # cygpath -m gives a path that both bash and the native Windows
          # Python read.
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "$RUNNER_TEMP")/protoc-$version"
          else
            dir="$RUNNER_TEMP/protoc-$version"
          fi
          mkdir -p "$dir"
          curl -sSL -o "$dir/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-$asset.zip"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $dir/protoc.zip" | sha256sum -c -
          else
            echo "$sha  $dir/protoc.zip" | shasum -a 256 -c -
          fi
          python=$(command -v python3 || command -v python)
          "$python" -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$dir/protoc.zip" "$dir"
          # A zip file does not record the executable bit.
          chmod +x "$dir"/bin/protoc*
          "$dir/bin/protoc" --version
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Verify the conditional write race
        run: cargo test --locked --profile uat -p foundation_db --test r2_state_store_tests

      - name: Verify the standard Windows database recipes
        env:
          CI_PROFILE: uat
        run: cargo run --locked --profile uat -p foundation_ci -- run-many --step test foundation_db
