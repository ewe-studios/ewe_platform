name: "Audit: Checks & Tests"

# Per-package CI. A `plan` job works out which workspace packages a change
# affects (the packages whose files changed, plus everything that depends on
# them), then every selected package gets its own job: rustfmt, build, clippy,
# tests.
# Per-package settings live in ci/packages.toml; the driver is
# scripts/ci/ci.py, which you can run locally (`make ci-package PACKAGE=...`).
#
# Every package job runs inside the ewe_platform CI image
# (ci/ewe-platform-image): the pinned toolchain, system libraries (GTK/WebKit,
# Vulkan, Mesa, ...), tools and the baked submodules are already there, so
# jobs install nothing. The `image` job makes sure the image for this
# commit's inputs exists (computing its content hash, building and pushing it
# only when it is missing) before the package jobs start; see
# ci/platform-images/README.md.
#
# A `macos-test` job and a `windows-test` job run the tests of every selected
# package on a macOS and a Windows runner. A package opts out with
# `macos-tests = "none"` / `windows-tests = "none"` and a reason in
# ci/packages.toml. The plan step fails when an opt-out has no reason.
#
# Pull requests test only what they affect, on all three operating systems. A
# push to master tests what the merge affected (against the commit before the
# push). The nightly schedule and a manual "all" run test every package on
# Linux, macOS and Windows. The macOS and Windows jobs are shards of several
# packages each (`ci.py run-many`).
#
# On a pull request every package job also passes `--if-affected` to ci.py. The
# runner then decides from the change and the dependency graph whether the
# package must run, with the same rule as the plan job (`ci.py affected`).
#
# Each matrix sets `max-parallel` from ci/packages.toml ([defaults]
# `max-parallel-*`), so jobs queue on the free GitHub and Blacksmith plans and
# do not stampede. GitHub allows 256 jobs per matrix; the workspace has about
# 110 packages, so the full run fits in one matrix.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "17 2 * * *" # nightly full run, catches drift from dependencies
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to test: comma/space separated names, or 'all'"
        required: false
        default: "all"

# A new push to a pull request cancels the old run of that pull request. Runs on
# master, the nightly schedule and manual runs queue and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller target dirs and caches: no incremental state, no debuginfo.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_UAT_DEBUG: "0"
  # `uat` is `dev` on LLVM — what the test docs use. (Locally, mise's env puts
  # `dev` on Cranelift, which CI does not install and which can't do
  # catch_unwind.)
  CI_PROFILE: uat
  # The pull request base commit. `ci.py run --if-affected` diffs against it, so
  # a package job skips itself when the change does not affect the package. It
  # is empty on master, nightly and manual runs, which test everything.
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  image:
    name: CI image
    uses: ./.github/workflows/platform-images.yaml
    with:
      config: ci/ewe-platform-image/config.toml
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

  plan:
    name: Plan
    # Only reads `cargo metadata`, so it runs on the runner, in parallel with
    # the image job.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      # Every selected package that is not opted out of macOS in ci/packages.toml.
      macos-matrix: ${{ steps.plan.outputs.macos-matrix }}
      macos-count: ${{ steps.plan.outputs.macos-count }}
      macos-shard-count: ${{ steps.plan.outputs.macos-shard-count }}
      # Every selected package that is not opted out of Windows.
      windows-matrix: ${{ steps.plan.outputs.windows-matrix }}
      windows-count: ${{ steps.plan.outputs.windows-count }}
      windows-shard-count: ${{ steps.plan.outputs.windows-shard-count }}
      # Most jobs of one matrix that run at once (ci/packages.toml [defaults]).
      max-parallel-linux: ${{ steps.plan.outputs.max-parallel-linux }}
      max-parallel-macos: ${{ steps.plan.outputs.max-parallel-macos }}
      max-parallel-windows: ${{ steps.plan.outputs.max-parallel-windows }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0 # change detection diffs against the PR base
          submodules: false

      - name: Install the pinned toolchain
        # Skip the install when rustup already has the channel. The runner keeps
        # a Rust toolchain. An install contacts static.rust-lang.org; a runner
        # that lost the network failed there (issue #402).
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Select packages
        id: plan
        env:
          # A pull request diffs against its base. A push to master diffs against
          # the commit before the push; ci.py tests everything when that commit
          # is missing or all zeros. The schedule and a manual run leave it empty.
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          CI_PACKAGES: ${{ github.event.inputs.packages }}
        run: python3 scripts/ci/ci.py plan

      # Every nested lockfile is checked, not only the examples. A nested
      # workspace sits outside the root workspace, so no package job builds it.
      # Its lockfile drifts behind the crate versions, and `cargo build --locked`
      # then fails there (issue #245, issue #481). `--locked` alone does not
      # check a lockfile without dependency resolution, so this reads full
      # metadata, not `--no-deps`. The root `Cargo.lock` is covered by the
      # package jobs and is skipped here.
      - name: Check the nested lockfiles
        run: |
          locks=$(git ls-files '*Cargo.lock')
          for lock in $locks; do
            if [ "$lock" = "Cargo.lock" ]; then
              continue
            fi
            dir=$(dirname "$lock")
            echo "checking $dir"
            # A failing `cargo metadata` stops the step (set -e).
            cargo metadata --locked --format-version 1 --manifest-path "$dir/Cargo.toml" > /dev/null
          done

  package:
    name: ${{ matrix.package }}
    needs: [plan, image]
    # The usual path: the image is in the registry (it existed, or the image
    # job just pushed it).
    if: needs.plan.outputs.count != '0' && needs.image.outputs.image-source == 'registry'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ${{ needs.image.outputs.image-ref }}
      # Empty for forks (no secrets): the runner then pulls anonymously.
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
      # The runner's preinstalled .NET, Android, Haskell and Boost trees are
      # mounted in so the first step can delete them: a container job cannot
      # reach the host disk otherwise, and large packages (foundation_ai,
      # the publish dry-run) ran out of space on the ~14 GB free by default.
      options: >-
        -v /usr/share/dotnet:/runner-free/dotnet
        -v /usr/local/lib/android:/runner-free/android
        -v /opt/ghc:/runner-free/ghc
        -v /usr/local/.ghcup:/runner-free/ghcup
        -v /usr/local/share/boost:/runner-free/boost
        ${{ matrix.container-options }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # From ci/packages.toml, so free-plan runners queue instead of stampede.
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel-linux) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free runner disk
        # Delete the contents of the five host trees this job mounts. The find
        # reads only these paths, not all of /runner-free. This step runs before
        # checkout, so the job owns no other directory yet: the cargo target dir
        # and the cache are inside the checkout. A timeout fails this step.
        timeout-minutes: 10
        # The container job's default shell is `sh`, which has no `pipefail`
        # and no arrays. The step needs both, so it names bash.
        shell: bash
        run: |
          set -euo pipefail
          paths=(/runner-free/dotnet /runner-free/android /runner-free/ghc /runner-free/ghcup /runner-free/boost)
          du -sh "${paths[@]}" || true
          timeout 480 find "${paths[@]}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          du -sh "${paths[@]}" || true

      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch the pull request base
        # `ci.py run --if-affected` diffs against the base commit. The checkout is
        # a depth-1 merge commit, so fetch the base commit (one commit, no history).
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Link the baked submodules
        uses: ./ci/platform-images/actions/link-submodules

      - name: Use the pinned toolchain
        # The image has the channel, its components and the wasm target (its
        # hash covers rust-toolchain.toml). Skip the install when rustup lists
        # the channel: an install contacts static.rust-lang.org, and a runner
        # that lost the network failed the whole package job there (issue
        # #402). The step still pins RUSTUP_TOOLCHAIN for the steps below.
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --no-self-update \
              --component clippy,rustfmt,rust-src --target wasm32-unknown-unknown
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # The image hash in the key: a new image (system libraries, tools)
          # starts a fresh target cache instead of linking against stale state.
          key: ${{ matrix.package }}-${{ needs.image.outputs.image-hash }}
          # CARGO_HOME/bin holds the image's rustup/cargo; don't cache it.
          cache-bin: "false"
          # Only master writes caches, so PR runs can't evict each other.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: rustfmt
        run: python3 scripts/ci/ci.py run ${{ matrix.package }} --step fmt ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: build
        run: python3 scripts/ci/ci.py run ${{ matrix.package }} --step build ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: clippy
        run: python3 scripts/ci/ci.py run ${{ matrix.package }} --step clippy ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: io_uring probe
        # Record whether the kernel and the container's seccomp profile allow
        # `io_uring_setup` before the package tests fail with EWE_REQUIRE_IO_URING=1.
        if: matrix.package == 'foundation_iogate'
        run: cargo test --profile "$CI_PROFILE" -p foundation_iogate --test io_uring_probe -- --nocapture

      - name: io_uring kernel probe
        # foundation_nativeapis and foundation_proxy also run with
        # EWE_REQUIRE_IO_URING=1 but have no probe target. Print the kernel
        # setting, the seccomp mode and the raw `io_uring_setup` result, so a
        # failed `fd,uring` run names its cause. The step never fails.
        if: matrix.package == 'foundation_nativeapis' || matrix.package == 'foundation_proxy'
        run: |
          {
          echo "kernel: $(uname -r)"
          echo "kernel.io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>&1)"
          grep -E '^Seccomp' /proc/self/status || true
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          params = ctypes.create_string_buffer(120)
          fd = libc.syscall(425, 4, params)  # io_uring_setup(entries, params)
          if fd >= 0:
              print("io_uring_setup: ok")
              os.close(fd)
          else:
              e = ctypes.get_errno()
              print(f"io_uring_setup: failed errno={e} ({os.strerror(e)})")
          PY
          } 2>&1 | tee /tmp/io_uring_probe.txt

      - name: ptrace probe
        # Record whether this kernel lets a tracer read its child's registers
        # before the ptrace spawn tests run. EWE_REQUIRE_PTRACE makes a missing
        # kernel fail here with the cause, not as 8 spawn-test failures below.
        if: matrix.package == 'foundation_nativeapis'
        env:
          EWE_REQUIRE_PTRACE: "1"
        run: cargo test --profile "$CI_PROFILE" -p foundation_nativeapis --features vfs-native,vfs-ptrace --test ptrace_probe -- --nocapture

      - name: test
        run: python3 scripts/ci/ci.py run ${{ matrix.package }} --step test ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: wasm
        run: python3 scripts/ci/ci.py run ${{ matrix.package }} --step wasm ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: io_uring probe result
        # Print the probe result again at the end of the job. The test step
        # prints thousands of lines, and the log API returns only the last
        # 5000, so the first copy is often out of reach.
        if: always() && (matrix.package == 'foundation_nativeapis' || matrix.package == 'foundation_proxy')
        run: cat /tmp/io_uring_probe.txt || echo "the io_uring probe did not run"

  package-artifact:
    name: ${{ matrix.package }}
    needs: [plan, image]
    # Pull requests without registry credentials (forks, Dependabot) whose
    # changes need an image that isn't in the registry yet: the image job
    # built it as an artifact. `container:` can only pull from a registry, so
    # load the image and run the same steps in it with `docker exec`.
    if: needs.plan.outputs.count != '0' && needs.image.outputs.image-source == 'artifact'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # From ci/packages.toml, so free-plan runners queue instead of stampede.
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel-linux) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.image.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch the pull request base
        # `ci.py run --if-affected` diffs against the base commit. The checkout is
        # a depth-1 merge commit, so fetch the base commit (one commit, no history).
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Download the image
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.image.outputs.artifact-name }}
          path: ${{ runner.temp }}/image

      - name: Start the image
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image/image.tar"
          rm -rf "$RUNNER_TEMP/image"
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          # The runner's Docker socket goes in too, as it does for the
          # `container:` jobs above: Docker-backed tests (the
          # #[docker_container] macro) run against the runner's daemon, so
          # both paths must test the same thing.
          docker run --detach --name ci \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            ${{ matrix.container-options }} \
            --env GITHUB_ACTIONS --env CI --env CARGO_TERM_COLOR --env CARGO_INCREMENTAL \
            --env CARGO_PROFILE_UAT_DEBUG --env CI_PROFILE --env RUSTUP_TOOLCHAIN="$toolchain" \
            "$IMAGE" sleep infinity

      - name: Link the baked submodules
        run: docker exec ci nu ci/platform-images/scripts/link-submodules.nu --workspace "$GITHUB_WORKSPACE"

      - name: rustfmt
        run: docker exec --env CI_BASE_SHA --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' ci python3 scripts/ci/ci.py run ${{ matrix.package }} --step fmt ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: build
        run: docker exec --env CI_BASE_SHA --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' ci python3 scripts/ci/ci.py run ${{ matrix.package }} --step build ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: clippy
        run: docker exec --env CI_BASE_SHA --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' ci python3 scripts/ci/ci.py run ${{ matrix.package }} --step clippy ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: io_uring probe
        if: matrix.package == 'foundation_iogate'
        run: docker exec ci cargo test --profile "$CI_PROFILE" -p foundation_iogate --test io_uring_probe -- --nocapture

      - name: ptrace probe
        # Same probe as the `package` job. `docker exec` does not inherit the
        # step environment, so pass the variable into the container.
        if: matrix.package == 'foundation_nativeapis'
        run: docker exec --env EWE_REQUIRE_PTRACE=1 ci cargo test --profile "$CI_PROFILE" -p foundation_nativeapis --features vfs-native,vfs-ptrace --test ptrace_probe -- --nocapture

      - name: test
        run: docker exec --env CI_BASE_SHA --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' ci python3 scripts/ci/ci.py run ${{ matrix.package }} --step test ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

      - name: wasm
        run: docker exec --env CI_BASE_SHA --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' ci python3 scripts/ci/ci.py run ${{ matrix.package }} --step wasm ${{ github.event_name == 'pull_request' && '--if-affected' || '' }}

  windows:
    name: Windows check
    needs: plan
    # The Windows branches of foundation_netio and foundation_nativeapis are
    # compiled nowhere else on a pull request: the Linux image cannot build
    # them, and the Windows virtual machine run is nightly only (issue #484).
    # The job runs when the plan selected either package. Master, nightly and
    # manual runs select every package, so it always runs there.
    # The matrix JSON holds each name in quotes, so this match is exact.
    if: >-
      needs.plan.result == 'success' &&
      (contains(needs.plan.outputs.matrix, '"foundation_netio"') ||
      contains(needs.plan.outputs.matrix, '"foundation_nativeapis"'))
    # Same Blacksmith Windows image as `windows-test`.
    runs-on: blacksmith-4vcpu-windows-2025
    # Limit, not a measurement: a cold build of both packages takes about 15 to
    # 20 minutes on this runner, and a warm cache cuts that to a few minutes.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Install the pinned toolchain
        # Same pin as the other jobs. The environment variable also stops
        # rustup from installing every target and component that
        # rust-toolchain.toml lists. rustfmt is here because the build scripts
        # of some generated crates run it.
        shell: bash
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-check
          # Only master writes caches, so PR runs can't evict each other.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check foundation_netio
        run: cargo check --profile "$env:CI_PROFILE" --all-targets -p foundation_netio

      - name: Check foundation_netio with QUIC
        run: cargo check --profile "$env:CI_PROFILE" --all-targets -p foundation_netio --features quic

      - name: Check foundation_nativeapis with IPC
        run: cargo check --profile "$env:CI_PROFILE" --all-targets -p foundation_nativeapis --features ipc

  macos-test:
    name: macOS ${{ matrix.shard }}
    needs: plan
    # Runs the tests of every selected package that is not opted out of macOS
    # (ci/packages.toml). One job is a shard: it tests several packages in a row
    # with one target directory (`ci.py run-many`), so shared dependencies build
    # once. The plan job sets the shard count (`macos-shards`).
    # No container and no CI image: the job runs on the macOS runner itself.
    if: needs.plan.outputs.macos-count != '0'
    # The Blacksmith macOS 26 image has every Xcode from 26.0 to 27.0.
    # DEVELOPER_DIR picks Xcode 26.2, the same as the `macos` job.
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: ${{ matrix.timeout }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel-macos) }}
      matrix: ${{ fromJSON(needs.plan.outputs.macos-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch the pull request base
        # `ci.py run --if-affected` diffs against the base commit. The checkout is
        # a depth-1 merge commit, so fetch the base commit (one commit, no history).
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Fetch llama.cpp
        if: matrix.llama
        run: git submodule update --init --depth 1 tools/llama.cpp

      - name: Install the pinned toolchain
        # Skip the install when rustup lists the channel, so a missing network
        # cannot fail the job (issue #402). rustfmt is there because the
        # generated provider crates' build scripts run it.
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-test-${{ matrix.index }}
          cache-bin: "false"
          # Only master writes caches, so PR runs can't evict each other.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: test
        # On a macOS host, ci.py runs only the test step, with the macOS runs.
        run: python3 scripts/ci/ci.py run-many --step test ${{ github.event_name == 'pull_request' && '--if-affected' || '' }} ${{ matrix.packages }}

  windows-test:
    name: Windows ${{ matrix.shard }}
    needs: plan
    # Runs the tests of every selected package that is not opted out of Windows
    # (ci/packages.toml), in shards like `macos-test`.
    # No container: the job runs on the Windows runner itself.
    if: needs.plan.outputs.windows-count != '0'
    # RUNNER LABEL: change it on this line only. The `env` context is not
    # available in `runs-on`, so a workflow-level variable cannot hold it.
    # Blacksmith Windows Server 2025: Visual Studio 2022 (MSVC), Windows SDK
    # 10.0.26100, LLVM, Git, Python 3.12 and 67 GB free disk (probe 2026-11-11).
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel-windows) }}
      matrix: ${{ fromJSON(needs.plan.outputs.windows-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch the pull request base
        # `ci.py run --if-affected` diffs against the base commit. The checkout is
        # a depth-1 merge commit, so fetch the base commit (one commit, no history).
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Fetch llama.cpp
        if: matrix.llama
        run: git submodule update --init --depth 1 tools/llama.cpp

      - name: Install the pinned toolchain
        # Same logic as `macos-test`. `python` is the Windows interpreter name.
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-test-${{ matrix.index }}
          cache-bin: "false"
          # Only master writes caches, so PR runs can't evict each other.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: test
        # On a Windows host, ci.py runs only the test step, with the Windows runs.
        run: python scripts/ci/ci.py run-many --step test ${{ github.event_name == 'pull_request' && '--if-affected' || '' }} ${{ matrix.packages }}

  # One stable check to mark as required in branch protection: it passes when
  # every selected package passed, or when no package needed testing.
  checks-passed:
    name: Checks passed
    needs: [image, plan, package, package-artifact, windows, macos-test, windows-test]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Evaluate
        env:
          IMAGE: ${{ needs.image.result }}
          PLAN: ${{ needs.plan.result }}
          PACKAGES: ${{ needs.package.result }}
          PACKAGES_ARTIFACT: ${{ needs.package-artifact.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS_TESTS: ${{ needs.macos-test.result }}
          WINDOWS_TESTS: ${{ needs.windows-test.result }}
        run: |
          echo "image: $IMAGE, plan: $PLAN, packages: $PACKAGES, packages (image artifact): $PACKAGES_ARTIFACT, windows: $WINDOWS, macOS tests: $MACOS_TESTS, Windows tests: $WINDOWS_TESTS"
          if [ "$IMAGE" != "success" ] || [ "$PLAN" != "success" ]; then exit 1; fi
          for result in "$PACKAGES" "$PACKAGES_ARTIFACT" "$WINDOWS" "$MACOS_TESTS" "$WINDOWS_TESTS"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  publish-dry-run:
    name: Publish dry-run
    needs: image
    # Packaging the whole workspace is slow; run it where releases happen.
    # Non-PR events always have registry credentials, so the image is there.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ${{ needs.image.outputs.image-ref }}
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
      # The runner's preinstalled .NET, Android, Haskell and Boost trees are
      # mounted in so the first step can delete them: a container job cannot
      # reach the host disk otherwise, and large packages (foundation_ai,
      # the publish dry-run) ran out of space on the ~14 GB free by default.
      options: >-
        -v /usr/share/dotnet:/runner-free/dotnet
        -v /usr/local/lib/android:/runner-free/android
        -v /opt/ghc:/runner-free/ghc
        -v /usr/local/.ghcup:/runner-free/ghcup
        -v /usr/local/share/boost:/runner-free/boost
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        # Delete the contents of the five host trees this job mounts. The find
        # reads only these paths, not all of /runner-free. This step runs before
        # checkout, so the job owns no other directory yet: the cargo target dir
        # and the cache are inside the checkout. A timeout fails this step.
        timeout-minutes: 10
        # The container job's default shell is `sh`, which has no `pipefail`
        # and no arrays. The step needs both, so it names bash.
        shell: bash
        run: |
          set -euo pipefail
          paths=(/runner-free/dotnet /runner-free/android /runner-free/ghc /runner-free/ghcup /runner-free/boost)
          du -sh "${paths[@]}" || true
          timeout 480 find "${paths[@]}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          du -sh "${paths[@]}" || true

      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Check out the baked submodules
        # `cargo publish` refuses a dirty tree, and a symlink where a gitlink
        # belongs is a change: use real submodule checkouts, cloned from the
        # baked copies (still no network).
        uses: ./ci/platform-images/actions/link-submodules
        with:
          mode: submodule

      - name: Use the stable release toolchain
        # The dry-run packages and builds what a release publishes, so it uses
        # the release toolchain (stable, ci/release-rust-toolchain). This also
        # keeps the workspace loadable and buildable on stable. Skip the
        # install when rustup lists the channel; an install contacts the
        # network (issue #402).
        run: |
          toolchain=$(tr -d '[:space:]' < ci/release-rust-toolchain)
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Package every publishable crate
        # `cargo publish --dry-run` resolves each dependency on crates.io. The
        # workspace versions stay ahead of crates.io until release-plz
        # publishes them, so that command fails between releases. This step
        # packages against a local patch table instead; the per-package build,
        # clippy and test jobs build the same sources.
        run: python3 scripts/ci/package_workspace.py

  macos:
    name: macOS build
    # A full macOS build is expensive; run it on master, nightly and on demand.
    if: github.event_name != 'pull_request'
    # The Blacksmith macOS 26 image has every Xcode from 26.0 to 27.0.
    # DEVELOPER_DIR picks Xcode 26.2, which ships the iPhoneOS 26.2 SDK. The
    # macOS VM image pins the same SDK (components.env IOS_SDK_VERSION).
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch llama.cpp
        run: git submodule update --init --depth 1 tools/llama.cpp

      - name: Install the pinned toolchain
        # `--profile minimal` leaves out rustfmt, but the generated provider
        # crates' build scripts (hetzner, cloudflare, ...) run it to check
        # their committed `src/generated/` against the spec. Skip the install
        # when rustup lists the channel, so a missing network cannot fail the
        # build (issue #402).
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          if ! rustup toolchain list | grep -q "^${toolchain}"; then
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --profile uat --workspace

      - name: Check the iOS target
        # The job uses Xcode 26.2, so the check runs against the iPhoneOS 26.2
        # SDK, the same SDK as the VM pin. The step fails if the SDK is
        # different. The VM job `macos-ssh` (platform-vms.yaml) runs the same
        # checks inside the VM (#355, #464). LLVM is required: Cranelift
        # cannot build ring for iOS.
        run: |
          rustup target add aarch64-apple-ios
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $sdk"
          test "$sdk" = "26.2" || { echo "::error::expected the iPhoneOS 26.2 SDK, got $sdk"; exit 1; }
          cargo check -p foundation_wireguard --target aarch64-apple-ios --features spec55-complete --profile uat
          cargo check -p foundation_platform --target aarch64-apple-ios --profile uat
          cargo check -p foundation_nativeapis --target aarch64-apple-ios --features watcher-macos --profile uat
