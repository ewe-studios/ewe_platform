# Platform Docker Tests (spec-52 F30 Layer 3)
#
# Boots the macOS and Windows VM host containers and smoke-tests them from the
# host side: the container starts, its web console answers, and the repository
# is mounted at `/shared`.
#
# The images run the guest operating system in QEMU inside the container.
# `docker exec` reaches the container's Linux side, never the guest, so this
# workflow cannot build or test anything inside macOS or Windows. Those checks
# run in the provisioned VM images of `.github/workflows/platform-vms.yaml`,
# which reach the guest over SSH (nightly and manual only).
#
# Triggers:
#   - Manual: workflow_dispatch
#   - Push: branches matching spec*/platform* (feature branches)
#   - Schedule: daily at 3am UTC (catch regressions)

name: Platform Docker Tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**/platform**'
      - '**/spec**'
      - '**/foundation-platform**'
    paths:
      - 'backends/foundation_platform/**'
      - 'backends/foundation_testbed/**'
      - 'backends/foundation_macros/**'
      - 'examples/platform_*/**'
      - 'docker-compose.yaml'
      - 'scripts/ci/vm-host-smoke.sh'
      - '.github/workflows/platform-docker-tests.yml'
  schedule:
    - cron: '37 3 * * *'  # 3:37am UTC daily (off-peak)

jobs:
  # ── macOS VM host ───────────────────────────────────────────────────────
  macos-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The macOS image is large and plays its guest disk on a cold runner, which
    # installs macOS from scratch. The smoke test does not wait for that install.
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Smoke-test the macOS VM host
        # `docker-compose.yaml` defaults these to the developer's own
        # directories. They do not exist on a runner, and Docker answers a
        # missing host path by creating an empty directory: the container would
        # then have no repository at `/shared` and no VM disk at `/storage`.
        env:
          EWE_SHARED_DIR: ${{ github.workspace }}
          EWE_MACOS_STORAGE: ${{ runner.temp }}/macos-storage
        run: scripts/ci/vm-host-smoke.sh macos ewe_macos 8006 600

      - name: Docker connectivity tests
        # The test file is an integration test, so `--test`, not `--lib`. This
        # job boots the macOS container only, so it runs that container's test.
        run: |
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- builder_with_vnc
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- builder_container_not_found
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- port_is_open

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "# docker compose ps"
            docker compose -f docker-compose.yaml ps || true
            echo
            echo "# docker logs ewe_macos (last 200 lines)"
            docker logs --tail 200 ewe_macos 2>&1 || true
          } > macos-host-diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-artifacts
          path: |
            macos-host-diagnostics.txt
          retention-days: 7

  # ── Windows VM host ─────────────────────────────────────────────────────
  windows-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Smoke-test the Windows VM host
        # The Windows image publishes its web console on host port 8008.
        env:
          EWE_SHARED_DIR: ${{ github.workspace }}
          EWE_WINDOWS_STORAGE: ${{ runner.temp }}/windows-storage
        run: scripts/ci/vm-host-smoke.sh windows ewe_windows 8008 600

      - name: Docker connectivity tests
        run: |
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- builder_with_rdp
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- builder_container_not_found
          cargo test -p foundation_testbed --features docker-tests --test docker_tests -- port_is_open

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "# docker compose ps"
            docker compose -f docker-compose.yaml ps || true
            echo
            echo "# docker logs ewe_windows (last 200 lines)"
            docker logs --tail 200 ewe_windows 2>&1 || true
          } > windows-host-diagnostics.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-artifacts
          path: |
            windows-host-diagnostics.txt
          retention-days: 7

  # ── Platform unit tests (in-memory, no Docker needed) ──────────────────
  platform-unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@v1

      # `foundation_platform` depends on `tauri`, whose Linux build needs the
      # GTK/WebKit development packages. Without them `cargo test` stops in
      # `glib-sys`'s build script: "Package 'glib-2.0' not found".
      - name: Install the Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libayatana-appindicator3-dev \
            libssl-dev patchelf

      - name: Run foundation_platform tests
        run: cargo test -p foundation_platform -- --test-threads=1

      - name: Run foundation_macros tests
        run: cargo test -p foundation_macros

      - name: Check foundation_ui_components
        run: cargo check -p foundation_ui_components
