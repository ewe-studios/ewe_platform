# Platform Docker Tests (spec-52 F30 Layer 3)
#
# Boots macOS + Windows Docker containers and runs cross-platform tests
# against the foundation_testbed TestEnvironmentBuilder.
#
# Triggers:
#   - Manual: workflow_dispatch
#   - Push: branches matching spec*/platform* (feature branches)
#   - Schedule: daily at 3am UTC (catch regressions)

name: Platform Docker Tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**/platform**'
      - '**/spec**'
      - '**/foundation-platform**'
    paths:
      - 'backends/foundation_platform/**'
      - 'backends/foundation_testbed/**'
      - 'backends/foundation_macros/**'
      - 'examples/platform_*/**'
  schedule:
    - cron: '37 3 * * *'  # 3:37am UTC daily (off-peak)

jobs:
  # ── macOS tests ─────────────────────────────────────────────────────────
  macos-tests:
    runs-on: ubuntu-latest
    # A cold runner has an empty `/storage`, so the image installs macOS from
    # scratch. The Windows image does the same and takes 22 minutes; macOS is
    # slower, so the job gets more room than the Windows job.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Boot macOS container
        run: |
          # `docker-compose.yaml` names the container `ewe_macos`, not `macos`.
          # This job used the service name, so every `docker exec` failed and the
          # wait loop below ran its full window without ever becoming ready.
          container=ewe_macos
          docker compose -f docker-compose.yaml up macos -d
          echo "Waiting for macOS to boot (up to 45 minutes)..."
          ready=0
          for i in $(seq 1 270); do
            if docker exec "$container" sh -c 'echo ready' 2>/dev/null; then
              echo "macOS ready after $((i * 10)) seconds"
              ready=1
              break
            fi
            # Fail at once when the VM died, and say why. A silent wait hides
            # the container's own error message until the job times out.
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null)" != "true" ]; then
              echo "::error::the $container container is not running"
              docker logs --tail 100 "$container" || true
              exit 1
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "::error::macOS did not become ready in 45 minutes"
            docker logs --tail 100 "$container" || true
            exit 1
          fi

      - name: Install Rust on macOS
        run: |
          docker exec ewe_macos bash -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source ~/.cargo/env
            rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          '

      - name: Docker connectivity tests
        run: |
          cargo test -p foundation_testbed --features docker-tests --lib -- docker

      - name: iOS target check
        run: |
          docker exec ewe_macos bash -c '
            source ~/.cargo/env
            export RUSTUP_TOOLCHAIN=stable
            cd /shared/examples/platform_ios/src-tauri
            cargo check --target aarch64-apple-ios
          '

      - name: Collect screenshots
        if: always()
        run: |
          docker exec ewe_macos screencapture -x /tmp/screenshot.png 2>/dev/null || true
          docker cp ewe_macos:/tmp/screenshot.png ./macos-screenshot.png 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-artifacts
          path: |
            macos-screenshot.png
          retention-days: 7

  # ── Windows tests ───────────────────────────────────────────────────────
  windows-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot Windows container
        run: |
          container=ewe_windows
          docker compose -f docker-compose.yaml up windows -d
          echo "Waiting for Windows to boot (up to 20 minutes)..."
          ready=0
          for i in $(seq 1 120); do
            if docker exec "$container" cmd /c "echo ready" 2>/dev/null; then
              echo "Windows ready after $((i * 10)) seconds"
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null)" != "true" ]; then
              echo "::error::the $container container is not running"
              docker logs --tail 100 "$container" || true
              exit 1
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Windows did not become ready in 20 minutes"
            docker logs --tail 100 "$container" || true
            exit 1
          fi

      - name: Docker connectivity tests
        run: |
          cargo test -p foundation_testbed --features docker-tests --lib -- docker

      - name: Collect artifacts
        if: always()
        run: |
          docker exec ewe_windows cmd /c "ver" 2>/dev/null > windows-version.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-artifacts
          path: |
            windows-version.txt
          retention-days: 7

  # ── Platform unit tests (in-memory, no Docker needed) ──────────────────
  platform-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `foundation_platform` depends on `tauri`, whose Linux build needs the
      # GTK/WebKit development packages. Without them `cargo test` stops in
      # `glib-sys`'s build script: "Package 'glib-2.0' not found".
      - name: Install the Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libayatana-appindicator3-dev \
            libssl-dev patchelf

      - name: Run foundation_platform tests
        run: cargo test -p foundation_platform -- --test-threads=1

      - name: Run foundation_macros tests
        run: cargo test -p foundation_macros

      - name: Check foundation_ui_components
        run: cargo check -p foundation_ui_components
