name: Release binaries

# Builds release binaries inside the CI image, so a release is built with
# exactly the toolchain, libraries and submodules CI tested with.
#
#   - push a tag `v*` (or release-plz tags `ewe_platform-v*`): build, upload as workflow artifacts and attach to the
#     GitHub release for that tag (created as a draft if it doesn't exist)
#   - run it manually: build and upload as workflow artifacts only
#
# Linux x86_64 binaries come from the default image. The CUDA variant (the
# llama.cpp-backed binaries with `foundation_ai/cuda`, built in the cuda
# image) is opt-in, because nvcc makes it long.

on:
  push:
    tags:
      - "v*"
      # Tagged by release-plz when it publishes the ewe_platform crate
      # (.github/workflows/release-plz.yaml).
      - "ewe_platform-v*"
  workflow_dispatch:
    inputs:
      packages:
        description: Bin packages to build (space separated)
        type: string
        default: "ewe_platform answerme-agent foundation_deployment_platform foundation_codegentools foundation_keychain foundation_connectrpc_codegen foundation_testbed"
      cuda:
        description: Also build the CUDA variant of the llama.cpp-backed binaries
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same list as the workflow_dispatch default, for tag pushes.
  DEFAULT_PACKAGES: "ewe_platform answerme-agent foundation_deployment_platform foundation_codegentools foundation_keychain foundation_connectrpc_codegen foundation_testbed"
  # Packages built again with foundation_ai/cuda for the CUDA variant.
  CUDA_PACKAGES: "ewe_platform answerme-agent"

jobs:
  image:
    name: CI image
    uses: ./.github/workflows/platform-images.yaml
    with:
      config: ci/ewe-platform-image/config.toml
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

  image-cuda:
    name: CI image (cuda)
    if: inputs.cuda == true
    uses: ./.github/workflows/platform-images.yaml
    with:
      config: ci/ewe-platform-image/config.toml
      flavor: cuda
      free-disk: true
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

  linux:
    name: Linux x86_64
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ${{ needs.image.outputs.image-ref }}
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Link the baked submodules
        uses: ./ci/platform-images/actions/link-submodules

      - name: Build
        id: build
        env:
          PACKAGES: ${{ inputs.packages || env.DEFAULT_PACKAGES }}
        run: cargo run --locked --profile uat -p foundation_ci -- release-binaries --packages "$PACKAGES" --tag "$GITHUB_REF_NAME" --github-output

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}.tar.gz*
          if-no-files-found: error

  linux-cuda:
    name: Linux x86_64 (CUDA)
    needs: image-cuda
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ${{ needs.image-cuda.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Log in to Docker Hub
        if: needs.image-cuda.outputs.registry-username != ''
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ needs.image-cuda.outputs.registry-username }}
          password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

      - name: Build in the CUDA image
        id: build
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_OUTPUT:/ci-output" --env GITHUB_OUTPUT=/ci-output \
            --env GITHUB_ACTIONS --env CARGO_TERM_COLOR --env CARGO_INCREMENTAL \
            "$IMAGE" bash -euc '
              cargo run --locked --profile uat -p foundation_ci -- link-submodules
              exec cargo run --locked --profile uat -p foundation_ci -- release-binaries --cuda --github-output --tag "$1" --packages "$2"
            ' release "$GITHUB_REF_NAME" "$CUDA_PACKAGES"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}.tar.gz*
          if-no-files-found: error

  publish:
    name: Attach to the GitHub release
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ewe_platform-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          submodules: false

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: cargo run --locked --profile uat -p foundation_ci -- attach-binaries --tag "$TAG"
