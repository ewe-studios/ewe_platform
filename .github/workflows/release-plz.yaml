name: Publish crates to crates.io

# The title each run gets in the Actions list: what triggered it.
run-name: >-
  Publish crates to crates.io —
  ${{ github.event_name == 'workflow_dispatch' && 'manual run' || github.event.workflow_run.display_title }}

# Versions and publishes the workspace's crates with release-plz (config:
# release-plz.toml). It runs only after the "Audit: Checks & Tests" workflow (check.yaml) has passed on a
# push to master, so nothing is released from a red master.
#
#   release-pr  ("Open or update the release PR") opens or updates the "chore: release" PR: version bumps for the
#               crates that changed since their last crates.io release, the
#               version requirements of their dependents, and CHANGELOG entries.
#   publish     ("Publish to crates.io") publishes every crate whose version is not on crates.io yet and
#               tags it `<crate>-v<version>`. Ordinary merges change no
#               versions, so this is a no-op until a release PR is merged.
#               crates.io limits the publish rate. scripts/ci/publish_with_retry.py
#               runs release-plz again after each failure: it waits until the
#               retry time that crates.io gives, or backs off, and stops after
#               a set number of failures or at a deadline. The next run (or a
#               re-run of the job) continues where it stopped.
#
# Secrets:
#   CARGO_REGISTRY_TOKEN  crates.io API token with publish rights (required to
#                         publish).
#   EWE_RUNNER_REGISTRA_CLIENT_ID / _PRIVATE_KEY
#                         the repo's GitHub App (also used to register VM
#                         runners). The release-pr job mints a short-lived
#                         token from it with Contents and Pull requests write,
#                         so the app must be granted those permissions. If
#                         minting fails the job falls back to GITHUB_TOKEN,
#                         and GitHub runs no workflows for events that token
#                         creates: the release PR would get no CI.
#                         The publish job uses GITHUB_TOKEN, because an app
#                         token expires after one hour and a rate-limited
#                         publish runs for hours. A tag pushed with
#                         GITHUB_TOKEN starts no workflow, so the job starts
#                         release.yaml itself for a new ewe_platform tag.

on:
  workflow_run:
    # Must match check.yaml's `name:` exactly; renaming that workflow
    # silently stops releases.
    workflows: ["Audit: Checks & Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel one that is publishing.
concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned; bump deliberately.
  RELEASE_PLZ_VERSION: "0.3.169"

jobs:
  gate:
    name: "Gate (Audit: Checks & Tests passed on master?)"
    # A green check.yaml run for a push to master, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit to release
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${RUN_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"

  image:
    name: CI image (for building the crates)
    needs: gate
    uses: ./.github/workflows/platform-images.yaml
    with:
      config: ci/ewe-platform-image/config.toml
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: [gate, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Publishing builds every crate from its packaged tarball, llama.cpp
    # included, so it runs in the CI image with the baked submodules.
    container:
      image: ${{ needs.image.outputs.image-ref }}
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
    # The GitHub-hosted maximum. The publish step stops starting new waits at
    # its --deadline, which leaves time for the setup and the last attempt.
    timeout-minutes: 360
    permissions:
      contents: write
      # Start release.yaml for a new ewe_platform tag (see the last step).
      actions: write
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # release-plz reads tags and history
          submodules: false

      - name: Check out the baked submodules
        # Real submodule checkouts (not symlinks): cargo publish refuses a
        # dirty tree.
        uses: ./ci/platform-images/actions/link-submodules
        with:
          mode: submodule

      - name: Use the stable release toolchain
        # Releases build on stable (ci/release-rust-toolchain); the pinned
        # nightly in rust-toolchain.toml is for development only.
        run: |
          toolchain=$(tr -d '[:space:]' < ci/release-rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache release-plz
        uses: actions/cache@v6
        with:
          path: /tmp/release-plz
          key: release-plz-${{ env.RELEASE_PLZ_VERSION }}-${{ runner.os }}

      - name: Install release-plz
        run: |
          if [ ! -x /tmp/release-plz/bin/release-plz ]; then
            cargo install release-plz --version "$RELEASE_PLZ_VERSION" --locked --root /tmp/release-plz
          fi
          echo /tmp/release-plz/bin >> "$GITHUB_PATH"

      - name: Git identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "ewe-platform release bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record the ewe_platform tags
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'refs/tags/ewe_platform-v*' | awk '{print $2}' | grep -v '\^{}$' | sort > /tmp/ewe-tags-before || true

      - name: Publish what is not on crates.io yet
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io"
            exit 1
          fi
          # Defaults: 5 failures in a row with no new tag, backoff 30 s to
          # 15 min. The deadline (300 min) stays below the job timeout.
          python3 scripts/ci/publish_with_retry.py \
            --deadline 18000 \
            --progress-cmd "git ls-remote --tags origin" \
            -- release-plz release --git-token "$GITHUB_TOKEN"

      - name: Start the binary release for a new ewe_platform tag
        # Also after a failed publish: the ewe_platform crate may be out.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'refs/tags/ewe_platform-v*' | awk '{print $2}' | grep -v '\^{}$' | sort > /tmp/ewe-tags-after || true
          comm -13 /tmp/ewe-tags-before /tmp/ewe-tags-after | while read -r ref; do
            tag="${ref#refs/tags/}"
            echo "starting release.yaml for $tag"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yaml/dispatches" \
              -d "{\"ref\": \"$tag\"}"
          done

  release-pr:
    name: Open or update the release PR
    # After publishing, so the next bumps are computed against what
    # crates.io now has. Runs even when publishing failed, so the PR still
    # reflects master; it skips only when the gate did.
    needs: [gate, image, publish]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.image.result == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Publishing builds every crate from its packaged tarball, llama.cpp
    # included, so it runs in the CI image with the baked submodules.
    container:
      image: ${{ needs.image.outputs.image-ref }}
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint a release token from the GitHub App
        id: app
        # Optional: without it the job still publishes, using GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.EWE_RUNNER_REGISTRA_CLIENT_ID }}
          private-key: ${{ secrets.EWE_RUNNER_REGISTRA_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Pick the token
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::Could not mint a GitHub App token (are Contents and Pull requests write granted to the app?). Using GITHUB_TOKEN: the release PR will get no CI and tags will not trigger release.yaml."
          fi

      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # release-plz reads tags and history
          submodules: false
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Check out the baked submodules
        # Real submodule checkouts (not symlinks): cargo publish refuses a
        # dirty tree.
        uses: ./ci/platform-images/actions/link-submodules
        with:
          mode: submodule

      - name: Use the pinned nightly toolchain
        # This job uses the pinned nightly from rust-toolchain.toml, not
        # stable. release-plz copies the repository to a temporary directory
        # and runs `cargo package` at the commit of each crate's last
        # release. Commits before df86d7e6 (21 October 2026) have a root
        # Cargo.toml with the nightly-only `codegen-backend` profile key.
        # Stable cargo refuses to load those manifests ("feature
        # `codegen-backend` is required"). This job only computes versions
        # and changelogs and publishes nothing, so nightly is safe here.
        # CARGO_UNSTABLE_CODEGEN_BACKEND enables the key on nightly for an
        # old commit. The publish job stays on stable.
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "CARGO_UNSTABLE_CODEGEN_BACKEND=true" >> "$GITHUB_ENV"

      - name: Cache release-plz
        uses: actions/cache@v6
        with:
          path: /tmp/release-plz
          key: release-plz-${{ env.RELEASE_PLZ_VERSION }}-${{ runner.os }}

      - name: Install release-plz
        # Build release-plz with stable, so the cache key stays valid when
        # the pinned nightly changes.
        run: |
          if [ ! -x /tmp/release-plz/bin/release-plz ]; then
            stable=$(tr -d '[:space:]' < ci/release-rust-toolchain)
            rustup toolchain install "$stable" --profile minimal --no-self-update
            RUSTUP_TOOLCHAIN="$stable" cargo install release-plz --version "$RELEASE_PLZ_VERSION" --locked --root /tmp/release-plz
          fi
          echo /tmp/release-plz/bin >> "$GITHUB_PATH"

      - name: Git identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "ewe-platform release bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Put the gated commit on a branch
        # release-pr refuses a detached HEAD. Name a local branch after the
        # base branch, pointing at the commit the gate approved.
        env:
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: git checkout -B "$BASE_BRANCH"

      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: release-plz release-pr --git-token "$GITHUB_TOKEN"
