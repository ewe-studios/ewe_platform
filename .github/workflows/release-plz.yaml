name: Release crates

# Versions and publishes the workspace's crates with release-plz (config:
# release-plz.toml). It runs only after the Checks workflow has passed on a
# push to master, so nothing is released from a red master.
#
#   release-pr  opens or updates the "chore: release" PR: version bumps for the
#               crates that changed since their last crates.io release, the
#               version requirements of their dependents, and CHANGELOG entries.
#   release     publishes every crate whose version is not on crates.io yet and
#               tags it `<crate>-v<version>`. Ordinary merges change no
#               versions, so this is a no-op until a release PR is merged.
#
# Secrets:
#   CARGO_REGISTRY_TOKEN  crates.io API token with publish rights (required to
#                         publish).
#   RELEASE_PLZ_TOKEN     a fine-grained PAT or GitHub App token with contents
#                         and pull-requests write. Optional, but without it the
#                         release PR is opened with GITHUB_TOKEN, and GitHub
#                         runs no workflows for events that token creates: the
#                         release PR would get no CI, and the ewe_platform tag
#                         would not trigger release.yaml.

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel one that is publishing.
concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned; bump deliberately.
  RELEASE_PLZ_VERSION: "0.3.169"

jobs:
  gate:
    name: Gate
    # A green Checks run for a push to master, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit to release
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${RUN_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"

  image:
    name: CI image
    needs: gate
    uses: ./.github/workflows/platform-images.yaml
    with:
      config: ci/ewe-platform-image/config.toml
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}

  release:
    name: Publish and open the release PR
    needs: [gate, image]
    runs-on: ubuntu-latest
    # Publishing builds every crate from its packaged tarball, llama.cpp
    # included, so it runs in the CI image with the baked submodules.
    container:
      image: ${{ needs.image.outputs.image-ref }}
      credentials:
        username: ${{ needs.image.outputs.registry-username }}
        password: ${{ secrets.DOCKERHUB_EWESTUDIO_TOKEN }}
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # release-plz reads tags and history
          submodules: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - name: Check out the baked submodules
        # Real submodule checkouts (not symlinks): cargo publish refuses a
        # dirty tree.
        uses: ./ci/platform-images/actions/link-submodules
        with:
          mode: submodule

      - name: Use the pinned toolchain
        run: |
          toolchain=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache release-plz
        uses: actions/cache@v4
        with:
          path: /tmp/release-plz
          key: release-plz-${{ env.RELEASE_PLZ_VERSION }}-${{ runner.os }}

      - name: Install release-plz
        run: |
          if [ ! -x /tmp/release-plz/bin/release-plz ]; then
            cargo install release-plz --version "$RELEASE_PLZ_VERSION" --locked --root /tmp/release-plz
          fi
          echo /tmp/release-plz/bin >> "$GITHUB_PATH"

      - name: Git identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "ewe-platform release bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish what is not on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io"
            exit 1
          fi
          release-plz release --git-token "$GITHUB_TOKEN"

      # After publishing, so the next bumps are computed against what
      # crates.io now has.
      - name: Open or update the release PR
        run: release-plz release-pr --git-token "$GITHUB_TOKEN"
