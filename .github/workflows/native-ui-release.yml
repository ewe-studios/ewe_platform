name: Native UI packages
on:
  push:
    tags: ['native-ui-v*']
    branches: [master, platform/release]
    paths: &native-paths
      - 'mobile/**'
      - 'examples/ui_todo/**'
      - 'examples/mobile_starter/**'
      - 'backends/foundation_ui_*/**'
      - 'scripts/ui_native/**'
      - 'scripts/ui/**'
      - 'release/native-ui.toml'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/native-ui-release.yml'
  pull_request:
    paths: *native-paths
  workflow_dispatch:

env:
  # Install only the tools that each job uses.
  MISE_AUTO_INSTALL: "false"

permissions:
  contents: read
concurrency:
  group: native-ui-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.base_ref == 'platform/release' || github.head_ref == 'platform/release'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          command -v mise >/dev/null || brew install mise
          mise trust --yes mise.toml
          mise install --locked --yes github:google/flatbuffers java gradle kotlin http:android-sdk github:bbqsrc/cargo-ndk python
          mise run toolchain:android
      - name: Build the native task command
        run: |
          cargo build --locked --profile uat -p foundation_ui_native --features tasks --bin native-task --target-dir "$RUNNER_TEMP/native-task"
          echo "$RUNNER_TEMP/native-task/uat" >> "$GITHUB_PATH"
      - name: Check the release tag
        if: github.ref_type == 'tag'
        run: native-task task run native:release:check-version --tag "$GITHUB_REF_NAME"
      - name: Check platform bindings and build the starter applications
        run: |
          native-task task run native:bindings:sync-ios --check
          native-task task run native:bindings:sync-android --check
          python3 scripts/ui/check_behaviours.py ios
          python3 scripts/ui/check_behaviours.py android
          native-task task run native:release:prepare --output target/native-ui/candidate
          native-task task run native:release:verify --candidate target/native-ui/candidate --templates both
      - name: Run both iPhone todo apps
        run: mise exec -- native-task task run native:todo:test-ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate
          path: target/native-ui/candidate/
          if-no-files-found: error

  android-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install: false
      - name: Install the pinned protoc
        # `foundation_ui_connectrpc`'s build script runs protoc, and this job
        # builds outside the CI image (issue #875).
        run: |
          mise install --locked --yes protoc
          echo "$(mise where protoc)/bin" >> "$GITHUB_PATH"
      - name: Build the native task command
        run: |
          cargo build --locked --profile uat -p foundation_ui_native --features tasks --bin native-task --target-dir "$RUNNER_TEMP/native-task"
          echo "$RUNNER_TEMP/native-task/uat" >> "$GITHUB_PATH"
      - name: Build and exercise the Android libraries and examples
        run: |
          sudo chmod a+rw /dev/kvm
          mise trust --yes mise.toml
          mise install --locked --yes github:google/flatbuffers java gradle kotlin http:android-sdk github:bbqsrc/cargo-ndk python
          mise run toolchain:android
          native-task task run native:bindings:sync-android --check
          native-task task run native:build-android --with-todo
          repo="$RUNNER_TEMP/maven"
          native-task task run native:release:maven-local --repository "$repo"
          mise exec -- native-task task run native:todo:test-android --maven "$repo"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/native-ui-v')
    needs: [preview, android-examples]
    runs-on: ubuntu-latest
    environment: native-ui-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: candidate
      - name: Build the native task command
        run: |
          cargo build --locked --profile uat -p foundation_ui_native --features tasks --bin native-task --target-dir "$RUNNER_TEMP/native-task"
          echo "$RUNNER_TEMP/native-task/uat" >> "$GITHUB_PATH"
      - name: Sign the verified files
        env:
          SIGNING_KEY: ${{ secrets.NATIVE_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.NATIVE_RELEASE_TOKEN }}
          FINGERPRINT: ${{ vars.NATIVE_GPG_FINGERPRINT }}
        run: native-task task run native:release:sign-job --candidate candidate --out signed --public-key "$RUNNER_TEMP/native-release-public.asc"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-native-packages-${{ github.run_attempt }}
          path: signed/
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ secrets.NATIVE_RELEASE_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          NATIVE_GPG_FINGERPRINT: ${{ vars.NATIVE_GPG_FINGERPRINT }}
        run: native-task task run native:release:publish --candidate signed --resume --public-key "$RUNNER_TEMP/native-release-public.asc"

  public-install:
    needs: [preview, publish]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: candidate
      - name: Build the native task command
        run: |
          cargo build --locked --profile uat -p foundation_ui_native --features tasks --bin native-task --target-dir "$RUNNER_TEMP/native-task"
          echo "$RUNNER_TEMP/native-task/uat" >> "$GITHUB_PATH"
      - name: Resolve both public packages
        run: |
          command -v mise >/dev/null || brew install mise
          mise trust --yes mise.toml
          mise install --locked --yes java gradle http:android-sdk python node
          mise run toolchain:android
          mise exec -- native-task task run native:release:verify --candidate candidate --templates both --public
          mise exec -- native-task task run native:release:test-ios-starter

  android-device:
    needs: [preview, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the native task command
        run: |
          cargo build --locked --profile uat -p foundation_ui_native --features tasks --bin native-task --target-dir "$RUNNER_TEMP/native-task"
          echo "$RUNNER_TEMP/native-task/uat" >> "$GITHUB_PATH"
      - name: Run the public Android starter
        run: |
          sudo chmod a+rw /dev/kvm
          mise trust --yes mise.toml
          mise install --locked --yes java gradle http:android-sdk python node
          mise run toolchain:android
          mise exec -- native-task task run native:release:test-android-starter
