name: Native UI packages
on:
  push:
    tags: ['native-ui-v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: native-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: inputs
        run: |
          python3 - <<'PY'
          import os, tomllib
          c = tomllib.load(open("release/native-ui.toml", "rb"))
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != "native-ui-v" + c["version"]:
              raise SystemExit("Tag differs from release version")
          PY
      - name: Install pinned tools
        run: |
          command -v mise >/dev/null || brew install mise
          mise trust --yes mise.toml
          mise install --yes github:google/flatbuffers java gradle kotlin http:android-sdk github:bbqsrc/cargo-ndk python
          mise run toolchain:android
      - name: Check platform bindings and build the starter applications
        run: |
          scripts/ui_native/sync-ios.sh --check
          scripts/ui_native/sync-android.sh --check
          python3 scripts/ui/check_behaviours.py ios
          python3 scripts/ui/check_behaviours.py android
          scripts/ui_native/release/prepare.sh --output target/native-ui/candidate
          scripts/ui_native/release/verify.sh --candidate target/native-ui/candidate --templates both
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate
          path: target/native-ui/candidate/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/native-ui-v')
    needs: preview
    runs-on: ubuntu-latest
    environment: native-ui-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: candidate
      - name: Sign the verified files
        env:
          SIGNING_KEY: ${{ secrets.NATIVE_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.NATIVE_RELEASE_TOKEN }}
          FINGERPRINT: ${{ vars.NATIVE_GPG_FINGERPRINT }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          previous=()
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx android-publication.zip; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern android-publication.zip --dir "$RUNNER_TEMP"
            previous=(--previous "$RUNNER_TEMP/android-publication.zip")
          fi
          python3 scripts/ui_native/release/sign.py --candidate candidate --out signed --key "$FINGERPRINT" "${previous[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-native-packages-${{ github.run_attempt }}
          path: signed/
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ secrets.NATIVE_RELEASE_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: scripts/ui_native/release/publish.sh --candidate signed --resume

  public-install:
    needs: [preview, publish]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: candidate
      - name: Resolve both public packages
        run: |
          command -v mise >/dev/null || brew install mise
          mise trust --yes mise.toml
          mise install --yes java gradle http:android-sdk python
          mise run toolchain:android
          mise exec -- scripts/ui_native/release/verify.sh --candidate candidate --templates both --public
          mise exec -- scripts/ui_native/release/test-ios-starter.sh

  android-device:
    needs: [preview, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the public Android starter
        run: |
          sudo chmod a+rw /dev/kvm
          mise trust --yes mise.toml
          mise install --yes java gradle http:android-sdk python
          mise run toolchain:android
          mise exec -- scripts/ui_native/release/test-android-starter.sh
