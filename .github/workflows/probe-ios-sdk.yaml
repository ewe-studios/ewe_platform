name: Probe iOS SDK on Blacksmith macOS
# Temporary: answers whether the Blacksmith macOS runner (PR #500) has the
# iPhoneOS SDK that the macOS build job's iOS check needs. Delete after use.
on:
  push:
    branches: [claude/friendly-ritchie-7acn6p]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Show Xcode and SDKs
        run: |
          sw_vers || true
          xcode-select -p || true
          xcodebuild -version || true
          xcodebuild -showsdks || true
          echo "iphoneos SDK:"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
