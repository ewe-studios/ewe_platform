[workspace]
resolver = "3"
# set members of your workspace
members = [
  "bin/*",
  # "crates/*",
  "backends/*",
  "infrastructure/*",
  "examples/platform_demo",
  "apps/answerme-agent",
  # "examples/platform_android/src-tauri",  # excluded: has its own workspace root
  # "examples/platform_android",  # excluded: has its own workspace root in src-tauri/
  "tests",  # Workspace integration tests
  "benches", # Workspace benchmarks
]

exclude = [
  "artefacts/*",
  # infrastructure/docker is its own nested workspace root (like platform_android)
  "infrastructure/docker",
  # examples are self-contained crates — build individually as needed
  "examples/*",
  "examples/*/src-tauri",
  # "crates/ewe_deployables",
  "backends/docs",
  "backends/docs/*",
  "backends/node_modules",
  "backends/*/node_modules",
  # tests members
  "integrations/nodejs/integrations/*",
  "backends/foundation_wasm/integration/module",
  "backends/foundation_wasm_ui/integration/module",
  "backends/foundation_testbed/integration/module",
  "backends/foundation_core/integration/wasm_tests",
  # folded into foundation_compact::ids — pending deletion
  "backends/foundation_rng",
  # devserver
  "crates/*",
]

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"
keywords = ["ewe_platform", "ewestudios-platform", "ewestudios_platform"]


[workspace.dependencies]
derive_more = { version = ">=2.0", features = ["full"] }

# core library dependencies
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
toml = { version = "0.9" }
toml_edit = { version = "0.22" }

regex = "1.12.2"
concurrent-queue = { version = "2.5.0"}

# tracing
tracing = { version = "0.1" }
tracing-core = { version = "0.1" }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
tracing-subscriber = { version = "0.3", features = ["json"] }

# specific for testing serially
# testing with timeouts
serial_test = "3.3.1"
ntest = "0.9"

# this should disappear soon, we need to weed it all out and replace with foundation_errstack.
anyhow = { version = "1.0" }
thiserror = { version = "2"}

# examples and benchmarks
criterion = { version = "0.5.1" }
bindgen = { version = "0.72.1" }
cc = { version = "1.2.49" }
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = { version = "0.8.35" }
walrus = "0.23"
portpicker = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
fs_extra = "1.3"
fuser = "0.15"

[workspace.lints.rust]
missing_docs = { level = "allow" }
missing_debug_implementations = { level = "allow" }

[workspace.lints.clippy]
pedantic = { level = "warn" }

# No `codegen-backend` here: it is a nightly-only key, and stable cargo refuses
# to load a workspace that sets it (releases build on stable — see
# docs/releasing.md). Cranelift for `dev` is a developer-environment choice set
# in mise.toml's [env] (CARGO_PROFILE_DEV_CODEGEN_BACKEND and friends); plain
# cargo without mise builds `dev` with LLVM.
[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
incremental = true

# `dev` on LLVM — what the test docs and CI use (Cranelift can't do
# catch_unwind or coverage). mise pins it to LLVM explicitly, since its env puts
# `dev` on Cranelift.
[profile.uat]
inherits = "dev"

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = true # link time optimizations
# Enable to remove debug info from wasm files
strip = "debuginfo"
