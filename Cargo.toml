[workspace]
resolver = "3"
# set members of your workspace
members = [
  "bin/*",
  # "crates/*",
  "backends/*",
  "infrastructure/*",
  "examples/platform_demo",
  "apps/answerme-agent",
  # "examples/platform_android/src-tauri",  # excluded: has its own workspace root
  # "examples/platform_android",  # excluded: has its own workspace root in src-tauri/
  "tests",  # Workspace integration tests
  "benches", # Workspace benchmarks
]

exclude = [
  "artefacts/*",
  # infrastructure/docker is its own nested workspace root (like platform_android)
  "infrastructure/docker",
  # examples are self-contained crates — build individually as needed
  "examples/*",
  "examples/*/src-tauri",
  "backends/docs",
  "backends/docs/*",
  "backends/node_modules",
  "backends/*/node_modules",
  # tests members
  "integrations/nodejs/integrations/*",
  "backends/foundation_wasm/integration/module",
  "backends/foundation_wasm_ui/integration/module",
  "backends/foundation_testbed/integration/module",
  "backends/foundation_core/integration/wasm_tests",
  # folded into foundation_compact::ids — pending deletion
  "backends/foundation_rng",
  # devserver
  "crates/*",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"
keywords = ["ewe_platform", "ewestudios-platform", "ewestudios_platform"]


[workspace.dependencies]
derive_more = { version = ">=2.0", features = ["full"] }

# Async stream combinators (bounded concurrency in the migration fleet runner).
futures-util = "0.3"

# Classless Inter-Domain Routing (CIDR) networks and address membership. The
# proxy's registration address policy checks a backend address against them.
ipnet = { version = "2.12", features = ["serde"] }

# Transport Layer Security (TLS) and X.509 support. Spec 87 moves these with the
# certificate authority, the trust store and the verifier into foundation_auth.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
# rcgen 0.13.2 depends on x509-parser 0.16. Declare the same major so Cargo.lock
# keeps one version of the parser.
x509-parser = "0.16"
time = "0.3"

# Virtual file system (VFS) traits and shared types. `foundation_nativeapis`
# re-exports them and adds the implementations. The split keeps `foundation_db`
# free of a package cycle: `foundation_nativeapis` has optional Cloudflare
# delta stores that depend on `foundation_db`.
foundation_vfs = { path = "backends/foundation_vfs", version = "0.0.1" }

# Virtual file system (VFS) implementations. The `vfs` feature builds on wasm
# too; only `NativeFs` is native. `foundation_db` tests use `MemoryFs`.
foundation_nativeapis = { path = "backends/foundation_nativeapis", version = "0.0.16", default-features = false, features = ["vfs"] }

# core library dependencies
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
toml = { version = "0.9" }
toml_edit = { version = "0.22" }

# One media type table for the platform (spec 89).
# `phf` builds a perfect hash map at compile time. It needs no `std`, so the
# wasm builds of `foundation_netio` stay clean. `foundation_nostd` re-exports it
# and no other crate names it directly.
# `Cargo.lock` also holds phf 0.13.1 and 0.11.3, which upstream crates force:
# cssparser (through tauri and dom_query) needs 0.13, and doxygen-rs (through
# lmdb-master-sys) needs 0.11. They cannot use 0.14.
phf = { version = "0.14", default-features = false }
# `phf_codegen` writes the `phf::Map` literal that `include_json!` and
# `include_yaml!` expand to.
phf_codegen = "0.14"
# The YAML parser behind `include_yaml!`.
serde_yaml_ng = "0.10.0"
# The second media type table. The agreement test proves both tables give the
# same answer for common extensions; the embedders keep using this one.
new_mime_guess = "4.0.4"

regex = "1.12.2"
concurrent-queue = { version = "2.5.0"}
# The concrete RNG type that `Ctx` names. The workspace pins it here, so a consumer
# that names `ChaCha8Rng` uses the workspace version.
# A second version (0.3) is intentional: `foundation_auth`'s `secret-rsa` feature
# seeds a `ChaCha12Rng` for RSA-PSS and gives it to `rsa` 0.9, which needs
# `rand_core` 0.6. `rand_chacha` 0.3 is the version on that `rand_core`.
rand_chacha = { version = "0.10", default-features = false }

# tracing
tracing = { version = "0.1" }
tracing-core = { version = "0.1" }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
tracing-subscriber = { version = "0.3", features = ["json"] }

# specific for testing serially
# testing with timeouts
serial_test = "3.3.1"
ntest = "0.9"

# this should disappear soon, we need to weed it all out and replace with foundation_errstack.
thiserror = { version = "2"}

# examples and benchmarks
criterion = { version = "0.5.1" }
# 0.73.2 accepts syn 3 (`syn = ">=2, <4"`), but `prettyplease` 0.2 uses syn 2.
# The default `prettyplease` feature then fails to compile. Drop it; the
# generated bindings are unformatted, which changes nothing in their meaning.
bindgen = { version = "0.73.2", default-features = false, features = ["logging", "runtime"] }
cc = { version = "1.2.49" }
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = { version = "0.8.35" }
walrus = "0.23"
portpicker = "0.1"
# Use the pure-Rust FUSE mount implementation. It needs no system libfuse3 dev package.
fuser = { version = "0.15", default-features = false }

# Vendored patch of gemm-common 0.19.0. Its `init_gemm_fn` chose the `fma`
# kernel from the `fma` CPU feature alone, but that kernel needs the whole V3
# SIMD type (avx2 too). On CPUs that report `fma` without `avx2` (the Docker
# Desktop linux/amd64 emulation used by scripts/ci/linux.sh), `V3::try_new()`
# returns `None` and gemm-f32 panics on `.unwrap()`. The patch picks the kernel
# with `V3::try_new()` / `V4::try_new()` instead. See
# specifications/completed/70-foundational-io-hardening/learnings.md.
# A patch applies only inside this workspace; the upstream fix is written in
# patches/gemm-common/UPSTREAM.md and tracked in issue #190.
# gemm-f16 (0.19.0, pulled in by candle-core through gemm) has the same dispatch
# fix in patches/gemm-f16. Its upstream note is in patches/gemm-common/UPSTREAM.md.
# (boringtun is no longer patched: backends/foundation_boringtun is a published fork.)
# Vendored patch of esaxx-rs 0.1.10. Its `build.rs` forces the static MSVC
# runtime (`/MT`) on every platform, while Rust and every other C++ object in
# the link use the dynamic runtime (`/MD`); a Windows binary that uses it fails
# to link (issue #772). The patch lets `cc` follow the target. The upstream note
# is in patches/esaxx-rs/UPSTREAM.md.
[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }
gemm-common = { path = "patches/gemm-common" }
gemm-f16 = { path = "patches/gemm-f16" }

[workspace.lints.rust]
missing_docs = { level = "allow" }
missing_debug_implementations = { level = "allow" }

[workspace.lints.clippy]
pedantic = { level = "warn" }

# No `codegen-backend` here: it is a nightly-only key, and stable cargo refuses
# to load a workspace that sets it (releases build on stable — see
# docs/releasing.md). Cranelift for `dev` is a developer-environment choice set
# in mise.toml's [env] (CARGO_PROFILE_DEV_CODEGEN_BACKEND and friends); plain
# cargo without mise builds `dev` with LLVM.
[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
incremental = true

# `dev` on LLVM — what the test docs and CI use (Cranelift can't do
# catch_unwind or coverage). mise pins it to LLVM explicitly, since its env puts
# `dev` on Cranelift.
[profile.uat]
inherits = "dev"

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = true # link time optimizations
# Enable to remove debug info from wasm files
strip = "debuginfo"
