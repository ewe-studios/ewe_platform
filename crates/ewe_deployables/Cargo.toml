[package]
name = "ewe_deployables"
version = "0.0.1"
description = "Ready-to-use Deployable implementations for cloud providers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
# Foundation crates
foundation_core = { path = "../../backends/foundation_core", version = "0.0.3" }
foundation_netio = { path = "../../backends/foundation_netio", version = "0.0.1" }
foundation_deployment = { path = "../../backends/foundation_deployment", version = "0.0.1", features = ["cloudflare", "cloudflare_workers", "gcp", "gcp_run"] }
foundation_db = { path = "../../backends/foundation_db", version = "0.0.1", default-features = false }

# Serde for serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# Tracing for logging
tracing = { workspace = true }

# Thiserror for error types
thiserror = { version = "1.0" }

[dev-dependencies]
foundation_testing = { path = "../../backends/foundation_testing", version = "0.0.1" }
tempfile = "3"

[lints]
workspace = true
