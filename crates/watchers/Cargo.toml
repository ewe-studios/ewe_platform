[package]
name = "ewe_watchers"
version = "0.0.1"
description = "The core watchers for directly listening to file changes"
authors = ["EweStudios Consulting Limited"]
edition = "2021"
repository = "https://github.com/ewe-studios/ewe_platform"
license = "Apache-2.0"
rust-version = "1.87"
keywords = [
    "watcher",
    "watchful",
    "filewatcher",
    "commandrunner",
    "changewatcher",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
serde_with = { version = "3.6.1" }

# -- error crates
anyhow = { version = "1.0.80" }
thiserror = { version = "2.0.17" }

# -- tracing crates
tracing = { version = "0.1.40" }

# -- watcher
notify = { version = "6.1.1", features = [] }
notify-debouncer-full = { version = "0.3.1", default-features = false }

[dev-dependencies]
tracing-test = { version = "0.2.5" }


[features]
macos_kqueue = ["notify/macos_kqueue"]

# The root workspace excludes `crates/*`, so this package is its own workspace
# root. Without this table Cargo rejects the removed `workspace = true` keys.
[workspace]

# Same as the root workspace's `uat` profile: LLVM instead of Cranelift.
[profile.uat]
inherits = "dev"
