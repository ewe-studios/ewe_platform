[package]
name = "ewe_channels"
version = "0.0.1"
description = "The channels wrapper for implementing channels in ewe_domain crate"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"
keywords = ["ewe_platform", "ewestudios-platform", "ewestudios_platform"]

[dependencies]
tracing = { version = "0.1.40" }
async-channel = { version = "2.2" }
futures = { version = "0.3" }
crossbeam = { version = "0.8" }
anyhow = { version = "1.0.80" }
thiserror = { version = "2.0.17" }

[dev-dependencies]
# Valtron runtime for the tests that exercise async send/receive and the
# hand-rolled executor.
foundation_core = { path = "../../backends/foundation_core", version = "0.0.7", features = ["multi"] }

# Opt out of the parent workspace — this crate is a self-contained crate
# (the root workspace excludes `crates/*`).
[workspace]

# Mirror the root workspace's `uat` profile so `--profile uat` works here too
# (the profile is not inherited across a workspace boundary).
[profile.uat]
inherits = "dev"
