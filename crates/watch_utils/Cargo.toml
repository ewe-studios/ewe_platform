[package]
name = "ewe_watch_utils"
version = "0.0.2"
description = "Implements utilities for directory watching"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"

[dependencies]
tracing = { version = "0.1.40" }

# -- error crates
derive_more = { version = ">=2.0", features = ["full"] }
foundation_errstacks = { path = "../../backends/foundation_errstacks", version = "0.0.3" }

# -- watcher
notify = { version = "6.1.1", features = [] }
notify-debouncer-full = { version = "0.3.1", default-features = false }

[dev-dependencies]
tracing-test = { version = "0.2.5" }

[features]
macos_kqueue = ["notify/macos_kqueue"]
default = []

# The root workspace excludes `crates/*`, so this package is its own workspace
# root. Without this table Cargo rejects the package as "believes it's in a
# workspace when it's not".
[workspace]

# Mirror the root workspace's `uat` profile so `--profile uat` works here too.
[profile.uat]
inherits = "dev"

[lints.clippy]
pedantic = { level = "warn" }
