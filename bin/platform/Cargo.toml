[package]
name = "ewe_platform"
version = "0.0.2"
description = "ewe_platform binary CLi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ewe-platform", "ewe-platform-cli", "ewe-platform-binary"]

[dependencies]
# -- workspace dependency
foundation_codegentools = { path = "../../backends/foundation_codegentools", version = "0.1.2", features = ["cli"] }
# Feature 20: each runtime crate owns its build CLI.
foundation_wasm = { path = "../../backends/foundation_wasm", version = "0.0.5" }
foundation_wasm_ui = { path = "../../backends/foundation_wasm_ui", version = "0.1.1" }
foundation_packager = { path = "../../backends/foundation_packager", version = "0.1.3" }
# ewe_watch_utils = { workspace = true }
# ewe_watchers = { workspace = true }
foundation_toolings = { path = "../../backends/foundation_toolings", version = "0.0.3" }
foundation_core = { path = "../../backends/foundation_core", version = "0.0.6", features = ["multi"] }
foundation_netio = { path = "../../backends/foundation_netio", version = "0.0.4", features = ["ssl", "multi"] }
foundation_ai = { path = "../../backends/foundation_ai", version = "0.0.2" }
foundation_macros = { path = "../../backends/foundation_macros", version = "0.0.6" }
# Referenced by the code `foundation_macros::EmbedDirectoryAs` expands to.
foundation_nostd = { path = "../../backends/foundation_nostd", version = "0.0.6" }

# base crates
tracing = { workspace = true }

# cli
clap = { version = "4.5.54", features = ["derive"] }

# -- tokio
tokio = { version = "1.36", features = ["full"], default-features = true }

# -- http
bytes = { version = "1.6.1" }
http = { version = "1.1" }

# -- serde
serde_json = { version = "1.0.114" }

# -- tracing crates
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

# -- toml for Cargo.toml manipulation
toml = { version = "0.9" }

[features]
debug_block = ["foundation_packager/debug_block"]
trace_block = ["foundation_packager/trace_block"]

[lints]
workspace = true
