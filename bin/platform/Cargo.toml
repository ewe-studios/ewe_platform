[package]
name = "ewe_platform"
version = "0.0.2"
description = "ewe_platform binary CLi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ewe-platform", "ewe-platform-cli", "ewe-platform-binary"]

[dependencies]
# -- workspace dependency
foundation_codegentools = { path = "../../backends/foundation_codegentools", version = "0.1.1", features = ["cli"] }
# Feature 20: each runtime crate owns its build CLI.
foundation_wasm = { path = "../../backends/foundation_wasm", version = "0.0.4" }
foundation_wasm_ui = { path = "../../backends/foundation_wasm_ui", version = "0.1.0" }
foundation_packager = { path = "../../backends/foundation_packager", version = "0.1.0" }
# ewe_watch_utils = { workspace = true }
# ewe_watchers = { workspace = true }
foundation_toolings = { path = "../../backends/foundation_toolings", version = "0.0.1" }
foundation_core = { path = "../../backends/foundation_core", version = "0.0.4", features = ["multi"] }
foundation_netio = { path = "../../backends/foundation_netio", version = "0.0.2", features = ["ssl", "multi"] }
foundation_ai = { path = "../../backends/foundation_ai", version = "0.0.1" }
foundation_runtimes = { path = "../../backends/foundation_runtimes", version = "0.0.3" }
foundation_nostd = { path = "../../backends/foundation_nostd", version = "0.0.5" }
foundation_macros = { path = "../../backends/foundation_macros", version = "0.0.5" }
foundation_deployment = { path = "../../backends/foundation_deployment", version = "0.0.1" }

# base crates
derive_more.workspace = true
tracing = { workspace = true }

# cli
ctrlc = { version = "3.4" }
clap = { version = "4.5.54", features = ["derive"] }
signal-hook = { version = "0.4.1" }

# -- tokio, axum and tower
tower = { version = "0.4.13" }
crossbeam = { version = "0.8" }
axum = { version = "0.7.5", default-features = true }
tokio = { version = "1.36", features = ["full"], default-features = true }

# -- http and hyper
bytes = { version = "1.6.1" }
http = { version = "1.1" }
http-body = { version = "1.0" }
hyper = { version = "1.4.1", features = ["full"] }
hyper-util = { version = "0.1.7" }
http-body-util = { version = "0.1.2" }

# -- serve# -- serve
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
serde_with = { version = "3.6.1" }

# -- error crates
anyhow = { version = "1.0.80" }
thiserror = { version = "2.0.17" }
chrono = { version = "0.4", features = ["serde"] }

# -- tracing crates
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

# -- file system utilities
walkdir = { version = "2.5" }

# -- toml for Cargo.toml manipulation
toml = { version = "0.8" }

# -- regex for comment sanitization
regex = { version = "1.10" }

# -- platform (VM/container orchestration)
foundation_deployment_platform = { path = "../../backends/foundation_deployment_platform", version = "0.1.0", features = ["vms"] }

[features]
debug_block = ["foundation_packager/debug_block"]
trace_block = ["foundation_packager/trace_block"]

[lints]
workspace = true
