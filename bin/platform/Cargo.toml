[package]
name = "ewe_platform"
default-run = "ewe_platform"
autobins = false
version = "0.0.4"
description = "ewe_platform binary CLi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ewe-platform", "ewe-platform-cli", "ewe-platform-binary"]

[[bin]]
name = "platform"
path = "src/main.rs"

[[bin]]
name = "ewe_platform"
path = "src/compat.rs"

[dependencies]
foundation_tasks.workspace = true
foundation_ui_native = { path = "../../backends/foundation_ui_native", features = ["tasks"] }
blocking.workspace = true
# -- workspace dependency
foundation_codegentools = { path = "../../backends/foundation_codegentools", version = "0.1.7", features = ["cli"] }
# Feature 20: each runtime crate owns its build CLI.
foundation_wasm = { path = "../../backends/foundation_wasm", version = "0.0.11" }
foundation_wasm_ui = { path = "../../backends/foundation_wasm_ui", version = "0.1.8" }
foundation_packager = { path = "../../backends/foundation_packager", version = "0.1.6" }
# ewe_watch_utils = { workspace = true }
# ewe_watchers = { workspace = true }
foundation_toolings = { path = "../../backends/foundation_toolings", version = "0.0.10" }
foundation_core = { path = "../../backends/foundation_core", version = "0.0.23", features = ["multi"] }
foundation_context = { path = "../../backends/foundation_context", version = "0.0.4" }
foundation_netio = { path = "../../backends/foundation_netio", version = "0.0.15", features = ["ssl", "multi"] }
foundation_ai = { path = "../../backends/foundation_ai", version = "0.0.9" }
foundation_macros = { workspace = true }
# Referenced by the code `foundation_macros::EmbedDirectoryAs` expands to.
foundation_nostd = { path = "../../backends/foundation_nostd", version = "0.0.9" }

# base crates
tracing = { workspace = true }

# cli
clap.workspace = true

# -- http
bytes = { version = "1.6.1" }
http = { version = "1.1" }

# -- serde
serde_json = { version = "1.0.114" }

# -- tracing crates
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

# -- toml for Cargo.toml manipulation
toml = { version = "0.8" }

[features]
debug_block = ["foundation_packager/debug_block"]
trace_block = ["foundation_packager/trace_block"]

[lints]
workspace = true
