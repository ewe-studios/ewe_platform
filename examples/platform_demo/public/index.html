<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundation Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;padding:12px;background:#0a0a1a;color:#ccd6f6;min-height:100vh}
h1{font-size:20px;color:#64ffda;margin-bottom:4px}
.sub{font-size:12px;color:#8892b0;margin-bottom:12px}
.btn{font-size:13px;padding:8px 14px;border:1px solid #233554;border-radius:6px;background:#112240;color:#64ffda;cursor:pointer;margin:4px}
.btn:hover{background:#233554}
.card{background:#112240;border:1px solid #233554;border-radius:8px;padding:12px;margin:8px 0}
.card h3{font-size:14px;color:#64ffda;margin-bottom:6px}
.mode{font-size:11px;padding:3px 8px;border-radius:4px;display:inline-block;margin:4px 2px}
.m-wasm{background:#1a3a2a;color:#64ffda}
.m-ipc{background:#3a2a1a;color:#ffb86c}
.m-remote{background:#2a1a3a;color:#bd93f9}
#output{font-size:11px;color:#a8b2d1;white-space:pre-wrap;max-height:400px;overflow-y:auto;background:#0a0e1a;padding:8px;border-radius:4px;margin-top:8px}
</style>
</head>
<body>
<h1>Foundation Platform</h1>
<p class="sub">Multi-mode demo — WASM · IPC · Remote</p>

<div>
<button class="btn" onclick="load('ewe://localhost/app/home')">🏠 App (WASM)</button>
<button class="btn" onclick="load('ewe://localhost/api/status')">⚡ API (IPC)</button>
<button class="btn" onclick="load('ewe://localhost/remote/news')">🌐 Remote</button>
<button class="btn" onclick="load('ewe://localhost/cached/data')">💾 Cached</button>
<button class="btn" onclick="load('ewe://localhost/auth/login')">🔐 Auth</button>
</div>

<div class="card">
<h3>Platform Info</h3>
<div>Session: <span id="session">—</span></div>
<div id="currentMode">Click a button to test each mode</div>
</div>

<div id="output">Ready. Click a mode button.</div>

<script>
async function load(url) {
  const out = document.getElementById('output');
  out.textContent = 'Loading: ' + url + '...';
  try {
    const resp = await fetch(url);
    const text = await resp.text();
    let modeTag = '';
    if (url.includes('/app/')) modeTag = '<span class="mode m-wasm">WASM</span>';
    else if (url.includes('/api/')) modeTag = '<span class="mode m-ipc">IPC</span>';
    else if (url.includes('/remote/')) modeTag = '<span class="mode m-remote">Remote</span>';
    else if (url.includes('/cached/')) modeTag = 'CacheFirst';
    else if (url.includes('/auth/')) modeTag = 'Auth';
    document.getElementById('currentMode').innerHTML = 'Current: ' + modeTag + ' — ' + url;
    out.textContent = text;
  } catch(e) {
    out.textContent = 'ERROR: ' + e.message;
  }
}
document.getElementById('session').textContent = 'platform_run! active';
</script>
</body>
</html>
