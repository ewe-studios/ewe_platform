[package]
name = "ui_todo"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false
autobins = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
foundation_ui_gpu = { path = "../../backends/foundation_ui_gpu", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
font8x8 = "0.3.1"
foundation_compact = { path = "../../backends/foundation_compact", version = "0.2.7", default-features = false, features = ["std"] }
foundation_wasm_ui = { path = "../../backends/foundation_wasm_ui", optional = true }
foundation_theme = { path = "../../backends/foundation_theme", features = ["native-manifest"] }
foundation_context = { path = "../../backends/foundation_context" }
foundation_errstacks = { path = "../../backends/foundation_errstacks" }
foundation_ui_runtime = { path = "../../backends/foundation_ui_runtime" }
foundation_ui_wire = { path = "../../backends/foundation_ui_wire" }
serde = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_core = { path = "../../backends/foundation_core", optional = true }
foundation_http = { path = "../../backends/foundation_http", optional = true }
buffa = { workspace = true, features = ["json"], optional = true }
foundation_ui_connectrpc = { path = "../../backends/foundation_ui_connectrpc", optional = true }
foundation_connectrpc = { path = "../../backends/foundation_connectrpc", default-features = false, optional = true }
foundation_ui_http = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

foundation_browser = { path = "../../backends/foundation_browser", optional = true }

foundation_ui_native = { path = "../../backends/foundation_ui_native", version = "0.1.1", optional = true }
uniffi = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = {workspace = true, optional = true}
js-sys = {workspace = true, optional = true}
wasm-bindgen-futures = {workspace = true, optional = true}
foundation_core = { path = "../../backends/foundation_core", optional = true, features = ["js-foundation-wasm"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
async-trait = { workspace = true }
foundation_core = { path = "../../backends/foundation_core" }

[build-dependencies]
foundation_connectrpc_codegen = { path = "../../backends/foundation_connectrpc_codegen", optional = true }

[lints]
workspace = true

[features]
mathalley-web = ["dep:foundation_ui_gpu", "dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures","foundation_context/wasm-bindgen"]
default = ["server"]
server = ["dep:serde_json", "dep:foundation_wasm_ui", "dep:buffa", "dep:foundation_connectrpc_codegen", "dep:foundation_connectrpc", "dep:foundation_ui_connectrpc", "foundation_ui_http/live-stream", "foundation_core/multi", "dep:foundation_core", "dep:foundation_ui_http", "dep:foundation_http", "dep:futures-lite"]
web = ["dep:foundation_core", "dep:foundation_wasm_ui", "foundation_context/host-abi"]
mobile = ["dep:foundation_ui_gpu", "dep:thiserror", "dep:buffa", "dep:foundation_connectrpc_codegen", "dep:foundation_ui_connectrpc", "dep:foundation_connectrpc", "dep:foundation_ui_native", "dep:uniffi"]
browser-tests = ["server", "dep:foundation_browser"]

[[bin]]
name = "ui_todo"
path = "src/bin/server.rs"
required-features = ["server"]

[[test]]
name = "todo_browser_tests"
path = "tests/todo_browser_tests.rs"
required-features = ["browser-tests"]

[[test]]
name = "actions"
path = "tests/mod.rs"
required-features = ["server"]

[[test]]
name = "mobile"
path = "tests/mobile.rs"
required-features = ["mobile"]

[[test]]
name = "mathalley"
path = "tests/mathalley/mod.rs"
