<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="./{{ewe_assets}}/theme.css"><link rel="icon" href="./{{ewe_assets}}/art/todo.svg"><title>Todos</title>
<style>body{font-family:system-ui,sans-serif;color:CanvasText;background:Canvas}main,output{display:block;max-width:42rem;margin:1.5rem auto;padding-inline:1rem}.animate-pulse{opacity:.7}@media(prefers-reduced-motion:no-preference){.animate-pulse{animation:todo-pulse 2s ease-in-out infinite alternate}@keyframes todo-pulse{to{opacity:.5}}}[hidden]{display:none!important}#mathalley{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;background:#1b1410;color:#fdf3dc}#mathalley button{width:fit-content;margin:.4rem;font:inherit}#mathalley canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none}</style><style>
  #todo-list-heading { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  #todo-pause-modal { max-inline-size: min(24rem, calc(100% - 2rem)); text-align: center; }
  #todo-pause-timer { font-size: 2.5rem; font-variant-numeric: tabular-nums; }
  #pause-announcement { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
</style></head>
<body>
<main id="page"></main>
<output id="notice" aria-live="polite"></output>
<script defer src="./{{ewe_assets}}/bundle.js"></script>
<span id="pause-announcement" role="status"></span></body></html>
