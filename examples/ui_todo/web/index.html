<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/theme.css"><link rel="icon" href="/art/todo.svg"><title>Todos</title>
<style>body{font-family:system-ui,sans-serif;color:CanvasText;background:Canvas}main,output{display:block;max-width:42rem;margin:1.5rem auto;padding-inline:1rem}.animate-pulse{opacity:.7}@media(prefers-reduced-motion:no-preference){.animate-pulse{animation:todo-pulse 2s ease-in-out infinite alternate}@keyframes todo-pulse{to{opacity:.5}}}[hidden]{display:none!important}#mathalley{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;background:#1b1410;color:#fdf3dc}#mathalley button{width:fit-content;margin:.4rem;font:inherit}#mathalley canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none}</style></head>
<body>
<main id="page"></main>
<output id="notice" aria-live="polite"></output>
<script defer src="/bundle.js"></script>
</body></html>
