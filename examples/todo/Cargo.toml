[package]
name = "todo"
version = "0.0.1"
authors = ["EweStudios Consulting Limited"]
edition = "2021"
repository = "https://github.com/ewe-studios/ewe_platform"
license = "Apache-2.0"
rust-version = "1.87"


[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]


# -- global dependencies
[dependencies]
# wasm
js-sys = { version = "0.3.68" }
web-sys = { version = "0.3.68" }
wasm-bindgen = { version = "0.2.29" }
wasm-bindgen-futures = { version = "0.4.41" }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

# -- error crates
anyhow = { version = "1.0.80" }
thiserror = { version = "1.0.57" }

# -- serialization crates
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
serde_with = { version = "3.6.1" }

# -- tracing crates
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
unused = "warn"        # for experimental dev

[lints.clippy]

# Opt out of the parent workspace — this crate is self-contained.
[workspace]

# Mirror the root workspace's `uat` profile so `--profile uat` works here too.
[profile.uat]
inherits = "dev"
