[package]
name = "cf-valtron-counter"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"
publish = false
keywords = ["cloudflare", "wasm", "valtron", "example"]

# Opt out of the parent workspace: `examples/*` are excluded from the root
# workspace, so this crate must be its own workspace root (and can't inherit
# workspace fields or lints).
[workspace]

[dependencies]
foundation_core = {
    path = "../../backends/foundation_core",
    default-features = false,
    features = ["js-wasmbindgen", "std"]
}
foundation_context = { path = "../../backends/foundation_context" }


wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "Request",
    "Response",
    "Headers",
    "ResponseInit",
    "ReadableStream",
    "ReadableStreamDefaultController",
    "UnderlyingSource",
] }

worker = { version = "0.8.3" }
console_error_panic_hook = "0.1"
console_log = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

[lib]
crate-type = ["cdylib", "rlib"]

