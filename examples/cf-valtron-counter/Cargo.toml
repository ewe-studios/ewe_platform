[package]
name = "cf-valtron-counter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["cloudflare", "wasm", "valtron", "example"]

[dependencies]
foundation_core = { workspace = true, default-features = false, features = ["js-wasmbindgen", "std"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "Request",
    "Response",
    "Headers",
    "ResponseInit",
    "ReadableStream",
    "ReadableStreamDefaultController",
    "UnderlyingSource",
] }

worker = { version = "0.8.3" }
console_error_panic_hook = "0.1"
console_log = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
