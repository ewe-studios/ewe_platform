[package]
name = "cf-cloud-provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "foundation_ai on Cloudflare Workers: a chat page streaming OpenRouter replies via FetchHttpClient (spec 65 T5)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Opt out of the parent workspace: `examples/*` are excluded from the root
# workspace, so this crate must be its own workspace root.
[workspace]

[dependencies]
# Self-contained crate: no workspace inheritance (`examples/*` are excluded from
# the workspace, so `edition.workspace` / `[lints] workspace = true` would fail).
foundation_ai = { path = "../../backends/foundation_ai", default-features = false }
foundation_core = { path = "../../backends/foundation_core", default-features = false, features = ["js-wasmbindgen", "std"] }
foundation_netio = { path = "../../backends/foundation_netio", default-features = false, features = ["wasm-fetch"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3" # keep: worker-build builds with WASM_BINDGEN_USE_JS_SYS=1, so wasm-bindgen names `js_sys`; removing this breaks the release wasm build
futures-lite = "2"
web-sys = { version = "0.3", features = ["Request", "Response", "ResponseInit", "Headers", "Url", "console"] }

worker = { version = "0.8.3" }
console_error_panic_hook = "0.1"
