<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent chat</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1b1b1b; --me: #dbe9ff; --bot: #ececec; --line: #d0d0d0; --ok: #1a7f37; --err: #c33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --me: #1f3b63; --bot: #2a2a2a; --line: #3a3a3a; --ok: #3fb950; --err: #f85149; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid transparent; }
  .me { align-self: flex-end; background: var(--me); }
  .bot { align-self: flex-start; background: var(--bot); }
  .bot.ok { border-left-color: var(--ok); }
  .bot.error { border-left-color: var(--err); }
  .bot .status { margin-top: 8px; font-size: 13px; opacity: .85; }
  .bot.ok .status { color: var(--ok); }
  .bot.error .status { color: var(--err); }
  .typing { display: inline-block; }
  .typing i { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: currentColor; opacity: .4; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; padding: 10px; font: inherit; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
  button { padding: 0 18px; font: inherit; border-radius: 8px; border: 0; background: #2f6fde; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="log" aria-live="polite"></div>
<form id="ask">
  <textarea id="prompt" rows="2" placeholder="Ask something… (Enter to send)" required></textarea>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('ask');
const input = document.getElementById('prompt');
const send = document.getElementById('send');

function bubble(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  if (text) el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function typingIndicator() {
  const el = document.createElement('span');
  el.className = 'typing';
  el.innerHTML = '<i></i><i></i><i></i>';
  return el;
}

function statusLine(kind, message) {
  const el = document.createElement('div');
  el.className = 'status';
  el.textContent = message;
  return el;
}

// POST the prompt and render each Server-Sent Event (one JSON object per event).
async function ask(prompt, reply) {
  const res = await fetch('/chat', { method: 'POST', body: prompt });
  if (!res.ok) throw new Error(await res.text() || res.statusText);

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = '';
  let text = '';
  let outcome = null; // 'ok' | 'err'
  let started = false;

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += value;
    let end;
    while ((end = buffer.indexOf('\n\n')) >= 0) {
      const frame = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      const data = frame.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
      if (!data) continue;

      let event;
      try { event = JSON.parse(data); } catch { event = { type: 'text', content: data }; }

      if (!started) { // first event: replace the typing dots with real content
        started = true;
        reply.textContent = '';
      }

      switch (event.type) {
        case 'text':
          text += event.content || '';
          reply.textContent = text;
          break;
        case 'thinking':
          reply.textContent = text + '\n… ' + (event.content || 'thinking') + ' …';
          break;
        case 'activity':
          reply.textContent = text + '\n(' + (event.message || 'working') + ')';
          break;
        case 'error':
          outcome = 'err';
          reply.textContent = text;
          reply.classList.add('error');
          reply.append(statusLine('err', '✗ ' + (event.message || 'failed')));
          break;
        case 'done':
          outcome = 'ok';
          break;
      }
      log.scrollTop = log.scrollHeight;
    }
  }

  // No terminal event arrived: report the outcome we actually saw.
  if (!outcome) outcome = text ? 'ok' : 'err';
  if (outcome === 'ok') {
    reply.classList.add('ok');
    reply.append(statusLine('ok', '✓ done'));
  } else if (!reply.querySelector('.status')) {
    reply.classList.add('error');
    reply.append(statusLine('err', '✗ no response'));
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';
  send.disabled = true;
  bubble(prompt, 'me');

  const reply = bubble('', 'bot');
  reply.append(typingIndicator()); // show activity while waiting

  try {
    await ask(prompt, reply);
  } catch (err) {
    reply.textContent = '';
    reply.classList.add('error');
    reply.append(statusLine('err', '✗ ' + String(err.message || err)));
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
