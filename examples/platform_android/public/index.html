<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Platform Android</title>
<style>body{font-family:monospace;padding:20px;background:#0a0a1a;color:#00ff88}
.ok{color:#00ff88}.card{background:#111133;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333}</style></head>
<body><h1>Foundation Platform</h1><h2>Android — Native Rust</h2>
<div class="card"><b>Session</b><br>PlatformSession initialized via platform_run!</div>
<div class="card"><b>Routes</b><br>/app/*, /remote/*, /cached/*</div>
<div class="card"><b>Protocol</b><br>ewe:// registered</div>
<p class="ok">Running foundation_platform 0.0.1 on Android</p>
<div id="log"></div>
<script>
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('log').textContent = '→ ' + a.getAttribute('href');
    window.location.href = a.getAttribute('href');
  });
});
</script>
</body></html>
