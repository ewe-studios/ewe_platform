# Opt out of parent workspace — this crate targets wasm32,
# which is incompatible with the host-target workspace builds.
[workspace]

[package]
name = "platform_android_wasm"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
foundation_wasm = { path = "../../../backends/foundation_wasm", features = ["web"] }
foundation_wasm_ui = { path = "../../../backends/foundation_wasm_ui" }
foundation_ui_traits = { path = "../../../backends/foundation_ui_traits" }
foundation_macros = { path = "../../../backends/foundation_macros" }

[profile.uat]
inherits = "release"
codegen-backend = "llvm"

[[bin]]
name = "platform_dashboard"
path = "bin/platform_dashboard/main.rs"

[[bin]]
name = "bg_worker"
path = "bin/bg_worker/main.rs"

[[bin]]
name = "platform_sw"
path = "bin/platform_sw/main.rs"
