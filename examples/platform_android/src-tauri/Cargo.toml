[package]
name = "platform_android"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[lib]
name = "platform_android_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
foundation_core = { path = "../../../backends/foundation_core", version = "0.0.5", features = ["multi"] }
foundation_platform = { path = "../../../backends/foundation_platform" }
foundation_ui_traits = { path = "../../../backends/foundation_ui_traits" }
foundation_wasm = { path = "../../../backends/foundation_wasm" }
foundation_macros = { path = "../../../backends/foundation_macros" }
foundation_nostd = { path = "../../../backends/foundation_nostd" }
foundation_wasm_ui = { path = "../../../backends/foundation_wasm_ui" }
ewe-platform-native = { path = "../../../backends/foundation_platform_native", features = ["modal", "dialog"] }
tauri = { version = "2.11.5", features = [] }
serde = "1"
serde_json = "1"

[build-dependencies]
foundation_platform = { path = "../../../backends/foundation_platform" }
tauri-build = { version = "2", features = [] }

# F44+F45+F46: Use our infrastructure forks of tao, wry, and tauri.
# tauri-runtime-wry (in our tauri fork) already points tao/wry at
# the infrastructure copies via path deps. The [patch] extends the
# replacement to tauri itself so we own all three layers.
[patch.crates-io]
tao = { path = "../../../foundations/tao" }
wry = { path = "../../../foundations/wry" }
tauri = { path = "../../../foundations/tauri/crates/tauri" }
tauri-build = { path = "../../../foundations/tauri/crates/tauri-build" }
tauri-runtime-wry = { path = "../../../foundations/tauri/crates/tauri-runtime-wry" }
tauri-runtime = { path = "../../../foundations/tauri/crates/tauri-runtime" }
tauri-macros = { path = "../../../foundations/tauri/crates/tauri-macros" }
tauri-codegen = { path = "../../../foundations/tauri/crates/tauri-codegen" }
tauri-plugin = { path = "../../../foundations/tauri/crates/tauri-plugin" }
tauri-utils = { path = "../../../foundations/tauri/crates/tauri-utils" }

# Opt out of parent workspace — Tauri v2 nested crate for mobile builds
[workspace]
