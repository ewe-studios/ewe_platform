<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundation Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;padding:12px;background:#0a0a1a;color:#ccd6f6}
h1{font-size:22px;color:#64ffda;margin:0 0 4px}
.sub{font-size:12px;color:#8892b0;margin:0 0 16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
nav a{font-size:13px;padding:8px 14px;border:1px solid #233554;border-radius:6px;background:#112240;color:#64ffda;text-decoration:none}
nav a:hover{background:#233554}
.card{background:#112240;border:1px solid #233554;border-radius:8px;padding:10px;margin:8px 0}
.card h3{font-size:13px;color:#64ffda;margin:0 0 6px}
.pill{font-size:11px;padding:2px 8px;border-radius:4px;display:inline-block;margin:2px}
.w{background:#1a3a2a;color:#64ffda}
.i{background:#3a2a1a;color:#ffb86c}
.r{background:#2a1a3a;color:#bd93f9}
</style></head><body>
<h1>Foundation Platform</h1>
<p class="sub">Android — Native Rust .so</p>
<nav>
  <a href="ewe://localhost/app/home">🏠 App (WASM)</a>
  <a href="ewe://localhost/api/status">⚡ API (IPC)</a>
  <a href="ewe://localhost/remote/news">🌐 Remote</a>
  <a href="ewe://localhost/cached/data">💾 Cached</a>
  <a href="ewe://localhost/auth/login">🔐 Auth</a>
</nav>
<div class="card"><h3>Session</h3>PlatformSession via platform_run!</div>
<div class="card"><h3>Routes</h3>
  <span class="pill w">WASM</span> /app/*<br>
  <span class="pill i">IPC</span> /api/*<br>
  <span class="pill r">Remote</span> /remote/*
</div>
<p style="font-size:10px;color:#445566;margin-top:12px">foundation_platform 0.0.1</p>
</body></html>
