<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation Platform</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0a0a1a;
      color: #ccd6f6;
    }
    h1 {
      color: #64ffda;
      font-size: 20px;
    }
    #__ewe_status {
      margin: 8px 0;
      font-size: 12px;
      color: #8892b0;
    }
  </style>
</head>
<body>
  <h1>Foundation Platform</h1>
  <div id="__ewe_status">Loading WASM runtime...</div>
  <script src="bundle.js"></script>
  <script>
    // ── platform_dashboard ──
    (function() {
      var status = document.getElementById('__ewe_status');
      var loader = new FoundationWasmRuntime.WasmLoader();
      loader
        .loadURL('./platform_dashboard.wasm')
        .then(function(result) {
          result.instance.exports.platform_dashboard();
          status.textContent = 'WASM active';
        })
        .catch(function(err) {
          status.textContent = 'Error: ' + String(err);
        });
    })();
  </script>

</body>
</html>
