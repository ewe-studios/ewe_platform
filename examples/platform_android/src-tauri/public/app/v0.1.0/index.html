<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation Platform</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0a0a1a;
      color: #ccd6f6;
    }
  </style>
  <script src="bundle.js"></script>
  <script>
    setTimeout(function() {
      if (typeof invokeIpc !== 'function') return;
      // Test all three commands sequentially
      invokeIpc('dialog', 'show', {title:'E2E Dialog',message:'Hello from E2E!',positive_button:'OK',negative_button:'Cancel'})
        .then(function(r) { console.error('[E2E] dialog OK ' + JSON.stringify(r)); })
        .catch(function(e) { console.error('[E2E] dialog FAIL ' + e); });
      invokeIpc('chrome', 'present_modal', {url:'ewe://localhost/app/',style:'bottom_sheet',title:'E2E Bottom Sheet'})
        .then(function(r) { console.error('[E2E] present OK ' + JSON.stringify(r)); })
        .catch(function(e) { console.error('[E2E] present FAIL ' + e); });
    }, 1500);
  </script>
</head>
<body>
  <script>
    // ── platform_dashboard ── (dynamic import — static <script type="module">
    //  fails on Android WebView through custom protocols)
    import('./platform_dashboard.js').then(function(m) {
      return m.init();
    }).then(function() {
      console.log('[platform] platform_dashboard: WASM active');
    }).catch(function(err) {
      console.error('[platform] platform_dashboard:', err);
    });
  </script>

</body>
</html>
