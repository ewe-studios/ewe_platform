<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation Platform</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0a0a1a;
      color: #ccd6f6;
    }
  </style>
  <script src="bundle.js"></script>
  <script>
    // F43 E2E: prove JS bridge → Tauri __ewe_ipc → ModalIpc works.
    setTimeout(function() {
      if (typeof invokeIpc !== 'function') { console.warn('[E2E] invokeIpc not ready'); return; }
      invokeIpc('chrome', 'present_modal', {route:'/nav_modal',style:'bottom_sheet',title:'E2E Boot'})
        .then(function(r) { console.log('[E2E] IPC OK', r); })
        .catch(function(e) { console.error('[E2E] IPC FAIL', e); });
    }, 500);
  </script>
</head>
<body>
  <script>
    // ── platform_dashboard ── (dynamic import — static <script type="module">
    //  fails on Android WebView through custom protocols)
    import('./platform_dashboard.js').then(function(m) {
      return m.init();
    }).then(function() {
      console.log('[platform] platform_dashboard: WASM active');
    }).catch(function(err) {
      console.error('[platform] platform_dashboard:', err);
    });
  </script>

</body>
</html>
