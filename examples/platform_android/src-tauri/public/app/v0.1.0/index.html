<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation Platform</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0a0a1a;
      color: #ccd6f6;
    }
  </style>
  <script src="bundle.js"></script>
</head>
<body>
  <script>
    // ── platform_dashboard ── (dynamic import — static <script type="module">
    //  fails on Android WebView through custom protocols)
    import('./platform_dashboard.js').then(function(m) {
      return m.init();
    }).then(function() {
      console.log('[platform] platform_dashboard: WASM active');
    }).catch(function(err) {
      console.error('[platform] platform_dashboard:', err);
    });
  </script>

<div id="ewe-dbg" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#0f0;font:9px monospace;padding:4px;z-index:99999;max-height:100px;overflow:auto;white-space:pre-wrap;">TRACE:</div>
</body>
</html>
