<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation Platform</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0a0a1a;
      color: #ccd6f6;
    }
  </style>
  <script src="bundle.js"></script>
  <script>
    setTimeout(function() {
      if (typeof invokeIpc !== 'function') return;
      invokeIpc('dialog', 'show', {title:'F46',message:'Both paths work',positive_button:'OK'})
        .then(function() { console.error('[E2E] DIALOG OK'); })
        .catch(function(e) { console.error('[E2E] DIALOG FAIL ' + e.message); });
      invokeIpc('chrome', 'present_modal', {url:'http://ewe.localhost/app/',style:'bottom_sheet',title:'F46 Stage1'})
        .then(function() { console.error('[E2E] MODAL OK'); })
        .catch(function(e) { console.error('[E2E] MODAL FAIL ' + e.message); });
    }, 2000);
  </script>
</head>
<body>
  <script>
    // ── platform_dashboard ── (dynamic import — static <script type="module">
    //  fails on Android WebView through custom protocols)
    import('./platform_dashboard.js').then(function(m) {
      return m.init();
    }).then(function() {
      console.log('[platform] platform_dashboard: WASM active');
    }).catch(function(err) {
      console.error('[platform] platform_dashboard:', err);
    });
  </script>

</body>
</html>
