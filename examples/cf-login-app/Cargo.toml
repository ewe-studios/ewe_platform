[package]
name = "cf-login-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["cloudflare", "wasm", "login", "example"]

[dependencies]
foundation_db = { path = "../../backends/foundation_db", version = "0.0.3", default-features = false, features = ["wasm", "wasm-bindgen-storage", "workers-rs"] }
foundation_core = { path = "../../backends/foundation_core", version = "0.0.5", features = ["js-wasmbindgen"] }
foundation_auth = { path = "../../backends/foundation_auth", version = "0.0.3", default-features = false, features = ["wasm", "wasm-bindgen-session"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Request",
    "Response",
    "Headers",
    "ResponseInit",
    "Url",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
argon2 = "0.5"
sha2 = "0.10"
minijinja = { version = "2.0", default-features = false, features = ["serde"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
console_error_panic_hook = "0.1"
console_log = "1"
tracing = "0.1"
log = "0.4"
worker = { version = "0.8.3", features = ["http", "d1"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
