<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 3rem 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 0.75rem; line-height: 1.6; }
        a { color: #dc2626; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .note-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e5e5; }
        .note-section h2 { font-size: 1.125rem; margin-bottom: 0.75rem; }
        .note-section label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
        .note-section textarea { display: block; width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; font-family: inherit; resize: vertical; min-height: 80px; }
        .note-section button { margin-top: 0.5rem; padding: 0.5rem 1rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 0.875rem; cursor: pointer; }
        .note-section button:hover { background: #1d4ed8; }
        .note-display { margin-top: 0.75rem; padding: 0.75rem; background: #f0f9ff; border-radius: 4px; font-size: 0.875rem; white-space: pre-wrap; min-height: 2rem; }
        .status { font-size: 0.75rem; margin-top: 0.5rem; color: #666; }
        .status.ok { color: #16a34a; }
        .status.err { color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dashboard</h1>
        <p>Welcome, <strong>{{ user }}</strong>!</p>
        <p>You are logged in to the Cloudflare Workers demo.</p>
        <div class="note-section">
            <h2>Valtron Test — Store a Note via D1</h2>
            <p style="font-size:0.8rem;color:#666;">Uses sync <code>CredentialStore::set/get</code> (valtron JSThreadYielder path) inside an async handler.</p>
            <label for="note-input">Your Note</label>
            <textarea id="note-input" placeholder="Type something to store in D1 via valtron..."></textarea>
            <button onclick="saveNote()">Save Note (valtron path)</button>
            <button onclick="loadNote()" style="background:#666;">Load Note</button>
            <div id="note-display" class="note-display" style="display:none;"></div>
            <div id="note-status" class="status"></div>
        </div>
        <p style="margin-top:1.5rem;"><a href="/logout">Logout</a></p>
    </div>
    <script>
        async function setStatus(msg, ok) {
            const el = document.getElementById('note-status');
            el.textContent = msg;
            el.className = 'status ' + (ok ? 'ok' : 'err');
        }

        async function saveNote() {
            const note = document.getElementById('note-input').value;
            if (!note.trim()) { setStatus('Note is empty', false); return; }
            setStatus('Saving...', true);
            try {
                const res = await fetch('/api/note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note })
                });
                const data = await res.json();
                if (!res.ok) { setStatus('Error: ' + (data.error || res.statusText), false); return; }
                setStatus('Saved via valtron ✓', true);
                displayNote(data.note);
            } catch (e) { setStatus('Request failed: ' + e.message, false); }
        }

        async function loadNote() {
            setStatus('Loading...', true);
            try {
                const res = await fetch('/api/note');
                const data = await res.json();
                if (!res.ok) { setStatus('Error: ' + (data.error || res.statusText), false); return; }
                if (data.note) {
                    displayNote(data.note);
                    document.getElementById('note-input').value = data.note;
                    setStatus('Loaded via valtron ✓', true);
                } else {
                    document.getElementById('note-display').style.display = 'none';
                    setStatus('No note found', false);
                }
            } catch (e) { setStatus('Request failed: ' + e.message, false); }
        }

        function displayNote(text) {
            const el = document.getElementById('note-display');
            el.textContent = text;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
