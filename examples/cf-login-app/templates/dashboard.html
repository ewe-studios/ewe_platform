<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 3rem 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { margin-bottom: 0.75rem; line-height: 1.6; }
        a { color: #dc2626; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dashboard</h1>
        <p>Welcome, <strong>{{ user }}</strong>!</p>
        <p>You are logged in to the Cloudflare Workers demo.</p>
        <p><a href="/logout">Logout</a></p>
    </div>
</body>
</html>
