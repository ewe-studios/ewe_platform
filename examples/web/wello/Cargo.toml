[package]
name = "wello"
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["EweStudios Consulting Limited"]
repository = "https://github.com/ewe-studios/ewe_platform"
keywords = ["ewe_platform", "ewestudios-platform", "ewestudios_platform"]

[dependencies]
# -- ewe platform dependencies
foundation_http = { path = "../../../backends/foundation_http", version = "0.0.7", features = ["multi"] }
foundation_core = { path = "../../../backends/foundation_core", version = "0.0.16", features = ["multi"] }

# directory embedding
rust-embed = "8.5.0"

# -- tracing crates
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18" }

[dev-dependencies]
# netio client for the end-to-end route test.
foundation_netio = { path = "../../../backends/foundation_netio", version = "0.0.7" }

[features]
default = []

# Opt out of the parent workspace — this crate is self-contained.
[workspace]

# Mirror the root workspace's `uat` profile so `--profile uat` works here too.
[profile.uat]
inherits = "dev"
