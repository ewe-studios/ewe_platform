[package]
name = "dev"
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license =  "MIT OR Apache-2.0"
description = "Dev server for your project which builts in great defaults"
keywords = [
    "local-server",
    "dev-sever",
]

[dependencies]
# The dev server runtime (replaces the retired ewe_devserver).
foundation_toolings = { path = "../../backends/foundation_toolings", version = "0.0.10" }

# -- tracing crates
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18" }

[lints.rust]
unsafe_code = "forbid"

# Opt out of the parent workspace — this crate is self-contained.
[workspace]

# Mirror the root workspace's `uat` profile so `--profile uat` works here too.
[profile.uat]
inherits = "dev"
