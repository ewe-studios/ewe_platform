[package]
name = "agent-rpc-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "The agent-rpc browser client exported to JavaScript (spec 83 feature 05, T22)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# `examples/*` are excluded from the root workspace; this crate is its own root.
[workspace]

[dependencies]
foundation_agent_rpc = { path = "../../backends/foundation_agent_rpc", default-features = false, features = ["web-client"] }
foundation_core = { path = "../../backends/foundation_core", default-features = false, features = ["std", "js-wasmbindgen"] }
foundation_context = { path = "../../backends/foundation_context" }
futures = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
