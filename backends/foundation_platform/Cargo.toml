[package]
name = "foundation_platform"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Cross-platform application layer for native, desktop, mobile and web apps: sessions, route policies, capabilities, caching, transport lanes and WebView management, with Tauri as one host"

[features]
default = ["wasmtime"]
wasmtime = ["dep:foundation_wasmtime"]

[dependencies]
# Host platform (generic R: Runtime — works on Wry, Android, iOS)
tauri = { version = "2.11.5", features = [] }

# Embedded assets (EmbeddableDirectory trait + #[derive(EmbedDirectoryAs)])
foundation_nostd = { path = "../foundation_nostd", version = "0.0.7" }

# The injected clock every platform wall time comes from (spec 70 feature 134).
foundation_core = { path = "../foundation_core", version = "0.0.19" }
# UNIX timestamp conversions from `Clock::wall_now`; no local epoch arithmetic.
foundation_compact = { path = "../foundation_compact", version = "0.2.4" }

# Shared types (dependency-free, compiles for wasm32)
foundation_ui_traits = { path = "../foundation_ui_traits", version = "0.0.3" }

# WASM UI build pipeline — WasmBundleGenerator (native-only, target-gated)
foundation_wasm_ui = { path = "../foundation_wasm_ui", version = "0.1.1", features = ["embedded-js"] }

# Portable WASM primitives — WasmCapability trait + CapabilityRegistry (F23)
foundation_wasm = { path = "../foundation_wasm", version = "0.0.7" }

# Lock-free queue for streaming IPC chunks (F26)
concurrent-queue = { workspace = true }

# Standard deps
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# HTTP client for remote fetch (F29 Stage 2)
# Uses rustls-tls for cross-platform TLS — no native openssl dependency.
# blocking + json features for sync fetch in route handlers.
# HTTP client + networking — only need the client, not all of netcap/TCP
# We explicitly enable only what HttpClientBuilder::build() requires.
# `multi` enables NativeHttpClient; `ssl-rustls-ring` provides TLS.
foundation_netio = { path = "../foundation_netio", version = "0.0.10", default-features = false, features = ["multi", "ssl-rustls-ring", "compression", "wire-native", "std"] }

# Build-time code generation — wraps tauri_build::build() + annotation scanning.
tauri-build = { version = "2" }

# Wasmtime shell — Surface 3 WASM runtime (F33). The engine uses a JIT, which
# iOS, tvOS and watchOS refuse, so it stays out of those targets.
[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos")))'.dependencies]
foundation_wasmtime = { path = "../foundation_wasmtime", version = "0.1.1", optional = true }

[dev-dependencies]
tauri = { version = "2.11.5", features = [] }
# The clock injection test moves a `SimulatedClock`; `test-clock` exposes it.
foundation_core = { path = "../foundation_core", version = "0.0.19", features = ["test-clock"] }

[lints]
workspace = true
