[package]
name = "foundation_wasm_testbed"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI-driven test harness for wasm32-unknown-unknown"

[dependencies]
clap = { version = "4", features = ["derive"] }
walrus = { workspace = true }
foundation_codegen = { workspace = true }
foundation_wasm_ui = { workspace = true, features = ["embedded-js"] }
serde = { workspace = true }
serde_json = { workspace = true }
foundation_http = { workspace = true }
# The pure-Rust CDP browser driver (spec-43) — replaces the node/Playwright path.
foundation_browser = { workspace = true }
foundation_core = { workspace = true, features = ["multi"] }
foundation_errstacks = { workspace = true }
foundation_macros = { workspace = true }
foundation_nostd = { workspace = true }
tempfile = "3"
which = "7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
portpicker = { workspace = true }
derive_more = { version = "2", features = ["display", "error", "from"] }

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = { workspace = true }

[lints]
workspace = true
