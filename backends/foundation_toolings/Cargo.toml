[package]
name = "foundation_toolings"
version = "0.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Development tooling server: reverse proxy, file watcher, hot reload — built on valtron and native APIs, zero async runtime deps"
keywords = ["devserver", "proxy", "hot-reload", "valtron", "native-apis"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.20" }
foundation_context = { path = "../foundation_context", version = "0.0.2" }
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.14" }
foundation_http = { path = "../foundation_http", version = "0.0.11" }
foundation_netio = { path = "../foundation_netio", version = "0.0.13" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.8" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
foundation_compact = { path = "../foundation_compact", version = "0.2.5" }

tracing.workspace = true
derive_more.workspace = true
concurrent-queue = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

which = "7"

# Unix: kill the whole wrangler process group (wrangler → workerd) on stop.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Opt-in: run the Cloudflare Worker examples under miniflare against a mocked
# vendor (tests/cf_examples.rs). Needs worker-build, the wasm32 target and
# wrangler/npx on PATH.
cf-worker-tests = []

[dev-dependencies]
tracing-test.workspace = true
tracing-subscriber.workspace = true
# The SSE reload test drives the handler's async continuation on the
# multi-threaded valtron executor, as a serving server does.
foundation_core = { path = "../foundation_core", version = "0.0.20", features = ["multi", "test-clock"] }
foundation_macros = { path = "../foundation_macros", version = "0.0.20" }

[lints]
workspace = true
