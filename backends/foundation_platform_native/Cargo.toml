[package]
name = "ewe-platform-native"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
links = "ewe-platform-native"

[lib]
name = "foundation_platform_native"

[dependencies]
foundation_platform = { path = "../foundation_platform" }
foundation_wasm = { path = "../foundation_wasm" }
foundation_ui_traits = { path = "../foundation_ui_traits" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = []
modal = []
dialog = []
camera = []
biometric = []
chrome = []
filesystem = []
