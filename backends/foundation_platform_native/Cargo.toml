[package]
name = "ewe-platform-native"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
links = "ewe-platform-native"

[lib]
name = "foundation_platform_native"

[dependencies]
# Shared — available on all targets including wasm32.
foundation_wasm = { path = "../foundation_wasm" }
foundation_ui_traits = { path = "../foundation_ui_traits" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only — IPC handlers that drive WebViewStack / WindowManager.
# Gated so WASM apps can depend on this crate for typed IPC wrappers.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_platform = { path = "../foundation_platform" }

[target.'cfg(not(target_family = "wasm"))'.dependencies.tauri]
version = "2"
default-features = false

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = []
modal = []
dialog = []
camera = []
biometric = []
chrome = []
filesystem = []
