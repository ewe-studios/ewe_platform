[package]
name = "foundation_repl"
version = "0.2.0"
description = "A lightweight, general-purpose REPL framework for interactive terminal sessions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["shell_repl", "repl", "tui", "terminal"]

[dependencies]
tracing = { workspace = true }
unicode-width = "0.2"
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_28",
], optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tracing-test = { workspace = true }

[features]
default = ["native", "colors"]
native = ["dep:crossterm", "dep:ratatui"]
colors = ["native"]
history-file = ["dep:serde", "dep:serde_json"]
wasm = ["dep:js-sys", "dep:web-sys"]

[lints]
workspace = true
