[package]
name = "foundation_wasm"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Implements the nostd interface runtime for WASM and JS interoperability"
include = ["/src", "/runtime"]

[dependencies]
foundation_nostd = { workspace = true }
foundation_macros = { workspace = true }

# Build tooling (feature 20): scanning #[wasm_entrypoint] fns and generating
# bin/ sources — std-only, native-only, OFF by default (wasm builds untouched).
foundation_codegen = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
# The crate OWNS how its entrypoints become wasm binaries (feature 20).
build-tools = ["dep:foundation_codegen", "dep:toml", "dep:toml_edit"]
# The `wasm-bins` CLI surface over build-tools.
cli = ["build-tools", "dep:clap"]
f128 = []
# The `web` feature enables the JS/web host ABI (`abi` module): the
# `wasm_import_module = "abi"` FFI imports, `HostFunction`, function invocation,
# timers, and the uniform `host_apply` transport. Off by default so non-web hosts
# (WASI, native, custom WASM hosts) aren't forced to supply those imports. Consumers
# that talk to a JS host (e.g. `foundation_wasm_ui`) enable it.
web = []
# Embeds the single-file JS runtime (runtime/foundation-wasm.js) into the binary so
# servers/bundler-less deployments can serve it without an asset pipeline.
embedded-js = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.10"
