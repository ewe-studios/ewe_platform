[package]
name = "foundation_wasm"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Implements the nostd interface runtime for WASM and JS interoperability"
include = ["/src", "/runtime"]

[[bin]]
name = "ewe-wasm-bins"
path = "src/bin/ewe_wasm_bins.rs"
# Builds on every native build; on wasm32 it degrades to a stub main —
# the build tooling never belongs in the artifact.

[dependencies]
foundation_nostd = { workspace = true }
foundation_macros = { workspace = true }

# Build tooling (feature 20): scanning #[wasm_entrypoint] fns and generating
# bin/ sources — a std, native-only concern, so target-gated rather than
# feature-gated: every native build gets the CLI, wasm builds never see it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
foundation_codegen = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

[features]
f128 = []
# The `web` feature enables the JS/web host ABI (`abi` module): the
# `wasm_import_module = "abi"` FFI imports, `HostFunction`, function invocation,
# timers, and the uniform `host_apply` transport. Off by default so non-web hosts
# (WASI, native, custom WASM hosts) aren't forced to supply those imports. Consumers
# that talk to a JS host (e.g. `foundation_wasm_ui`) enable it.
web = []
# Embeds the single-file JS runtime (runtime/foundation-wasm.js) into the binary so
# servers/bundler-less deployments can serve it without an asset pipeline.
embedded-js = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.10"
