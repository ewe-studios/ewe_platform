[package]
name = "foundation_installer"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Manifest-driven installer: reads a spec 78 manifest, gets each entry through a source adapter and starts it through a deploy-target adapter"
keywords = ["installer", "manifest", "systemd", "docker", "bootstrap"]

[dependencies]
derive_more = { workspace = true }
foundation_core = { path = "../foundation_core", version = "0.0.22" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_compact = { path = "../foundation_compact", version = "0.2.6" }
foundation_netio = { path = "../foundation_netio", version = "0.0.16", features = ["ssl", "multi"] }
foundation_deployment_docker = { path = "../foundation_deployment_docker", version = "0.1.7", features = ["docker"] }
foundation_packager = { path = "../foundation_packager", version = "0.1.6" }
foundation_macros = { path = "../foundation_macros", version = "0.0.23" }

async-trait = "0.1.91"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-lite = "2"
minijinja = "2.21"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Run the end-to-end tests that talk to a real Docker daemon. They skip
# themselves when no daemon answers.
docker-tests = []

[[bin]]
name = "ewe-installer"
path = "src/bin/ewe-installer.rs"

[lints]
workspace = true
