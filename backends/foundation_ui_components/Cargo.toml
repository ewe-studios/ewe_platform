[package]
name = "foundation_ui_components"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Headless UI components over foundation_wasm_ui — data-attribute styling contract, WAI-ARIA compliant."

[dependencies]
# This crate is `no_std`: no default features on either, since signals'
# default `std` and wasm_ui's default `arrow` (arrow-rs is a std crate) would
# both link `std`. Neither the hub nor Arrow IPC is used here; apps that want
# Arrow IPC enable `foundation_wasm_ui/arrow` themselves.
foundation_wasm_ui = { path = "../foundation_wasm_ui", version = "0.1.0", default-features = false }
foundation_signals = { path = "../foundation_signals", version = "0.0.1", default-features = false, features = ["single_threaded"] }
foundation_ui_traits = { path = "../foundation_ui_traits", version = "0.0.2" }
tracing = { version = "0.1", default-features = false }

[lints]
workspace = true
