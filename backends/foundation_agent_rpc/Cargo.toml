[package]
name = "foundation_agent_rpc"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Per-machine agent RPC model server: load a model once, serve named agent instances over Connect/gRPC/gRPC-Web with token-bootstrapped mTLS"
keywords = ["agent", "rpc", "connectrpc", "grpc", "foundation"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.6", features = ["multi"] }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3" }
# Local model backends stay opt-in (`candle` default, `gguf` adds llama.cpp):
# the agentic layer, providers and `PreloadedProvider` need neither.
foundation_ai = { path = "../foundation_ai", version = "0.0.2", default-features = false, features = ["multi"] }
foundation_db = { path = "../foundation_db", version = "0.0.4", default-features = false }
# RPC engine (Connect + gRPC + gRPC-Web); `rpc_multi` = threaded valtron executor.
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.3" }
# The listener (h1 + h2c, TLS) and the client/TLS plumbing.
foundation_http = { path = "../foundation_http", version = "0.0.3", features = ["multi", "ssl"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.4", features = ["ssl", "multi"] }
# Entropy for bootstrap tokens (the cross-platform substrate).
foundation_compact = { path = "../foundation_compact", version = "0.2.2" }
# Client auth: CA + client/server certificates (ring backend, as
# foundation_proxy), mutual-TLS server configs, fingerprints, secret hygiene.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
time = "0.3"
# Bootstrap payload as a QR code (terminal + SVG renderers; no image codecs).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
derive_more = { version = "2.1", features = ["display", "error"] }
# Runtime for the buffa-generated message types (same version connectrpc uses).
buffa = { version = "0.8.1", features = ["json"] }
# The generated service code names `futures::Stream`.
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
# Message types from proto/ (buffa-build, needs `protoc`) + ConnectRPC service
# stubs (foundation_connectrpc_codegen) — the foundation_deployment_docker
# BuildKit pattern.
# Must match the `buffa` runtime (0.8.x): 0.9 codegen calls 0.9-only APIs.
buffa-build = "=0.8.1"
foundation_connectrpc_codegen = { path = "../foundation_connectrpc_codegen", version = "0.0.2" }
prost = "0.12"
prost-types = "0.12"

[dev-dependencies]
tracing-subscriber = { workspace = true }
# `testing`: MockModelProvider + message builders for deterministic server tests.
foundation_ai = { path = "../foundation_ai", version = "0.0.2", default-features = false, features = ["multi", "testing"] }
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }

[features]
default = ["candle"]
# Candle (pure-Rust) local inference backend.
candle = ["foundation_ai/candle"]
# GGUF via llama.cpp (needs the vendored llama.cpp sources to build).
gguf = ["foundation_ai/llamacpp"]

[[test]]
name = "model_share_tests"
path = "tests/model_share_tests.rs"
required-features = ["candle"]

[[test]]
name = "instance_tests"
path = "tests/instance_tests.rs"
required-features = ["candle"]

[[test]]
name = "service_tests"
path = "tests/service_tests.rs"

[[test]]
name = "connect_unary_tests"
path = "tests/connect_unary_tests.rs"

[[test]]
name = "connect_stream_tests"
path = "tests/connect_stream_tests.rs"

[[test]]
name = "auth_tests"
path = "tests/auth_tests.rs"

[[test]]
name = "auth_log_tests"
path = "tests/auth_log_tests.rs"

[[test]]
name = "bootstrap_tests"
path = "tests/bootstrap_tests.rs"

[[test]]
name = "rpc_e2e_tests"
path = "tests/rpc_e2e_tests.rs"
required-features = ["candle"]

[[test]]
name = "model_handle_tests"
path = "tests/model_handle_tests.rs"
required-features = ["candle"]

[lints]
workspace = true
