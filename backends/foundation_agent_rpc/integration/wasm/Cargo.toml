# Standalone wasm test crate for foundation_agent_rpc's browser client
# (spec 83 feature 05, T22). It is outside the root workspace because the
# crate's own test targets cannot build for wasm32 (their dev-dependencies
# include native-only crates).
#
#   cargo run -p foundation_testbed --features wasm --profile uat \
#     --bin wasm-testbed -- test bindgen-deno \
#     backends/foundation_agent_rpc/integration/wasm
[package]
name = "foundation_agent_rpc_wasm_tests"
version = "0.0.1"
publish = false
edition = "2024"

[dependencies]
foundation_agent_rpc = { path = "../..", default-features = false, features = ["web-client"] }
foundation_auth = { path = "../../../foundation_auth", default-features = false, features = ["secret", "wasm"] }
foundation_compact = { path = "../../../foundation_compact", default-features = false }
foundation_context = { path = "../../../foundation_context" }
foundation_core = { path = "../../../foundation_core", default-features = false, features = ["std", "js-wasmbindgen"] }
buffa = { version = "0.9.2", features = ["json"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Response"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[profile.uat]
inherits = "dev"
