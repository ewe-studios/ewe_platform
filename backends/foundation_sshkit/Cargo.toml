[package]
name = "foundation_sshkit"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SSH orchestration — connection pooling, host abstraction, command execution, runners"

[dependencies]
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
foundation_core = { path = "../foundation_core", version = "0.0.20" }
foundation_context = { path = "../foundation_context", version = "0.0.2" }

ssh2 = "0.9"

serde.workspace = true
serde_json.workspace = true
derive_more.workspace = true
tracing.workspace = true
ssh2-config = "0.6"
dirs = "5"
base64 = "0.22"

[features]
default = []

[dev-dependencies]
# `SimulatedClock` for the clock-injection test (spec 70 feature 134).
[dev-dependencies.foundation_core]
path = "../foundation_core"
version = "0.0.20"
features = ["test-clock"]

[lints]
workspace = true
