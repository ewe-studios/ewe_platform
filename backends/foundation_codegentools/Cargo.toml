[package]
name = "foundation_codegentools"
version = "0.1.4"
description = "Code generation tooling: WASM binary generation, schema codegen, crate scanning, and build tooling for the ewe platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["wasm", "codegen", "build-tools"]

[features]
cli = ["dep:clap", "dep:sha2"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
foundation_codegen = { path = "../foundation_codegen", version = "0.1.3", features = ["wat"] }
foundation_compact = { path = "../foundation_compact", version = "0.2.4" }
foundation_core = { path = "../foundation_core", version = "0.0.14" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3" }
foundation_openapi = { path = "../foundation_openapi", version = "0.0.5" }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "parsing"] }
# Manifest provenance: detects the vendor moving a spec, or an artefact being
# hand-edited (spec-56 decision 05).
sha2 = { version = "0.10", optional = true }
# `check()` generates into a scratch tree to compare without writing — so it is a
# runtime need of the library, not just of the tests.
tempfile = "3.10"

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "genapi"
path = "src/bin/genapi.rs"
required-features = ["cli"]

[lints]
workspace = true
