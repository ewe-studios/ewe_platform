[package]
name = "foundation_codegentools"
version = "0.1.0"
description = "Code generation tooling: WASM binary generation, schema codegen, crate scanning, and build tooling for the ewe platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["wasm", "codegen", "build-tools"]

[features]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
foundation_codegen = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "parsing"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.10"

[lints]
workspace = true
