[package]
name = "foundation_webwasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Polyfilled std::time APIs for wasm32-unknown-unknown — Instant and SystemTime backed by Performance.now() and Date.now()"
keywords = ["wasm", "web", "instant", "systemtime", "polyfill"]

# wasm32-only: JS bindings for Performance.now() and Date.now()
# Native targets: zero dependencies (re-exports std::time)
[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = { version = "0.2.70" }
js-sys = { version = "0.3.20" }
serde = { version = "1", optional = true }

[features]
default = []
std = []
serde = ["dep:serde"]
msrv = []

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dev-dependencies]
wasm-bindgen-test = "0.3"
rand = { version = "0.8", default-features = false, features = ["getrandom", "std_rng"] }
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
