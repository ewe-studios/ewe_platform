[package]
name = "foundation_ai"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AI foundation crate for the eweplatform"
keywords = ["foundations_ai", "ewe-platform-ai"]

[dependencies]

# -- Workspace dependencies

foundation_nostd = { workspace = true }
foundation_auth = { workspace = true, features = ["turso"] }
foundation_macros = { workspace = true }
foundation_core = { workspace = true }
foundation_netio = { workspace = true }
foundation_deployment_huggingface = { workspace = true }
foundation_errstacks = { workspace = true, features = ["to_structured"] }
foundation_jsonschema = { workspace = true }
foundation_compact = { workspace = true, features = ["serde"] }
foundation_arrow = { workspace = true }
# DocumentStore / KeyValueStore traits + StorageResult for the agentic memory
# stores (F07). default-features=false → just the core traits + in-memory backends
# (no turso/d1/r2 pulled into foundation_ai).
foundation_db = { workspace = true, default-features = false }
concurrent-queue = "2.5.0"

# -- Other dependencies
async-trait = "0.1"
regex = { version = "1.10" }
tracing = { workspace = true }
lazy-regex = { version = "3.1" }
derive_more = { version = "2.1", features = ["from", "debug", "display", "error"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# llamacpp — target-gated: builds on native + emscripten, excluded on wasm-unknown-unknown/wasi
[target.'cfg(any(not(target_family = "wasm"), target_os = "emscripten"))'.dependencies]
infrastructure_llama_cpp = { workspace = true, optional = true }

# Candle ML framework (optional, behind feature flags)
[dependencies.candle-nn]
version = "0.10"
optional = true

[dependencies.candle-transformers]
version = "0.10"
optional = true

[dependencies.tokenizers]
version = "0.22"
optional = true

[dependencies.fastrand]
version = "2.3"
optional = true

# Candle with Metal — Apple only.
[target.'cfg(target_vendor = "apple")'.dependencies]
candle-core = { version = "0.10", features = ["metal"] }

[dev-dependencies]
foundation_testing = { workspace = true, features = ["huggingface"] }
serial_test = { workspace = true }
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
futures-lite = "2"

[[test]]
name = "message_api_tests"
path = "tests/message_api_tests.rs"

[features]
default = ["llamacpp", "agentic"]
llamacpp = ["dep:infrastructure_llama_cpp"]
agentic = []

# vulkan + Apple Metal (route through llamacpp)
metal = ["llamacpp", "infrastructure_llama_cpp/metal"]
vulkan = ["llamacpp", "infrastructure_llama_cpp/vulkan"]

# cuda flags
cuda = ["llamacpp", "infrastructure_llama_cpp/cuda"]
cuda_static = ["llamacpp", "infrastructure_llama_cpp/cuda", "infrastructure_llama_cpp/cuda-no-vmm"]

# Android
android = ["llamacpp", "infrastructure_llama_cpp/android-shared-stdcxx"]

# OpenMP
openmp = ["llamacpp", "infrastructure_llama_cpp/openmp"]

# MultiModel Model
mtmd = ["llamacpp", "infrastructure_llama_cpp/mtmd"]

# Candle inference backend
candle = ["candle-nn", "candle-transformers", "tokenizers", "fastrand"]
candle-cuda = ["candle", "candle-core/cuda"]

# Multi-threaded executor
multi = ["foundation_deployment_huggingface/multi", "foundation_core/multi"]

[lints]
workspace = true
