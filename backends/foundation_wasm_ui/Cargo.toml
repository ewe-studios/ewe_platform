[package]
name = "foundation_wasm_ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
description = "DOM/window/animation bindings + WASM protocol implementations built on foundation_wasm (ABI) and foundation_ui_traits (encoding)."

[[bin]]
name = "ewe-wasm-bundle"
path = "src/bin/ewe_wasm_bundle.rs"
# Builds on every native build; on wasm32 it degrades to a stub main —
# the build tooling never belongs in the artifact.

[dependencies]
# foundation_wasm_ui is the JS/web host layer, so it always needs the web ABI.
foundation_wasm = { path = "../foundation_wasm", version = "0.0.3", features = ["web"] }
foundation_ui_traits = { path = "../foundation_ui_traits", version = "0.0.1" }
# The reactive layer this runtime bridges to the DOM (decision 012 diagram:
# foundation_wasm_ui depends on BOTH signals and wasm).
foundation_signals = { path = "../foundation_signals", version = "0.0.1" }
# Re-exports the html! proc macro (feature 03); macros live in
# foundation_macros per project rule.
foundation_macros = { path = "../foundation_macros", version = "0.0.4" }
# Theme token model + shared CSS generator (the theme!{} macro, ThemeTokens
# derive, and runtime Theme builder all route through it).
foundation_theme = { path = "../foundation_theme", version = "0.0.1" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.4" }
tracing = { version = "0.1", default-features = false }
# Arrow IPC v2 over the loop (the `arrow` feature).
foundation_arrow = { path = "../foundation_arrow", version = "0.0.1", optional = true }

# Build tooling (feature 20): JS wrappers + bundles over foundation_wasm's
# build_tools — a std, native-only concern, so target-gated rather than
# feature-gated: every native build gets the CLI, wasm builds never see it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
foundation_codegen = { path = "../foundation_codegen", version = "0.1.0" }
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

[features]
# Apache Arrow IPC support is ON by default (arrow-native support is a
# project goal; arrow-rs rides default-features=false and builds for
# wasm32). Size-sensitive artifacts opt OUT with default-features = false.
default = ["arrow"]
# Wire VERSION 2 over the loop: ArrowIpcV2 + App::arrow_ipc.
arrow = ["dep:foundation_arrow"]
# Embeds the JS runtime assets (foundation-wasm.js / foundation-wasm-ui.js) into the binary.
embedded-js = ["foundation_wasm/embedded-js"]

[lints]
workspace = true

[dev-dependencies]
# Test 12: assert the JSON protocol's payload parses as real JSON.
serde_json = { workspace = true }
