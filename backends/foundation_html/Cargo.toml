[package]
name = "foundation_html"
version = "0.0.6"
description = "foundation_html crate for web and non-web based html generation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.8" }
foundation_conditional = { path = "../foundation_conditional", version = "0.1.2" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3" }

derive_more = { workspace = true }

regex = { version = "1.10" }
lazy-regex = { version = "3.1" }
lazy_static = { version = "1.4.0" }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18" }


[dev-dependencies]
tracing-test = { version = "0.2.5" }
criterion = { version = "0.5", features = ["html_reports"] }

[lints]
workspace = true

[features]
debug_block = ["foundation_conditional/debug_block"]
trace_block = ["foundation_conditional/trace_block"]

[[bench]]
name = "cwikipedia"
harness = false
