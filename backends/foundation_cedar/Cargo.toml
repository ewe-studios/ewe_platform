[package]
name = "foundation_cedar"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cedar policy engine integration — fine-grained authorization with optional database-backed policy storage"
keywords.workspace = true

[dependencies]
cedar-policy = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_more = { version = "2.0", features = ["from", "error", "display"] }
smol_str = "0.3"

foundation_core = { path = "../foundation_core", version = "0.0.5", optional = true }
foundation_db = { path = "../foundation_db", version = "0.0.2", optional = true, default-features = false }

[dev-dependencies]

[lints]
workspace = true

[features]
default = []
db = ["dep:foundation_core", "dep:foundation_db"]
