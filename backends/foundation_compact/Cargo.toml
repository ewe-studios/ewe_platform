[package]
name = "foundation_compact"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform substrate: time polyfill + vendored entropy + RNG + scru128 IDs"
keywords = ["wasm", "time", "entropy", "rng", "scru128"]

[dependencies]
cfg-if = "1"
fstr = { version = "0.2.20", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { workspace = true }
foldhash = { version = "0.2", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
forkguard = { version = "0.1", optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
zeroize = { version = "1.8", features = ["derive"] }
# `default-features = false` keeps `uuid` as a pure no_std value/formatting type:
# entropy comes from `crate::entropy`, not from `uuid`'s `rng`/`js`/`getrandom` path.
uuid = { version = "1", default-features = false }

# Platforms using libc-based entropy backends (getentropy, getrandom(2), /dev/urandom)
# The Apple mobile and TV platforms use `CCRandomGenerateBytes` in `apple_other.rs`,
# which also comes from `libc`.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos", target_os = "emscripten", target_os = "openbsd", target_os = "vita", target_os = "android", target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "hurd", target_os = "illumos", target_os = "haiku", target_os = "redox", target_os = "nto", target_os = "aix", target_os = "netbsd", target_os = "cygwin", target_os = "horizon", target_os = "solaris"))'.dependencies]
libc = { version = "0.2", default-features = false }

# WASI preview 2: the generated bindings crate that the `wasi_p2_3` entropy
# backend calls. `default-features = false` keeps the crate `no_std`; the
# `random` module needs no `std` or `bitflags` feature.
[target.'cfg(all(target_family = "wasm", target_os = "wasi", target_env = "p2"))'.dependencies]
wasip2 = { version = "1.0.4", default-features = false }

# WASI preview 3: the same wiring for the preview 3 world. The bindings crate
# is 0.9 and it is not a dependency of another crate in this workspace, so it
# resolves as a direct dependency only for this target.
[target.'cfg(all(target_family = "wasm", target_os = "wasi", target_env = "p3"))'.dependencies]
wasip3 = { version = "0.9", default-features = false }

# Native-only: tracing subscriber for test diagnostics (trace module)
[target.'cfg(not(all(target_family = "wasm", any(target_os = "unknown", target_os = "none"))))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# wasm32-unknown-unknown only: wasm-bindgen bindings for the time polyfill and
# Web Crypto entropy. Optional: the `host-abi` backend needs neither.
#
# `tracing` + `tracing-subscriber` power the wasm `console` trace writer (see
# `trace`). They are optional and wired to the `wasm-bindgen` feature, so the
# `host-abi` backend (no wasm-bindgen, no console) stays free of them.
[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = { version = "0.2.70", optional = true }
js-sys = { version = "0.3.20", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[features]
default = ["std", "wasm-bindgen"]
std = ["fstr/std"]
# wasm32-unknown-unknown backends for time (`Instant`, `SystemTime`) and entropy.
# No effect on other targets.
#
# - `wasm-bindgen`: calls `performance.now()`, `Date.now()` and
#   `crypto.getRandomValues()` through wasm-bindgen glue, for modules loaded by
#   wasm-bindgen's JS (Cloudflare Workers, `wasm-bindgen-test`).
# - `host-abi`: imports the same three from the `abi` host module that
#   `foundation_wasm`'s `foundation-wasm.js` supplies, with no wasm-bindgen in
#   the module (the owned `js-foundation-wasm` path).
#
# `host-abi` wins when both are on, so a crate elsewhere in the graph that
# keeps compact's default features cannot put wasm-bindgen imports back into an
# owned module. With neither on, the host-ABI backend is used: it is the only
# one that needs no extra dependency.
wasm-bindgen = ["dep:wasm-bindgen", "dep:js-sys", "dep:tracing", "dep:tracing-subscriber"]
host-abi = ["dep:tracing", "dep:tracing-subscriber"]
serde = ["dep:serde"]
global_gen = ["std", "dep:forkguard"]
native = ["std", "global_gen"]
msrv = []
crypto-chacha = ["dep:chacha20poly1305"]

[target.'cfg(not(all(target_family = "wasm", any(target_os = "unknown", target_os = "none"))))'.dev-dependencies]
tracing = "0.1"
serde_test = "1"

[lints.rust]
missing_docs = "allow"
missing_debug_implementations = "allow"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(getrandom_backend, values("custom", "linux_getrandom", "linux_raw", "rdrand", "rndr", "efi_rng", "windows_legacy", "unsupported", "extern_impl"))',
    'cfg(getrandom_msan)',
    'cfg(getrandom_test_linux_fallback)',
    'cfg(getrandom_test_linux_without_fallback)',
] }

[lints.clippy]
pedantic = "warn"
