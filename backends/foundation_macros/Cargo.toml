[package]
name = "foundation_macros"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Macros for the foundations_jsnostd crate providing suitable support to simplify usage"
keywords = ["foundations_macros"]

[lib]
proc-macro = true

[dependencies]
foundation_nostd = { path = "../foundation_nostd", version = "0.0.4" }
# Shared theme CSS generator — called at macro-expansion time so theme!{} and
# #[derive(ThemeTokens)] embed identical, runtime-generated CSS.
foundation_theme = { path = "../foundation_theme", version = "0.0.1" }

syn = { version = ">=2.0", features = ["full", "parsing", "extra-traits"] }
quote = ">=1.0"
proc-macro2 = ">=1.0"
proc-macro-crate = "3.3.0"
synstructure = "0.13.2"

# brotli 
brotli = "8.0.2"

# gzip, zlib compression
flate2 = "1.1.5"

# UUID parsing for TypeUuid derive
uuid = { version = "1", default-features = false }

# Compute hash
sha2 = "0.10.8"

# Encode hash & etag
base85rs = "0.1"

# Compute last-modified timestamps
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Compute the mime types
new_mime_guess = "4.0"

[dev-dependencies]
trybuild = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
foundation_arrow = { path = "../foundation_arrow", version = "0.0.1" }
foundation_jsonschema = { path = "../foundation_jsonschema", version = "0.0.1" }
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.1" }
futures = "0.3"

[lints]
workspace = true
