[package]
name = "foundation_event_stream"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Durable Streams subscriptions, webhook delivery and pull-wake for the ewe platform"
keywords = ["durable-streams", "subscriptions", "webhook", "foundation"]

[lib]
name = "foundation_event_stream"
path = "src/lib.rs"

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.23" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_compact = { path = "../foundation_compact", version = "0.2.7", default-features = false }
# The one key model and the JSON Web Key Set (JWKS) serialisation. The
# `default-features = false` build keeps the SQLite and signed-secret trees out.
foundation_auth = { path = "../foundation_auth", version = "0.0.17", default-features = false }

ed25519-compact = { workspace = true, features = ["std"] }
futures-lite = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
time = { workspace = true, features = ["formatting"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
foundation_auth = { path = "../foundation_auth", version = "0.0.17", default-features = false, features = ["wasm"] }

[target.'cfg(unix)'.dependencies]
foundation_http = { path = "../foundation_http", version = "0.0.17" }
foundation_netio = { path = "../foundation_netio", version = "0.0.19", features = ["multi"] }

[lints]
workspace = true
