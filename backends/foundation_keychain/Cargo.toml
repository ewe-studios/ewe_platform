[package]
name = "foundation_keychain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bitwarden-compatible vault + SSH key provisioning built on foundation_db and foundation_auth"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = "1"
base64 = "0.22"
base32 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rmpv = "1"
rmp-serde = "1"
tracing = { workspace = true }
thiserror = { workspace = true }

# SSH key generation (F012 — enable with ssh-keys feature)
ssh-key = { version = "0.6", features = ["ed25519", "rsa"], optional = true }
# At-rest encryption for stored private keys (F012 — enable with ssh-keys feature)
age = { version = "0.10", optional = true }

# Foundation deps
foundation_core = { path = "../foundation_core", version = "0.0.3" }
foundation_db = { path = "../foundation_db", version = "0.0.1", default-features = false }
# Cross-platform HTTP client (`default_http_client`) for the icon proxy etc.
# `default-features = false`; the right backend comes from the target (multi on
# native via foundation_db/turso, wasm-fetch on wasm — see per-target sections).
foundation_netio = { path = "../foundation_netio", version = "0.0.1", default-features = false }
# `default-features = false` is required: foundation_auth's default `turso` feature is
# native-only and, via cargo's default-features union, would otherwise pull
# foundation_db/turso → foundation_db/multi → foundation_netio/multi into the wasm build
# and break compilation. Backend features are added per-target below (decision 03).
foundation_auth = { path = "../foundation_auth", version = "0.0.1", default-features = false }

# WASM — Cloudflare Workers
[target.'cfg(target_family = "wasm")'.dependencies]
foundation_db = { path = "../foundation_db", version = "0.0.1", default-features = false, features = ["wasm-bindgen-storage"] }
# `default-features = false` required: without it cargo's default-features union re-enables
# foundation_auth's native `turso` default (→ foundation_db/turso → multi) on wasm.
# `wasm-pbkdf2` brings the WebCrypto PBKDF2 path (js-sys/web-sys) the keychain uses for
# password hashing on Workers (decision 01 — all crypto via foundation_auth).
# NOTE: `wasm-bindgen-session` (foundation_auth D1CredentialStore) is added in the auth/login
# stage that actually uses it — the vault-CRUD stages talk to foundation_db's D1 directly.
foundation_auth = { path = "../foundation_auth", version = "0.0.1", default-features = false, features = ["wasm-pbkdf2"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", default-features = false, features = ["wasm-fetch"] }

# Native — Docker/VPS
[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_http = { path = "../foundation_http", version = "0.0.1" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.1" }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", default-features = false }
foundation_auth = { path = "../foundation_auth", version = "0.0.1", default-features = false, features = ["server", "turso"] }
# Native SQL backend (Turso/SQLite). wasm uses D1 via wasm-bindgen-storage (above).
foundation_db = { path = "../foundation_db", version = "0.0.1", default-features = false, features = ["turso"] }

[dev-dependencies]
tempfile = "3"
tracing-test = { workspace = true }
tracing-subscriber = { workspace = true }
# valtron multi-worker pool for #[valtron_test] async tests.
foundation_core = { path = "../foundation_core", version = "0.0.3", features = ["multi"] }

[features]
default = []
server-test = ["foundation_auth/server-test"]

[lints]
workspace = true
