[package]
name = "foundation_keychain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bitwarden-compatible vault + SSH key provisioning built on foundation_db and foundation_auth"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core
serde = { workspace = true }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rmpv = "1"
rmp-serde = "1"
tracing = { workspace = true }
thiserror = { workspace = true }

# SSH key generation (F012 — enable with ssh-keys feature)
ssh-key = { version = "0.6", features = ["ed25519", "rsa"], optional = true }
# At-rest encryption for stored private keys (F012 — enable with ssh-keys feature)
age = { version = "0.10", optional = true }

# Foundation deps
foundation_core = { path = "../foundation_core", version = "0.0.3" }
foundation_db = { path = "../foundation_db", version = "0.0.1", default-features = false }
foundation_auth = { path = "../foundation_auth", version = "0.0.1" }

# WASM — Cloudflare Workers
[target.'cfg(target_family = "wasm")'.dependencies]
foundation_db = { path = "../foundation_db", version = "0.0.1", default-features = false, features = ["wasm-bindgen-storage"] }
foundation_auth = { path = "../foundation_auth", version = "0.0.1", features = ["wasm-bindgen-session"] }

# Native — Docker/VPS
[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_http = { path = "../foundation_http", version = "0.0.1" }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", default-features = false }
foundation_auth = { path = "../foundation_auth", version = "0.0.1", features = ["server"] }

[dev-dependencies]
tempfile = "3"
tracing-test = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
server-test = ["foundation_auth/server-test"]

[lints]
workspace = true
