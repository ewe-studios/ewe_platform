[package]
name = "foundation_wasmtime"
version = "0.3.0"
edition = "2021"
# The injected `Ctx` bundle comes from foundation_core, whose minimum is the
# workspace's. Declare the same minimum so the manifest tells the truth.
rust-version = "1.87"
description = "Wasmtime shell — run WASM modules in-process alongside the Tauri shell (Surface 3)"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
wasmtime = { version = "26", default-features = false, features = ["cranelift", "runtime"] }
# Preview 1 (WASIp1) imports, so a guest built with `std` can instantiate.
# The `preview1` feature is the crate's default; it is the only feature we
# need, and it shares wasmtime 26.0.1 with this crate.
wasmtime-wasi = { version = "26", default-features = false, features = ["preview1"] }
# The RNG trait that `WasiCtxBuilder::secure_random` takes. wasmtime-wasi
# re-exports the trait but not its `Error` type, so name the trait's own crate.
# Both resolve to the same `cap-rand` version as wasmtime-wasi.
cap-rand = "3.4"
# The injected side-effect bundle (clock and RNG). The guest's WASI clock and
# randomness come from this `Ctx`, never from the host globals (spec 70 rule 11).
foundation_core = { path = "../foundation_core", version = "0.0.19" }
# The RNG type that `Ctx::rng` hands out. `InjectedRng` adapts it to the
# `cap_rand::RngCore` trait that the WASI context takes.
foundation_compact = { path = "../foundation_compact", version = "0.2.4" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3" }
derive_more = { version = "2", features = ["display", "error", "from"] }
tracing = "0.1"

[dev-dependencies]
# Assemble test modules from WebAssembly text (WAT) in the test files.
wat = "1.207"
# `SimulatedClock` fixes the wall and monotonic time, so a test can prove that
# the guest reads the injected clock and not the host clock.
foundation_core = { path = "../foundation_core", version = "0.0.19", features = ["test-clock"] }

[lints]
workspace = true
