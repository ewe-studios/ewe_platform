[package]
name = "foundation_wasmtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Wasmtime shell — run WASM modules in-process alongside the Tauri shell (Surface 3)"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
wasmtime = { version = "26", default-features = false, features = ["cranelift", "runtime"] }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3" }
derive_more = { version = "2", features = ["display", "error", "from"] }
tracing = "0.1"

[dev-dependencies]
# Assemble test modules from WebAssembly text (WAT) in the test files.
wat = "1.207"

[lints]
workspace = true
