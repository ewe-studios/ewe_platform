[package]
name = "foundation_http"
version = "0.0.16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Connection-owned, worker-pooled HTTP serving framework built on foundation_core"
keywords = ["http", "server", "foundation", "sync"]

[dependencies]
foundation_macros = { workspace = true }
foundation_core = { path = "../foundation_core", version = "0.0.23" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
# The instant type the injected clock returns. On every native target this is
# `std::time::Instant`; on JS wasm it is the host-clock instant, so a rate-limit
# window compiles and runs on both.
foundation_compact = { path = "../foundation_compact", version = "0.2.7", default-features = false }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
# `Ctx::rng` names the concrete `ChaCha8Rng`.
rand_chacha = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

regex = { version = "1.12" }
bytes = { version = "1.5" }
base64 = "0.22"
tracing = "0.1"
async-trait = "0.1"
# The valtron waker→readiness bridge (`queue_waker`/`QueueReadiness`) names
# `ConcurrentQueue` directly, so the async `Serve` continuation parks on it.
concurrent-queue = { workspace = true }

# The I/O gate: ServerIo + the completion-mode accept path (Feature 48). Native
# only — there is no reactor on wasm. iogate brings foundation_nativeapis in
# transitively, above netio, so no dependency cycle forms.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The defaults are off: the `netio-defaults` feature (in this crate's default
# set) restores them. A consumer that must not link a C TLS library, such as
# the static musl slave, uses `default-features = false, features =
# ["netio-core"]` and keeps the HTTP/1.1 server without TLS.
foundation_iogate = { path = "../foundation_iogate", version = "0.0.7", default-features = false }
# netio is target-gated so wasm never pulls its `multi` feature (native =
# `netio-core` or `netio-defaults`, wasm = the crate's `wasm-fetch` feature) —
# mirroring foundation_auth/foundation_ai.
foundation_netio = { path = "../foundation_netio", version = "0.0.19", default-features = false }

# On wasm32 the crate uses netio's fetch client only when the `wasm-fetch`
# feature is on. The feature is part of `wasm-bindgen-http`, so every current
# build keeps the client. A second test package (integration/wasm_owned) turns
# it off to build a module with no wasm-bindgen glue (spec 88 feature 02, T6).
# Identifiers come from `foundation_compact::uuid`, whose entropy backend the
# target selects, so the crate needs no `uuid` randomness feature of its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
foundation_netio = { path = "../foundation_netio", version = "0.0.19", default-features = false }

# Wasm-bindgen bridge dependencies (optional)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ResponseInit",
    "Url",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
], optional = true }
foundation_db = { path = "../foundation_db", version = "0.0.11", optional = true, features = ["wasm", "wasm-bindgen-storage"], default-features = false }

[dev-dependencies]
# `test-clock` provides `SimulatedClock`, so a test can prove that a server
# timeout follows the injected clock.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["multi", "test-clock"] }
foundation_wireguard = { path = "../foundation_wireguard" }
foundation_testing = { path = "../foundation_testing" }
# Reactor for the RawStream→RegisteredFd seam integration test (Decision 12 §12).
foundation_nativeapis = { path = "../foundation_nativeapis", features = ["fd"] }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
serial_test = { version = "3" }
ntest = { version = "0.9" }
async-trait = "0.1"
# `getrusage` for the parking CPU regression tests (utime+stime).
libc = "0.2"
# SHA-256 of the received body in the static file byte-exact test.
sha2 = { workspace = true }
# mTLS peer-info test: generate a CA, a server certificate and a client
# certificate, then drive a real rustls handshake.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# The default set keeps the behaviour of the crate before the split: every
# feature of `foundation_netio` that its own defaults gave this crate.
default = ["netio-defaults"]
multi = ["foundation_core/multi"]
# The HTTP server and client surface of `foundation_netio` without TLS. A
# consumer that must not link a C TLS library, such as the static musl slave,
# enables this feature alone.
netio-core = [
    "foundation_netio/standard",
    "foundation_netio/std",
    "foundation_netio/wire-native",
    "foundation_netio/multi",
    "foundation_netio/compression",
    "foundation_iogate/netio-core",
]
# The full `foundation_netio` default set, with the TLS providers.
netio-defaults = ["netio-core", "foundation_netio/ssl", "foundation_iogate/netio-defaults"]
# TLS backends — uses foundation_netio's SSL feature set.
# `ssl` is the recommended default (rustls + ring).
ssl = ["foundation_netio/ssl-rustls-ring"]
ssl-rustls = ["foundation_netio/ssl-rustls"]
ssl-rustls-ring = ["foundation_netio/ssl-rustls-ring"]
ssl-rustls-awsrc = ["foundation_netio/ssl-rustls-awsrc"]
ssl-openssl = ["foundation_netio/ssl-openssl"]
ssl-native-tls = ["foundation_netio/ssl-native-tls"]
# HTTP/3 (QUIC) — gates H3Serve trait and ServerApp::Http3 (F35)
quic = ["foundation_netio/quic"]
# Kept for consumers that name it (foundation_connectrpc). The crate itself is
# target-agnostic: identifiers come from foundation_compact's entropy source and
# every native-only module sits behind a target gate, not behind this feature.
wasm = []
# Wasm-bindgen bridge entry points for web and Cloudflare Workers
wasm-bindgen-http = [
    "wasm",
    "wasm-fetch",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:foundation_db",
]
# Netio's outbound fetch client on wasm32. It brings wasm-bindgen glue, so the
# owned-harness package (integration/wasm_owned) leaves it off and runs the
# pure-Rust types only. `wasm-bindgen-http` keeps it on (spec 88 feature 02).
wasm-fetch = ["foundation_netio/wasm-fetch"]
# Exposes wasm module types (WasmResponse, WasmStream, run_middleware) for native testing.
# Does NOT pull in wasm-bindgen/web-sys — only pure-Rust types are available.
wasm-test = []

[lints]
workspace = true

# HTTP/3 server integration test (F19) — real QUIC over loopback, quic-gated.
[[test]]
name = "http3_server_tests"
path = "tests/http3_server_tests.rs"
required-features = ["quic"]
