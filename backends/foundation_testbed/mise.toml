# foundation_testbed — self-contained dev environment
# Works standalone: `cd backends/foundation_testbed && mise run doctor`

[env]
PROJECT_ROOT = "{{config_root}}"

[tools]
# QEMU provider (Linux)
"mise:qemu" = { version = "latest", os = "linux" }

[tasks.check]
description = "Check testbed prerequisites"
run = """
#!/usr/bin/env bash
if [[ "$(uname)" == "Linux" ]]; then
    which qemu-system-x86_64 || { echo "QEMU not installed"; exit 1; }
    test -e /dev/kvm || echo "Warning: /dev/kvm not available (no KVM acceleration)"
elif [[ "$(uname)" == "Darwin" ]]; then
    test -d /Applications/UTM.app || { echo "UTM not installed"; exit 1; }
fi
echo "✓ Testbed prerequisites satisfied"
"""

[tasks.doctor]
description = "Run foundation_testbed health check"
run = "cargo run --release --features cli -- doctor"

[tasks.start]
description = "Start a VM"
run = """
#!/usr/bin/env bash
PROFILE="${1:-linux-build}"
cargo run --release -- start "$PROFILE"
"""

[tasks.stop]
description = "Stop a VM"
run = """
#!/usr/bin/env bash
PROFILE="${1:-linux-build}"
cargo run --release -- stop "$PROFILE"
"""

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.check-rust]
description = "Run cargo check"
run = "cargo check"

[tasks.clippy]
description = "Run clippy"
run = "cargo clippy -- -D warnings"
