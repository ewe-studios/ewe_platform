[package]
name = "foundation_gcp_kms"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Google Cloud KMS over gRPC — the generated Cloud KMS messages and an envelope-encryption backend"
keywords.workspace = true

[dependencies]
# The `KmsBackend` trait, the key-store error and the secret reference.
# The `secret` feature brings the key store, which holds `KmsBackend`.
foundation_auth = { path = "../foundation_auth", version = "0.0.17", default-features = false, features = ["secret"] }
# The sealed plaintext type of the `KmsBackend` trait.
foundation_compact = { path = "../foundation_compact", version = "0.2.7" }
# The h2c transport and the protobuf codec of the client. The default features
# are off: the default set includes `auth`, which depends on `foundation_auth`;
# that dependency closes a cycle here, because this crate depends on
# `foundation_auth` (issue #1107).
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.19", default-features = false }
# The runtime of the generated messages, and the Google well-known types those
# messages name (for example `google.protobuf.Timestamp`).
buffa = { workspace = true }
buffa-types = { workspace = true }

[build-dependencies]
# Message generation from the vendored Cloud KMS protos. `buffa-build` runs
# `protoc` (`PROTOC` environment variable first, else `PATH`).
buffa-build = { workspace = true }

[dev-dependencies]
# A host context and an environment for the envelope sealer, and the test
# executor.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["test-clock"] }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
# The proto manifest test recomputes the sha256 of every vendored file.
sha2 = { workspace = true }

[lints]
workspace = true
