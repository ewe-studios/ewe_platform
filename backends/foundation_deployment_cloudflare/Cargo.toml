[build-dependencies.foundation_codegentools]
path = "../foundation_codegentools"
version = "0.1.1"

[dependencies]
base85rs = "0.1"
sha2 = "0.10"
urlencoding = "2.1"

[dependencies.chrono]
workspace = true

[dependencies.derive_more]
workspace = true

[dependencies.foundation_core]
path = "../foundation_core"
version = "0.0.4"

# foundation_deployment is only used by the REST API (generated code + client.rs)
# — not by the workers module. Gate to native to avoid pulling netio/multi on wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_deployment]
path = "../foundation_deployment"
version = "0.0.1"

[dependencies.foundation_errstacks]
path = "../foundation_errstacks"
version = "0.0.1"

[dependencies.foundation_macros]
path = "../foundation_macros"
version = "0.0.5"

[dependencies.foundation_netio]
default-features = false
path = "../foundation_netio"
version = "0.0.2"

# Native: SSL + multi for the REST API client.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_netio]
default-features = false
features = [
    "ssl",
    "multi",
]
path = "../foundation_netio"
version = "0.0.2"

# wasm32: wasm-fetch for the Workers runtime (no SSL/multi threads).
[target.'cfg(target_family = "wasm")'.dependencies.foundation_netio]
default-features = false
features = ["wasm-fetch"]
path = "../foundation_netio"
version = "0.0.2"

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tracing]
workspace = true

# Workers runtime support (wasm-only). worker-rs provides DurableObject,
# WebSocketPair, Env, and other Cloudflare Workers APIs. Gated behind the
# `workers` feature so crates that only use the REST API don't pull wasm deps.
[target.'cfg(target_family = "wasm")'.dependencies]
worker = { version = "0.8.3", features = ["d1"], optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"

