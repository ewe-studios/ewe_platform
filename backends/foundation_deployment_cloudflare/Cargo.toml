[build-dependencies.foundation_codegentools]
path = "../foundation_codegentools"
version = "0.1.3"

[dependencies]

# Native only: `dns_ops.rs` and `types.rs` (both `cfg(not(target_family = "wasm"))`).
[target.'cfg(not(target_family = "wasm"))'.dependencies.chrono]
workspace = true

# Native only: `types.rs` (`Display` derive). Unused on wasm32, where only the
# `workers` module builds.
[target.'cfg(not(target_family = "wasm"))'.dependencies.derive_more]
workspace = true

# Native only: used by `dns_ops.rs` and `types.rs`.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_core]
path = "../foundation_core"
version = "0.0.8"

# foundation_deployment is only used by the REST API (generated code + client.rs)
# — not by the workers module. Gate to native to avoid pulling netio/multi on wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_deployment]
path = "../foundation_deployment"
version = "0.0.3"

# Native only: nothing on wasm32 uses it.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_macros]
path = "../foundation_macros"
version = "0.0.8"

# Native only: `types.rs` (errstacks) and the REST API client `client.rs` and
# `dns_ops.rs` (netio) sit behind `cfg(not(target_family = "wasm"))`, so on wasm32
# these would be unused. The wasm-fetch entry for netio is dropped: nothing on
# wasm32 uses it.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_errstacks]
path = "../foundation_errstacks"
version = "0.0.3"

# Native: SSL + multi for the REST API client.
[target.'cfg(not(target_family = "wasm"))'.dependencies.foundation_netio]
default-features = false
features = [
    "ssl",
    "multi",
]
path = "../foundation_netio"
version = "0.0.6"

# Native: `types.rs` and `dns_ops.rs`. The wasm32 entries (optional, enabled by the
# `workers` feature) are in the wasm table below.
[target.'cfg(not(target_family = "wasm"))'.dependencies.serde]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.serde_json]
workspace = true

# Native only: nothing on wasm32 uses it.
[target.'cfg(not(target_family = "wasm"))'.dependencies.tracing]
workspace = true

