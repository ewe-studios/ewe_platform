[package]
name = "foundation_cronjobs"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cron job scheduling with valtron executor and foundation_db persistence"
keywords.workspace = true

[dependencies]
foundation_db = { path = "../foundation_db", version = "0.0.6" }
foundation_core = { path = "../foundation_core", version = "0.0.19" }
foundation_compact = { path = "../foundation_compact", version = "0.2.4" }
async-trait = "0.1"
futures-lite = "2"
chrono = "0.4"
saffron = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `test-clock` provides `SimulatedClock`, so a test proves that a cron run
# time follows the injected wall clock.
foundation_core = { path = "../foundation_core", version = "0.0.19", features = ["test-clock"] }

[lints]
workspace = true
