[package]
name = "foundation_connectrpc"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ConnectRPC for the EWE platform — Connect/gRPC/gRPC-Web on foundation crates"
keywords = ["connectrpc", "grpc", "rpc", "foundation"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.6" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.3", features = ["to_structured"] }
foundation_macros = { path = "../foundation_macros", version = "0.0.6" }
tracing = "0.1"
foundation_arrow = { path = "../foundation_arrow", version = "0.0.3", optional = true }
foundation_auth = { path = "../foundation_auth", version = "0.0.4", optional = true, default-features = false }
buffa = { version = "0.8.1", features = ["json"] }
bytes = "1.5"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
concurrent-queue = "2.5"
flate2 = "1.0"
zstd = { version = "0.13", optional = true }
brotli = { version = "8", optional = true }

# foundation_netio / foundation_http are target-gated: native needs the
# multi-threaded executor (`multi`) + TLS/compression/wire modules (their
# defaults, used by H2/H3 + native serving); wasm needs only `wasm-fetch`
# (browser/Workers fetch) and `wasm` — mirroring foundation_auth/foundation_ai.
# `multi` on wasm leaks `+ Send` valtron into netio's single-threaded `!Send`
# wasm code (its `ExchangeContinuation` drops the `+ Send` bound there), which
# no longer type-checks.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_netio = { path = "../foundation_netio", version = "0.0.4" }
foundation_http = { path = "../foundation_http", version = "0.0.3" }

[target.'cfg(target_family = "wasm")'.dependencies]
foundation_netio = { path = "../foundation_netio", version = "0.0.4", default-features = false, features = ["wasm-fetch"] }
foundation_http = { path = "../foundation_http", version = "0.0.3", default-features = false, features = ["wasm"] }
foundation_auth = { path = "../foundation_auth", version = "0.0.4", optional = true, default-features = false, features = ["wasm"] }

[target.'cfg(unix)'.dependencies]
# `poll(2)` for the HTTP/1.1 server's connection driver (`native::conn_io`).
libc = "0.2"

[dev-dependencies]
foundation_wireguard = { path = "../foundation_wireguard" }
foundation_errstacks = { path = "../foundation_errstacks", features = ["to_structured"] }
serde_json = { workspace = true }
serde = { workspace = true }
buffa = { version = "0.8.1", features = ["json"] }
bytes = "1.5"
foundation_arrow = { path = "../foundation_arrow" }
futures-lite = "2"

[features]
default = ["rpc_multi"]
# `rpc` is the full single-threaded library surface: every codec, auth, and all
# compressors. Consumers pick `rpc` (single-threaded) or `rpc_multi` (adds the
# multi-threaded valtron executor); `default-features = false` + `rpc` keeps a
# lean build. The individual flags below stay addressable for fine-grained use.
rpc = ["arrow", "auth", "zstd", "brotli"]
rpc_multi = ["rpc", "foundation_core/multi"]

# Arrow columnar codec (platform extension) — pulls foundation_arrow.
arrow = ["dep:foundation_arrow"]
# Additional compressors (gzip is always available via flate2).
zstd = ["dep:zstd"]
brotli = ["dep:brotli"]
# Auth module — requires foundation_auth.
auth = ["dep:foundation_auth"]

# HTTP/3 over QUIC (F35). Pulls quinn-proto through netio's `quic` feature.
h3 = ["foundation_netio/quic", "foundation_http/quic"]

# Tests that use the valtron pool need the multi-threaded executor (`rpc_multi`).
# HTTP/3 transport capabilities (F35).
[[test]]
name = "h3_capability_tests"
required-features = ["rpc_multi", "h3"]

[[test]]
name = "h3_conformance_tests"
required-features = ["rpc_multi", "h3"]

[[test]]
name = "h3_streaming_tests"
required-features = ["rpc_multi", "h3"]

[[test]]
name = "server_socket_tests"
required-features = ["rpc_multi"]

[[test]]
name = "router_dispatch_tests"
required-features = ["rpc_multi"]

[[test]]
name = "connect_protocol_tests"
required-features = ["rpc_multi"]

[[test]]
name = "grpc_web_tests"
required-features = ["rpc_multi"]

[[test]]
name = "conformance_tests"
required-features = ["rpc_multi"]

[[test]]
name = "auth_tests"
required-features = ["rpc_multi"]

[[test]]
name = "h2_streaming_tests"
required-features = ["rpc_multi"]

[[test]]
name = "grpc_tests"
required-features = ["rpc_multi"]

[[test]]
name = "cancellation_tests"
required-features = ["rpc_multi"]

[lints]
workspace = true
