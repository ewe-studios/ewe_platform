[package]
name = "foundation_nostd"
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundational nostd core implementation for the ewe_platform project"
keywords = ["foundation_nostd"]

[features]
default = []
std = []
js-event-loop = []
trace = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
serial_test = { workspace = true }
tracing = { version = "0.1", default-features = false }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
tracing-subscriber = "0.3"
ntest = { workspace = true }
foundation_testing = { path = "../foundation_testing" }

# The benchmark tests drive `StressHarness` with the real clock.
# Do not add a `version` here. `foundation_core` depends on this crate, so a
# versioned dev-dependency makes a publish cycle: `cargo package` must find
# `foundation_core` on crates.io before it can publish. A path-only
# dev-dependency is removed from the published manifest.
[dev-dependencies.foundation_core]
path = "../foundation_core"

[dev-dependencies.foundation_context]
path = "../foundation_context"
