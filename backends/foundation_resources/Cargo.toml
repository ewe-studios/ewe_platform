[package]
name = "foundation_resources"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stage application resources and read them through the host context"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
browser-bindings = ["runtime", "foundation_context/wasm-bindgen"]
default = ["runtime"]
build = ["dep:serde", "dep:toml", "dep:tempfile", "dep:rustix"]
runtime = ["dep:foundation_context", "dep:futures-util", "dep:blocking", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
foundation_context = { path = "../foundation_context", version = "0.0.4", optional = true }
derive_more.workspace = true

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
blocking = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = ["Window", "Url", "ReadableStream", "ReadableStreamDefaultReader", "Response", "console"] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
futures-lite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
