[features]
# Default: full platform-native stack.
default = ["native", "signal"]

# I/O readiness layer — extracted from mio
poll = []

# Cross-platform signal handling (SIGINT, SIGTERM, SIGHUP, SIGQUIT)
signal = ["poll"]

# Unix-only signal support (SIGHUP, SIGQUIT)
signal-unix = ["signal"]

# File descriptor readiness tracking (like tokio's AsyncFd)
fd = ["poll"]

# File watching layer (PollWatcher always available via shared)
watcher-linux = ["poll"]
watcher-macos = ["poll"]
watcher-windows = ["poll"]

# io_uring layer (Linux only)
uring = ["dep:io-uring"]

# Interprocess message bus (adapted from ipmb)
ipc = ["dep:bincode", "dep:foundation_macros", "dep:serde_bytes", "dep:uuid", "dep:once_cell"]

# Virtual filesystem abstraction — core traits + in-memory impls + overlay
vfs = []

# VFS search — grep/find over any VfsFileSystem with CLI fallback cascade
vfs-search = ["vfs", "dep:regex"]
vfs-search-fff = ["vfs-search", "dep:fff-search"]

# VFS native filesystem passthrough + directory delta
vfs-native = ["vfs", "dep:foundation_macros", "dep:foundation_nostd"]

# VFS SQLite-backed DeltaStore (libsql)
vfs-sqlite = ["vfs", "dep:libsql", "dep:blake3"]

# VFS Turso cloud-backed DeltaStore (remote connection, WASM-compatible)
vfs-turso = ["vfs", "dep:turso", "dep:blake3"]

# Cloudflare D1 edge SQLite DeltaStore — uses foundation_db's D1 HTTP client
vfs-d1 = ["vfs", "dep:foundation_db", "dep:serde_json", "foundation_db/d1"]

# Cloudflare R2 S3-compatible DeltaStore — uses foundation_db's R2 HTTP client
vfs-r2 = ["vfs", "dep:foundation_db", "dep:serde_json", "foundation_db/r2"]

# Arrow serialization for VFS types
vfs-arrow = ["vfs", "dep:foundation_arrow"]

# VFS IPC daemon/client over the message bus
vfs-ipc = ["vfs", "ipc", "dep:foundation_macros"]

# Ptrace syscall interception (Linux only, nix raw ptrace backend)
vfs-ptrace-nix = ["vfs-native", "dep:nix"]
vfs-ptrace = ["vfs-ptrace-nix"]

# FUSE mount adapter (Linux only)
vfs-fuse = ["vfs-native", "dep:fuser"]
vfs-fjall = ["vfs", "dep:fjall", "dep:hex", "dep:foundation_db", "dep:serde_json", "dep:foundation_compact"]
vfs-nfs = ["vfs", "dep:nfsserve"]
# Fjall LSM-tree + cacache CAS VFS backend

# LD_PRELOAD VFS shim — produces a .so that intercepts libc calls
vfs-preload = ["vfs-native", "dep:once_cell"]

# WireGuard overlay data plane (spec-55, feature 00).
# `netstack` = smoltcp userspace TCP/IP stack (cross-target, default data plane).
netstack = ["dep:smoltcp"]
# `tun` = kernel TUN device data plane (native-only, privileged). Implies `netstack`
# because the `DataPlane` trait and overlay socket handle types live with the netstack.
tun = ["netstack", "poll", "fd"]

# Full feature set for current platform
native = ["poll", "fd"]
native-linux = ["native", "watcher-linux", "uring"]
native-macos = ["native", "watcher-macos"]
native-windows = ["native", "watcher-windows"]

[lints]
workspace = true

[[test]]
name = "vfs_search"
