[package]
name = "foundation_nativeapis"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform native APIs: I/O readiness polling, io_uring, file watching, and interprocess messaging"
keywords = ["io-uring", "epoll", "kqueue", "iocp", "file-watcher", "ipc"]

[dependencies]
io-uring = { version = "0.7", optional = true }
concurrent-queue = { workspace = true }
serde = { workspace = true }
serde_bytes = { version = "0.11", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
foundation_macros = { workspace = true, optional = true }
once_cell = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
foundation_core = { workspace = true }
foundation_nostd = { workspace = true, optional = true }
foundation_errstacks = { workspace = true }
derive_more = { workspace = true }
libsql = { version = "0.9", optional = true }
turso = { version = "0.5.3", optional = true }
scru128 = { version = "4", optional = true }
blake3 = { version = "1", optional = true }
async-trait = "0.1"
foundation_arrow = { workspace = true, optional = true }

# Unix-only: libc for epoll/kqueue/eventfd syscalls
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Security",
]}

# Enable multi-threaded executor only on supported platforms.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
foundation_core = { workspace = true, features = ["multi"] }

[dev-dependencies]
foundation_arrow = { workspace = true }
foundation_macros = { workspace = true }
tracing-test.workspace = true
tracing-subscriber.workspace = true
serial_test = "3.3"
ntest = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "poll"] }

# Test targets (directory-based test groups)
[[test]]
name = "valtron_vfs"
path = "tests/valtron_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "memory_vfs"
path = "tests/memory_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "overlay_vfs"
path = "tests/overlay_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "arrow_vfs"
path = "tests/arrow_vfs/mod.rs"
required-features = ["vfs-arrow"]

[[test]]
name = "native_vfs"
path = "tests/native_vfs/mod.rs"
required-features = ["vfs-native"]

[[test]]
name = "dir_delta_vfs"
path = "tests/dir_delta_vfs/mod.rs"
required-features = ["vfs-native"]

[[test]]
name = "observable_vfs"
path = "tests/observable_vfs/mod.rs"
required-features = ["vfs"]

[features]
# Default: full platform-native stack.
default = ["native"]

# I/O readiness layer — extracted from mio
poll = []

# File descriptor readiness tracking (like tokio's AsyncFd)
fd = ["poll"]

# File watching layer (PollWatcher always available via shared)
watcher-linux = ["poll"]
watcher-macos = ["poll"]
watcher-windows = ["poll"]

# io_uring layer (Linux only)
uring = ["dep:io-uring"]

# Interprocess message bus (adapted from ipmb)
ipc = ["dep:bincode", "dep:foundation_macros", "dep:serde_bytes", "dep:uuid", "dep:once_cell"]

# Virtual filesystem abstraction — core traits + in-memory impls + overlay
vfs = []

# VFS native filesystem passthrough + directory delta
vfs-native = ["vfs", "dep:foundation_macros", "dep:foundation_nostd"]

# VFS SQLite-backed DeltaStore (libsql)
vfs-sqlite = ["vfs", "dep:libsql", "dep:scru128", "dep:blake3"]

# VFS Turso cloud-backed DeltaStore (remote connection, WASM-compatible)
vfs-turso = ["vfs", "dep:turso", "dep:scru128", "dep:blake3"]

# Arrow serialization for VFS types
vfs-arrow = ["vfs", "dep:foundation_arrow"]

# Full feature set for current platform
native = ["poll", "fd"]
native-linux = ["native", "watcher-linux", "uring"]
native-macos = ["native", "watcher-macos"]
native-windows = ["native", "watcher-windows"]

[lints]
workspace = true
