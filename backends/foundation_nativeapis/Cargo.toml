[package]
name = "foundation_nativeapis"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform native APIs: I/O readiness polling, io_uring, file watching, and interprocess messaging"
keywords = ["io-uring", "epoll", "kqueue", "iocp", "file-watcher", "ipc"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
io-uring = { version = "0.7", optional = true }
concurrent-queue = { workspace = true }
serde = { workspace = true }
serde_bytes = { version = "0.11", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
foundation_macros = { workspace = true, optional = true }
once_cell = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
foundation_core = { workspace = true }
foundation_nostd = { workspace = true, optional = true }
foundation_errstacks = { workspace = true }
derive_more = { workspace = true }
foundation_db = { workspace = true, optional = true }
foundation_netio = { workspace = true, optional = true }
libsql = { version = "0.9", optional = true }
turso = { version = "0.5.3", optional = true }
scru128 = { version = "4", optional = true }
blake3 = { version = "1", optional = true }
async-trait = "0.1"
foundation_arrow = { workspace = true, optional = true }

# Unix-only: libc for epoll/kqueue/eventfd syscalls
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# FUSE adapter (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, optional = true }
nix = { version = "0.29", optional = true, features = ["ptrace", "process", "signal", "fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Security",
]}

# Enable multi-threaded executor only on supported platforms.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
foundation_core = { workspace = true, features = ["multi"] }

[dev-dependencies]
foundation_arrow = { workspace = true }
foundation_macros = { workspace = true }
tracing-test.workspace = true
tracing-subscriber.workspace = true
serial_test = "3.3"
ntest = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "poll"] }
tempfile = "3"

# Test targets (directory-based test groups)
[[test]]
name = "valtron_vfs"
path = "tests/valtron_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "memory_vfs"
path = "tests/memory_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "overlay_vfs"
path = "tests/overlay_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "arrow_vfs"
path = "tests/arrow_vfs/mod.rs"
required-features = ["vfs-arrow"]

[[test]]
name = "native_vfs"
path = "tests/native_vfs/mod.rs"
required-features = ["vfs-native"]

[[test]]
name = "dir_delta_vfs"
path = "tests/dir_delta_vfs/mod.rs"
required-features = ["vfs-native"]

[[test]]
name = "observable_vfs"
path = "tests/observable_vfs/mod.rs"
required-features = ["vfs"]

[[test]]
name = "fuse_vfs"
path = "tests/fuse_vfs/mod.rs"
required-features = ["vfs-fuse"]

[[test]]
name = "ipc_vfs"
path = "tests/ipc_vfs/mod.rs"
required-features = ["vfs-ipc", "vfs-native"]

[[test]]
name = "ptrace_vfs"
path = "tests/ptrace_vfs/mod.rs"
required-features = ["vfs-ptrace-nix", "vfs-native"]

# Examples (directory-based)
[[example]]
name = "memory_fs"
path = "examples/memory_fs/main.rs"
required-features = ["vfs"]

[[example]]
name = "native_fs"
path = "examples/native_fs/main.rs"
required-features = ["vfs-native"]

[[example]]
name = "overlay_fs"
path = "examples/overlay_fs/main.rs"
required-features = ["vfs"]

[[example]]
name = "observable_fs"
path = "examples/observable_fs/main.rs"
required-features = ["vfs"]

[[example]]
name = "sqlite_delta"
path = "examples/sqlite_delta/main.rs"
required-features = ["vfs-sqlite"]

[[example]]
name = "scaffold_macro"
path = "examples/scaffold_macro/main.rs"
required-features = ["vfs-native"]

[[example]]
name = "inode_native"
path = "examples/inode_native/main.rs"
required-features = ["vfs"]

[[example]]
name = "sync_async_bridge"
path = "examples/sync_async_bridge/main.rs"
required-features = ["vfs"]

[[example]]
name = "fd_readiness"
path = "examples/fd_readiness/main.rs"
required-features = ["fd"]

[[example]]
name = "file_watcher"
path = "examples/file_watcher/main.rs"
required-features = ["watcher-linux"]

[[example]]
name = "ipc_bench"
path = "examples/ipc_bus/main_bench.rs"
required-features = ["vfs"]

[[example]]
name = "ipc_latency"
path = "examples/ipc_bus/main_latency.rs"
required-features = ["vfs"]

[[example]]
name = "ipc_multiple_type"
path = "examples/ipc_bus/main_multiple_type.rs"
required-features = ["vfs"]

[[example]]
name = "ipc_region_free"
path = "examples/ipc_bus/main_regionfree.rs"
required-features = ["vfs"]

[[example]]
name = "ipc_rejoin"
path = "examples/ipc_bus/main_rejoin.rs"
required-features = ["vfs"]

[[example]]
name = "ipc_triangle"
path = "examples/ipc_bus/main_triangle.rs"
required-features = ["vfs"]

[[example]]
name = "arrow_serialization"
path = "examples/arrow_serialization/main.rs"
required-features = ["vfs-arrow"]

[[example]]
name = "fuse_mount"
path = "examples/fuse_mount/main.rs"
required-features = ["vfs-fuse"]

[[example]]
name = "vfs_shim"
path = "examples/vfs_shim/main.rs"
required-features = ["vfs-preload"]

[[example]]
name = "vfs_sqlite_delta"
path = "examples/vfs_sqlite_delta/main.rs"
required-features = ["vfs-sqlite"]

[[example]]
name = "vfs_turso_delta"
path = "examples/vfs_turso_delta/main.rs"
required-features = ["vfs-turso"]

[features]
# Default: full platform-native stack.
default = ["native"]

# I/O readiness layer — extracted from mio
poll = []

# File descriptor readiness tracking (like tokio's AsyncFd)
fd = ["poll"]

# File watching layer (PollWatcher always available via shared)
watcher-linux = ["poll"]
watcher-macos = ["poll"]
watcher-windows = ["poll"]

# io_uring layer (Linux only)
uring = ["dep:io-uring"]

# Interprocess message bus (adapted from ipmb)
ipc = ["dep:bincode", "dep:foundation_macros", "dep:serde_bytes", "dep:uuid", "dep:once_cell"]

# Virtual filesystem abstraction — core traits + in-memory impls + overlay
vfs = []

# VFS native filesystem passthrough + directory delta
vfs-native = ["vfs", "dep:foundation_macros", "dep:foundation_nostd"]

# VFS SQLite-backed DeltaStore (libsql)
vfs-sqlite = ["vfs", "dep:libsql", "dep:scru128", "dep:blake3"]

# VFS Turso cloud-backed DeltaStore (remote connection, WASM-compatible)
vfs-turso = ["vfs", "dep:turso", "dep:scru128", "dep:blake3"]

# Cloudflare D1 edge SQLite DeltaStore — uses foundation_db's D1 HTTP client
vfs-d1 = ["vfs", "dep:foundation_db"]

# Cloudflare R2 S3-compatible DeltaStore — uses foundation_db's R2 HTTP client
vfs-r2 = ["vfs", "dep:foundation_db"]

# Arrow serialization for VFS types
vfs-arrow = ["vfs", "dep:foundation_arrow"]

# VFS IPC daemon/client over the message bus
vfs-ipc = ["vfs", "ipc", "dep:foundation_macros"]

# Ptrace syscall interception (Linux only, nix raw ptrace backend)
vfs-ptrace-nix = ["vfs-native", "dep:nix"]
vfs-ptrace = ["vfs-ptrace-nix"]

# FUSE mount adapter (Linux only)
vfs-fuse = ["vfs-native", "dep:fuser"]

# LD_PRELOAD VFS shim — produces a .so that intercepts libc calls
vfs-preload = ["vfs-native", "dep:once_cell"]

# Full feature set for current platform
native = ["poll", "fd"]
native-linux = ["native", "watcher-linux", "uring"]
native-macos = ["native", "watcher-macos"]
native-windows = ["native", "watcher-windows"]

[lints]
workspace = true
