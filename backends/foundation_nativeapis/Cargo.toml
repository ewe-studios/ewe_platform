[package]
name = "foundation_nativeapis"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform native APIs: I/O readiness polling, io_uring, file watching, and interprocess messaging"
keywords = ["io-uring", "epoll", "kqueue", "file-watcher", "ipc"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.4" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.5", optional = true }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.2" }
foundation_compact = { path = "../foundation_compact", version = "0.2.1", optional = true }
foundation_db = { path = "../foundation_db", version = "0.0.2", optional = true, default-features = false }
foundation_arrow = { path = "../foundation_arrow", version = "0.0.2", optional = true }

io-uring = { version = "0.7", optional = true }
concurrent-queue = { workspace = true }
serde = { workspace = true }
serde_bytes = { version = "0.11", optional = true }
foundation_macros = { path = "../foundation_macros", version = "0.0.5", optional = true }
cfg-if = "1"
once_cell = { version = "1", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
serde_json = { version = "1", optional = true }
libsql = { version = "0.9", optional = true }
turso = { version = "0.5.3", optional = true }
fjall = { version = "2", optional = true }
nfsserve = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
blake3 = { version = "1", optional = true }
async-trait = "0.1"
regex = { version = "1.10", optional = true }
fff-search = { version = "0.9.3", optional = true }

# Userspace TCP/IP netstack for the WireGuard overlay data plane (spec-55, feature 00).
# no_std / alloc only — the "phy" is us (the Tunn plaintext side), so no std/phy-* features.
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "alloc",
], optional = true }

# Unix-only: libc for epoll/kqueue/eventfd syscalls
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# FUSE adapter (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, optional = true }
nix = { version = "0.29", optional = true, features = ["ptrace", "process", "signal", "fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Security",
]}

# Enable multi-threaded executor only on supported platforms.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.4", features = ["multi"] }

[dev-dependencies]
foundation_arrow = { path = "../foundation_arrow", version = "0.0.2" }
foundation_macros = { path = "../foundation_macros", version = "0.0.5" }
tracing-test.workspace = true
tracing-subscriber.workspace = true
serial_test = "3.3"
ntest = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "poll"] }
tempfile = "3"

# Test targets (directory-based test groups)
