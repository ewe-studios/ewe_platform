[package]
name = "foundation_deployment_huggingface"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hugging Face Hub API client — model/dataset/space listing, repo management, and file upload/download using foundation_netio and valtron"
keywords.workspace = true

[dependencies]
base85rs = "0.1"
dirs = "5.0"
futures-lite = "2"
http = "1.4.0"
regex = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
urlencoding = "2.1"

derive_more = {workspace = true }
chrono = {workspace = true }
tracing = { workspace = true }
foundation_core = { path = "../foundation_core", version = "0.0.11" }
foundation_macros = { path = "../foundation_macros", version = "0.0.8" }
foundation_netio = { path = "../foundation_netio", version = "0.0.6" }

[dev-dependencies]
foundation_testing = { path = "../foundation_testing" }

[features]
default = ["multi"]
multi = ["foundation_core/multi", "foundation_netio/multi", "foundation_netio/ssl"]


[lints]
workspace = true
