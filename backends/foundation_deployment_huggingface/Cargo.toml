[package]
name = "foundation_deployment_huggingface"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hugging Face Hub API client — model/dataset/space listing, repo management, and file upload/download using foundation_netio and valtron"
keywords.workspace = true

[dependencies]
base85rs = "0.1"
dirs = "5.0"
http = "1.4.0"
regex = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
urlencoding = "2.1"
walkdir = "2.5"

derive_more = {workspace = true }
chrono = {workspace = true }
tracing = { workspace = true }
foundation_core = { path = "../foundation_core", version = "0.0.5" }
foundation_macros = { path = "../foundation_macros", version = "0.0.5" }
foundation_netio = { path = "../foundation_netio", version = "0.0.3" }

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[features]
default = ["multi"]
multi = ["foundation_core/multi", "foundation_netio/multi", "foundation_netio/ssl"]


[lints]
workspace = true
