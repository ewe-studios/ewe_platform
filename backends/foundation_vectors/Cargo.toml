[package]
name = "foundation_vectors"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Dense vector distance metrics, flat-scan top-k, and VectorStore trait. Pure Rust, WASM-safe."
keywords = ["vectors", "embeddings", "search", "ewe-platform"]

[dependencies]
serde = { workspace = true }
serde_json = { version = "1", optional = true }
libm = "0.2"
async-trait = "0.1"
petgraph = { version = "0.8", optional = true }
foundation_core = { path = "../foundation_core", version = "0.0.5", features = ["std"], optional = true }
foundation_netio = { path = "../foundation_netio", version = "0.0.2", optional = true }
foundation_db = { path = "../foundation_db", version = "0.0.2", optional = true }
foundation_compact = { path = "../foundation_compact", version = "0.2.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
# fjall (on-disk LSM) backs the persistent fjall-IVF VectorStore — native only.
fjall = { version = "2", optional = true }
libsql = { version = "0.6", optional = true }
pollster = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
async-trait = "0.1"
futures-lite = "2"
foundation_core = { path = "../foundation_core", version = "0.0.5", features = ["std", "multi"] }
foundation_db = { path = "../foundation_db", version = "0.0.2", features = ["turso", "libsql"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.2" }

[features]
code-graph = ["dep:petgraph", "dep:serde_json", "dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-python", "dep:tree-sitter-go"]
code-graph-query = ["dep:petgraph", "dep:serde_json"]
sql-store = ["dep:serde_json", "dep:foundation_db", "dep:foundation_core"]
turbopuffer = ["dep:serde_json", "dep:foundation_core", "dep:foundation_netio"]
# Persistent native VectorStore over fjall + a persisted F25 IVF index (F29).
fjall-store = ["dep:fjall", "dep:serde_json"]
# SQLite vec0 KNN via bundled sqlite-vec .so (F29). Native only.
sqlite-vec = ["dep:serde_json", "dep:foundation_compact", "dep:libsql", "dep:pollster", "dep:tempfile"]

[[test]]
name = "code_graph_tests"
path = "tests/code_graph_tests.rs"
required-features = ["code-graph"]

[[test]]
name = "lang_config_tests"
path = "tests/lang_config_tests.rs"
required-features = ["code-graph"]

[[test]]
name = "sql_vector_store_tests"
path = "tests/sql_vector_store_tests.rs"
required-features = ["sql-store"]

[[test]]
name = "turbopuffer_tests"
path = "tests/turbopuffer_tests.rs"
required-features = ["turbopuffer"]

[[test]]
name = "fjall_vector_store_tests"
path = "tests/fjall_vector_store_tests.rs"
required-features = ["fjall-store"]

[[test]]
name = "libsql_vector_store_tests"
path = "tests/libsql_vector_store_tests.rs"
required-features = ["sql-store"]

[lints]
workspace = true
[[test]]
name = "sqlite_vec_store_tests"
path = "tests/sqlite_vec_store_tests.rs"
required-features = ["sqlite-vec"]
