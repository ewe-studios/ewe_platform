[package]
name = "foundation_proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reverse proxy — SSL termination, zero-downtime deploys, health-check routing"

[dependencies]
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.1" }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", features = ["ssl", "multi"] }
foundation_db = { path = "../foundation_db", version = "0.0.1" }
foundation_deployment_cloudflare = { path = "../foundation_deployment_cloudflare", version = "0.1.0", optional = true }

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
derive_more.workspace = true
tracing.workspace = true
chrono.workspace = true

[features]
default = []
cloudflare = ["foundation_deployment_cloudflare"]

[lints]
workspace = true
