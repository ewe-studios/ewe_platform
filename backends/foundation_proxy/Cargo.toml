[package]
name = "foundation_proxy"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reverse proxy — SSL termination, zero-downtime deploys, health-check routing"

[dependencies]
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
foundation_core = { path = "../foundation_core", version = "0.0.22", features = ["multi"] }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_compact = { path = "../foundation_compact", version = "0.2.6" }
foundation_http = { path = "../foundation_http", version = "0.0.14", features = ["multi", "ssl"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.16", features = ["ssl", "multi"] }
foundation_iogate = { path = "../foundation_iogate", version = "0.0.5" }
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.15", features = ["fd"] }
foundation_db = { path = "../foundation_db", version = "0.0.9" }
foundation_macros = { path = "../foundation_macros", version = "0.0.23" }
# T3/T4: the proxy's H2 upstream leg reuses connectrpc's streaming H2 client
# (`H2Transport`) — the only H2 client in the tree with trailing-HEADERS support.
# `default-features = false` keeps it lean: we only need the transport seam.
# `rpc_multi` adds the server side (Router, ConnectRpcServe) and the threaded
# valtron executor that the registration listener runs on.
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.16", default-features = false, features = ["rpc_multi"] }
# Registration authority security parts (spec 81 / 87): signed enrollment
# secrets, the certificate authority, the trust store and the mutual-TLS (mTLS)
# verifier and configuration builders. Public API only; this crate adds no copy.
foundation_auth = { path = "../foundation_auth", version = "0.0.15" }
# Runtime for the buffa-generated registration messages (same version as the
# generated code the build script emits).
buffa = { version = "0.9.2", features = ["json"] }
# The generated service code names `futures::Stream`.
futures = "0.3"
# The registration address policy's Classless Inter-Domain Routing (CIDR) nets.
ipnet = { workspace = true }

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2 = "0.10"
base64 = "0.22"
bytes = "1"
# `flock` for the cross-process state lock (`File::try_lock` needs Rust 1.89;
# the workspace MSRV is 1.87).
libc = "0.2"
derive_more.workspace = true
tracing.workspace = true
chrono.workspace = true
# ACME (F15): ES256 JWS signing + account JWK (pure-Rust RustCrypto, already in
# the tree) and X.509 keypair/CSR generation. rcgen uses the `ring` backend
# (also already present via rustls/boringtun) so no new C crypto library.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
# Drive the ACME provisioning future to completion at startup (its client I/O
# and DNS wait are async, and block_on re-polls after each yield).
futures-lite = "2"
# Stream combinators (`StreamExt`) and `join` for the async H2 forward relays.
futures-util = { workspace = true }

[dev-dependencies]
# The clock injection test moves a `SimulatedClock`; `test-clock` exposes it.
foundation_core = { path = "../foundation_core", version = "0.0.22", features = ["test-clock"] }
foundation_deployment_platform = { path = "../foundation_deployment_platform" }
# The mock ACME CA in the F15 test parses the client CSR (DER) via rcgen, whose
# `from_der` takes a `CertificateSigningRequestDer` from rustls-pki-types.
rustls-pki-types = "1"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = "3"
# A private state directory per registration test (CA, signing key, trust DB).
tempfile = "3"
# The enrollment test names the client key that `generate_csr` returns.
zeroize = "1"

[build-dependencies]
# Message types from `proto/` (buffa-build, needs `protoc`) and ConnectRPC
# service stubs (foundation_connectrpc_codegen) — the pattern of
# `foundation_agent_rpc`. `buffa-build` must match the `buffa` runtime above.
buffa-build = "0.9.2"
foundation_connectrpc_codegen = { path = "../foundation_connectrpc_codegen", version = "0.0.5" }
prost = "0.12"
prost-types = "0.12"

[features]
default = []
# Kept as a name only: `SslConfig::cloudflare` and the `proxy!` macro do not need
# it. The proxy has no Cloudflare DNS-01 code (the ACME flow takes a caller-made
# DNS setter), so the feature pulls in no dependency.
cloudflare = []
docker-tests = []
# HTTP/3 (QUIC) proxy front end (F19): enables the H3 serving layer and handler.
quic = ["foundation_http/quic", "foundation_netio/quic"]

[[test]]
name = "proxy_integration_tests"
path = "tests/proxy_integration_tests.rs"
required-features = ["docker-tests"]

[lints]
workspace = true

# HTTP/3 proxy end-to-end test (F19) — real QUIC front end, quic-gated.
[[test]]
name = "h3_integration_tests"
path = "tests/h3_integration_tests.rs"
required-features = ["quic"]

# HTTP/3 streaming test (F70 E3) — real QUIC front end, quic-gated.
[[test]]
name = "h3_streaming_tests"
path = "tests/h3_streaming_tests.rs"
required-features = ["quic"]

# HTTP/3 request-body tests (F72 E1) — real QUIC front end, quic-gated.
[[test]]
name = "h3_request_body_tests"
path = "tests/h3_request_body_tests.rs"
required-features = ["quic"]

# Idle QUIC listener CPU test (F75 E2) — quic-gated.
[[test]]
name = "idle_quic_listener_tests"
path = "tests/idle_quic_listener_tests.rs"
required-features = ["quic"]

# Registration authority: register, replace, ownership, generations, rotation
# (spec 82 feature 00, T3-T6).
[[test]]
name = "registration_registry_tests"
path = "tests/registration_registry_tests.rs"

# Registration authority: one test for each registry-level failure row of
# spec 82 feature 00 section 7, with a simulated clock (T4, T6).
[[test]]
name = "registration_failure_tests"
path = "tests/registration_failure_tests.rs"

# Registration authority: enrollment, mutual TLS, renewal, revocation and the
# Unix socket permission check (T7-T9).
[[test]]
name = "registration_auth_tests"
path = "tests/registration_auth_tests.rs"

# Registration authority: real TCP end to end - register, route, redeploy and
# restart (T11).
[[test]]
name = "registration_e2e_tests"
path = "tests/registration_e2e_tests.rs"
