[package]
name = "foundation_proxy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reverse proxy — SSL termination, zero-downtime deploys, health-check routing"

[dependencies]
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.1" }
foundation_core = { path = "../foundation_core", version = "0.0.3", features = ["multi"] }
foundation_http = { path = "../foundation_http", version = "0.0.1", features = ["multi", "ssl"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", features = ["ssl", "multi"] }
foundation_db = { path = "../foundation_db", version = "0.0.1" }
foundation_deployment_cloudflare = { path = "../foundation_deployment_cloudflare", version = "0.1.0", optional = true }

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
derive_more.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
foundation_deployment_platform = { path = "../foundation_deployment_platform", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = "3"

[features]
default = []
cloudflare = ["foundation_deployment_cloudflare"]

[lints]
workspace = true
