[package]
name = "foundation_arrow"
version = "0.0.1"
edition = "2021"
description = "Arrow-based zero-copy serialization for any Rust type. Works on native, WASI, and WASM."

[dependencies]
# Slim by construction: the split arrow crates with default-features=false
# pull exactly what the wire needs (ipc framing, arrays, schema) — no csv/
# json/prettyprint, and NO chrono-tz (we use plain millisecond timestamps;
# tz-name parsing and its embedded tz database are never needed).
arrow-array = { version = "55", default-features = false }
arrow-schema = { version = "55", default-features = false }
arrow-ipc = { version = "55", default-features = false }
arrow-data = { version = "55", default-features = false }
arrow-buffer = { version = "55", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = { workspace = true }
# DomOp + the shared Row mapping + ProtocolEncoder contract (feature 05).
foundation_ui_traits = { workspace = true }

[dev-dependencies]
foundation_errstacks = { path = "../foundation_errstacks" }
