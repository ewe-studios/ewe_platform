[package]
name = "foundation_core"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Central crate for all foundation crates for the ewe-platform project"
keywords = ["foundations_core", "ewe-platform-core"]

[lib]
# rlib only: every consumer that needs a shared library (nodejs integrations,
# examples, the wasm_tests harness) declares its OWN `crate-type = ["cdylib"]`
# and depends on this crate as an rlib. Declaring `cdylib` here just emitted a
# redundant, fixed-named `libfoundation_core.so` that collided with itself across
# feature-variant builds (cargo#6313 "output filename collision").
crate-type = ["rlib"]

[dependencies]
# RNG (ChaCha8Rng / SeedableRng / RngCore / thread `rng()`) comes from
# foundation_compact's vendored entropy — NOT upstream rand/getrandom — so wasm
# builds never drag getrandom's wasm-bindgen backend into the OWNED path
# (decision 031 / feature 14). std is followed from this crate's `std` feature.
foundation_compact = { path = "../foundation_compact", version = "0.2.0", default-features = false }
# Proc macros this crate re-exports (#[valtron], #[valtron_test] from
# foundation_core::valtron) — compile-time only.
foundation_macros = { path = "../foundation_macros", version = "0.0.4" }

# -- Workspace dependencies
foundation_wasm = { path = "../foundation_wasm", version = "0.0.3" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.4" }

# -- Other dependencies
futures-core = { version = "0.3", default-features = false }
derive_more = { version = "2.0", features = ["from", "debug", "error", "display"] }
serde = { version = "1", features = ["derive"] }
concurrent-queue = { version = "2.5.0" }
toml_datetime = { version = "0.7" }
serde_json = { version = "1" }
toml = { version = "0.9" }
fastrand = "2.3.0"
tracing = { version = "0.1.41" }
bytes = "1.5"

# JS event loop yield (wasm-bindgen backend)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "DedicatedWorkerGlobalScope", "console",
    "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamDefaultController",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-subscriber = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serial_test = { workspace = true }
foundation_testing = { path = "../foundation_testing" }
reqwest = { version = "0.12.15", features = ["blocking"] }
ntest = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
smol = "2"

[features]
debug_trace = ["standard", "log_debug"]
debug_block = []
trace_block = []
standard = ["log_info", "log_errors", "log_warnings"]
log_warnings = []
log_errors = []
log_debug = []
log_info = []

# Valtron utilities features
alloc = ["futures-core/alloc"]
std = ["futures-core/std", "foundation_nostd/std", "foundation_compact/std"]
multi = ["std", "alloc"]  # Multi-threaded executor requires std

# JS event loop yield backends (mutually exclusive — pick one for wasm32)
js-wasmbindgen = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures", "foundation_nostd/js-event-loop"]
js-foundation-wasm = ["foundation_wasm/web"]

# default flags
default = ["standard", "std", "alloc"]

[build-dependencies]
foundation_buildtools = { path = "../foundation_buildtools", version = "0.0.1" }

[lints]
workspace = true
