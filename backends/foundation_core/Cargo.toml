[package]
name = "foundation_core"
version = "0.0.23"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Central crate for all foundation crates for the ewe-platform project"
keywords = ["foundations_core", "ewe-platform-core"]

[lib]
# rlib only: every consumer that needs a shared library (nodejs integrations,
# examples, the wasm_tests harness) declares its OWN `crate-type = ["cdylib"]`
# and depends on this crate as an rlib. Declaring `cdylib` here just emitted a
# redundant, fixed-named `libfoundation_core.so` that collided with itself across
# feature-variant builds (cargo#6313 "output filename collision").
crate-type = ["rlib"]

[dependencies]
# RNG (ChaCha8Rng / SeedableRng / RngCore / thread `rng()`) comes from
# foundation_compact's vendored entropy — NOT upstream rand/getrandom — so wasm
# builds never drag getrandom's wasm-bindgen backend into the OWNED path
# (decision 031 / feature 14). std is followed from this crate's `std` feature.
foundation_compact = { path = "../foundation_compact", version = "0.2.7", default-features = false }
# The shared context (`Ctx`, `Clock`, ...). `valtron` re-exports it.
foundation_context = { path = "../foundation_context", version = "0.0.4" }
# Proc macros this crate re-exports (#[valtron], #[valtron_test] from
# foundation_core::valtron) — compile-time only.
foundation_macros = { workspace = true }

# -- Workspace dependencies
# Only the `js-foundation-wasm` JS-yield backend (wasm targets) uses it, so it is
# optional: native builds no longer compile foundation_wasm and its native-only
# CLI tooling (clap, toml_edit, foundation_codegen, ...).
foundation_wasm = { path = "../foundation_wasm", version = "0.0.11", optional = true }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.10" }

# -- Other dependencies
futures-core = { version = "0.3", default-features = false, optional = true }
# `StreamExt` (`.next().await`, `.collect::<Vec<_>>().await`, …) for the valtron
# `futures_core::Stream` bridges. Optional and pulled in by `alloc`/`std`, so a
# bare build does not compile it.
futures-lite = { version = "2", default-features = false, features = ["std"], optional = true }
derive_more = { version = "2.0", features = ["from", "debug", "error", "display"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
concurrent-queue = { version = "2.5.0" }
toml_datetime = { version = "0.7" }
serde_json = { version = "1" }
toml = { version = "0.9" }
fastrand = "2.3.0"
tracing = { version = "0.1.41" }
bytes = "1.5"

# JS event loop yield (wasm-bindgen backend)
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window", "DedicatedWorkerGlobalScope", "console",
    "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamDefaultController",
] }

[dev-dependencies]
wasm-bindgen-test.workspace = true
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-subscriber = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libc = "0.2"
# The SQL VFS tests run against a real SQLite engine, not a fake. The workspace
# already builds libsql for foundation_db; this crate reuses the same version.
libsql = "0.6"
serial_test = { workspace = true }
# The property test modules are native only. proptest's fork feature pulls
# rusty-fork and wait-timeout, which do not build for wasm32; keeping the
# dependency native means the wasm `--tests` check never sees them.
proptest = { workspace = true }
# The external reference Durable Streams client needs tokio in the cross-run
# test. No shipped code uses it.
tokio = { version = "1.53.1", features = ["macros", "rt"] }
smol = "2"

[features]
debug_trace = ["standard", "log_debug"]
debug_block = []
trace_block = []
standard = ["log_info", "log_errors", "log_warnings"]
log_warnings = []
log_errors = []
log_debug = []
log_info = []

# Valtron utilities features
alloc = ["futures-core/alloc"]
std = ["futures-core/std", "foundation_nostd/std", "foundation_compact/std", "dep:futures-lite"]
# The task engine: the executors, `valtron::Ctx`, the `#[valtron]` macros and
# the wrappers built on them. The durable protocol core and the other modules
# do not need it. It needs `std`, so it implies that feature. It is on by
# default; turn it off to build only the runtime-neutral core.
valtron = ["std"]
multi = ["std", "alloc", "valtron"]  # Multi-threaded executor requires std
# Test-only `SimulatedClock` for deterministic time control. It lives in the
# valtron `Ctx`, so it needs `std` and the `valtron` feature.
test-clock = ["std", "valtron"]
# The deterministic simulation runtime (`valtron::sim`). It needs the
# single-threaded engine, so it is absent when `multi` is on.
testing = ["test-clock", "alloc"]

# A shared conformance kit for `DurableStreamVfs` implementations. A VFS crate
# enables it in its dev-dependencies and runs the same scenarios. It needs
# `std`, the simulated clock and `valtron` (the clock lives there). Test-only.
vfs-testkit = ["std", "test-clock", "valtron"]

# JS event loop yield backends (mutually exclusive — pick one for wasm32)
# Each also picks foundation_compact's matching wasm32 time/entropy backend,
# and each needs the valtron executor that yields to the event loop.
js-wasmbindgen = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures", "foundation_nostd/js-event-loop", "foundation_compact/wasm-bindgen", "foundation_context/wasm-bindgen", "valtron"]
# `js-event-loop` selects foundation_nostd's spin CondVar. Without it, a
# NotifyQueue wait reaches std's wasm Condvar, which panics (#605).
js-foundation-wasm = ["dep:foundation_wasm", "foundation_wasm/web", "foundation_nostd/js-event-loop", "foundation_compact/host-abi", "foundation_context/host-abi", "valtron"]

# default flags
default = ["standard", "std", "alloc", "valtron"]

[build-dependencies]
foundation_buildtools = { path = "../foundation_buildtools", version = "0.0.3" }

[lints]
workspace = true
