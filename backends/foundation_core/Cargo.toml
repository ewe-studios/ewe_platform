[package]
name = "foundation_core"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "central crate for all foundation crates for the ewe-platform project"
keywords = ["foundations_core", "ewe-platform-core"]

[dependencies]

# -- Workspace dependencies

foundation_wasm = { workspace = true }
foundation_nostd = {workspace = true }


# -- Other dependencies
futures-core = { version = "0.3", default-features = false }
derive_more = { version = "2.0", features = ["from", "debug", "error", "display"] }
serde = { version = "1", features = ["derive"] }
concurrent-queue = { version = "2.5.0" }
toml_datetime = { version = "0.7" }
serde_json = { version = "1" }
serde_yml = { version = "0.0.12" }
toml = { version = "0.9" }
fastrand = "2.3.0"
chrono = { version = "0.4", default-features = false }
rand = "0.9"
rand_chacha = "0.9"

async-trait = { version = "0.1.88" }
memchr = "2.7.4"
tracing = { version = "0.1.41" }
thiserror = { version = "2.0" }

regex = "1.12.2"
base64 = "0.22"
sha1 = "0.10"
bytes = "1.5"
zeroize = { version = "1" }

# rust-embed
rust-embed = { version = "8.7.0", features = ["mime-guess", "interpolate-folder-path"]}

# Compression dependencies
flate2 = { version = "1.0", optional = true }
brotli = { version = "6.0", optional = true }

# JS event loop yield (wasm-bindgen backend)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "DedicatedWorkerGlobalScope", "console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SSL/TLS backends — not available on wasm32 (require C compilation or OS APIs)
ring = { version = "0.17.14", optional = true }
aws-lc-rs = { version = "1.16.1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "0.26", optional = true }
native-tls = { version = "0.2", optional = true }
openssl = { version = "0.10", optional = true }
socket2 = { version = "0.6", optional = true }

[dev-dependencies]
serial_test = { workspace = true }
tracing-test = { version = "0.2",  features = ["no-env-filter"] }
tracing-subscriber = "0.3"
reqwest = { version = "0.12.15", features = ["blocking"] }
foundation_testing = { path = "../foundation_testing" }
ntest = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
smol = "2"

[features]
debug_trace = ["standard", "log_debug"]
standard = ["log_info", "log_errors", "log_warnings"]
log_warnings = []
log_errors = []
log_debug = []
log_info = []
nightly = ["socket2"]

socks5 = []
ssl-provider-ring = ["ring"]
ssl-provider-awsrc = ["aws-lc-rs"]
ssl-openssl = ["std", "openssl"]
ssl-rustls = ["std", "rustls", "rustls-pemfile", "webpki-roots", "rustls/std", "rustls/tls12", "rustls/logging"]
ssl-rustls-awsrc =  ["ssl-rustls", "ssl-provider-awsrc", "rustls/aws-lc-rs"]
ssl-rustls-ring =  ["ssl-rustls", "ssl-provider-ring", "rustls/ring", "rustls/tls12", "rustls/logging", "rustls/std"]
ssl-native-tls = ["std", "native-tls", "native-tls/vendored"]
ssl = ["ssl-rustls-ring"]
# ssl = ["ssl-openssl"]
# ssl = ["ssl-native-tls"]

# This feature switches the no threading runtime where you have
# specified control over when the Executor actually executes tasks
# allowing your calls to spawn to also call execution for submitted tasks.
#
# This feature enables usesful for WebAssembly and like environments
# where multi-threading is not supported (for the moment).
nothread_runtime = []


# Compression features
compression = ["flate2", "brotli"]
gzip = ["flate2"]
deflate = ["flate2"]

# Wire module features
# wire-native: includes socket/TLS-dependent wire modules (simple_http client, websocket, event_source, http_stream)
# On non-wasm32 targets this is enabled by default via std. On wasm32, opt in if you have alternative netcap bindings.
wire-native = ["std"]

# Valtron utilities features
std = ["futures-core/std", "foundation_nostd/std"]
alloc = ["futures-core/alloc"]
multi = ["std"]  # Multi-threaded executor requires std

# JS event loop yield backends (mutually exclusive — pick one for wasm32)
js-wasmbindgen = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
js-foundation-wasm = []

# default flags (removed ssl to avoid conflicts - users must explicitly choose TLS backend)
default = ["standard", "std", "ssl", "compression", "wire-native"]

[package.metadata.docs.rs]
# enable one of these as default implementation
features = ["ssl-rustls"]

[lints]
workspace = true

# Valtron utilities features
