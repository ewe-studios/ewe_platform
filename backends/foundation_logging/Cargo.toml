[package]
name = "foundation_logging"
version = "0.0.1"
edition = "2021"
description = "Structured logging built on tracing — configurable subscribers with env-filter and JSON formatting for the ewe_platform ecosystem"

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter"] }
