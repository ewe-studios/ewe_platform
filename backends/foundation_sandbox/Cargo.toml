[package]
name = "foundation_sandbox"
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "One core library that starts sandboxes and runs commands in them: the contract (domain types, errors, limits and the two RPC services)"
keywords = ["sandbox", "firecracker", "cloudflare", "rpc", "foundation"]

[dependencies]
# The injected side effects (`Ctx`: clock, config, entropy and the `Env` entry).
foundation_context = { path = "../foundation_context", version = "0.0.4" }
# The valtron stream traits and the executor bridges this crate names in its
# driver and provider interfaces.
foundation_core = { path = "../foundation_core", version = "0.0.23" }
# The monotonic instant and wall-clock types the injected clock returns.
foundation_compact = { path = "../foundation_compact", version = "0.2.7", default-features = false }
# The platform error trace (`ErrorTrace`), so `SandboxResult` is one trace.
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
# The `#[service]` macro, re-exported by `foundation_connectrpc`.
foundation_macros = { path = "../foundation_macros", version = "0.0.25" }
# `Secret` and `extract_bearer_token` (spec 86). The crate never defines a
# second secret type. `default-features = false` keeps the database, JWT and
# signed-secret providers out of this crate.
foundation_auth = { path = "../foundation_auth", version = "0.0.16", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
bytes = "1"
derive_more = { workspace = true }
futures = "0.3"
tracing = { workspace = true }
# The argument parser of the two programs (feature 06).
clap = { workspace = true, optional = true }

# The code-first service macro, `Request`/`Response`, `ConnectError` and the
# context. The renderer's default features are not needed: this crate uses the
# service surface only. The native build also needs `netio-core`: the HTTP/1.1
# server and client without a C TLS library, so the static musl slave links.
# The wasm build must not enable it: it would turn on `multi` for the wasm
# netio, whose single-threaded code has no `Send` bound.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The control plane runs its tasks and its watchers on the shared thread pool.
# The feature is native only: single-threaded wasm keeps the one-thread executor.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["multi"] }
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.19", default-features = false, features = ["netio-core"] }
# The platform HTTP client (`HttpClientBuilder`, `DynNetClient`) of the artifact
# store, the control-plane client, the in-memory transport of the simulation
# helpers and the client of the slave tests. The base set has no TLS: the
# static musl slave enables only the `slave` feature and no TLS provider. The
# `artifacts` feature adds the TLS provider with `foundation_netio/ssl`. The
# value is not optional: `foundation_http` (the two servers) already depends on
# it on every native target.
foundation_netio = { path = "../foundation_netio", version = "0.0.19", default-features = false, features = ["standard", "std", "wire-native", "multi"] }
# The gzip decoder and the tar reader of the artifact store.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# The SHA-256 hasher of a streamed download (feature 03).
sha2 = { version = "0.10", optional = true }
# The `JsonHash` derive of the generated Firecracker types calls `base85rs` and
# `sha2`; a derive expands in this crate, so this crate names them.
base85rs = { version = "0.1", optional = true }
# The common API types (`ApiClient`, `ApiError`, `ApiResponse`, `BodyLimits`)
# that the generated Firecracker client uses (feature 04). This is the same
# dependency that `foundation_deployment_docker` takes for its generated client.
foundation_deployment = { path = "../foundation_deployment", version = "0.0.7", optional = true }
# The HTTP/1.1 server of the two listeners (features 01 and 06) and the client of
# `SandboxRpcClient::connect`. `default-features = false` and `netio-core`: no
# C TLS library, so the static musl slave links without a C compiler. The value
# is not optional: the control-plane server (`native::serve`) is part of the
# `control` feature, and the slave server is part of `slave`.
foundation_http = { path = "../foundation_http", version = "0.0.17", default-features = false, features = ["netio-core"] }
# The signal support of `agent-sandbox run` (feature 06) and the fd readiness of
# the slave (feature 01). The `signal` feature is also the platform handle that
# `agent-sandbox` parks on; `fd` is added by the `slave` feature.
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.16", default-features = false, features = ["signal"], optional = true }
# The `Provider` trait and its identifier types (feature 06). The trait stays in
# the deployment crate; only the sandbox facade lives here (decision D1).
foundation_deployment_platform = { path = "../foundation_deployment_platform", version = "0.1.9", optional = true }
# The Docker Engine API client, its generated types and its streamed bodies
# (feature 10). The driver uses them as they are; it adds no request body of its
# own (invariant I9).
foundation_deployment_docker = { path = "../foundation_deployment_docker", version = "0.1.8", default-features = false, features = ["docker"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
foundation_connectrpc = { path = "../foundation_connectrpc", version = "0.0.19", default-features = false }

# The generator that keeps `src/native/firecracker/generated/` honest against
# the vendored API file (feature 04). Optional: only the `firecracker` feature
# runs it, and a crate built without that feature needs no build step.
[build-dependencies.foundation_codegentools]
path = "../foundation_codegentools"
version = "0.1.8"
optional = true

[dev-dependencies]
# The workspace holds one `proptest` version for every crate (spec 77 rule).
proptest = { workspace = true }
# The streamed bodies of the Docker driver tests (feature 10): the fake Engine
# answer is a `ByteStream` or a `JsonLinesStream` over a fixed body.
foundation_deployment = { path = "../foundation_deployment", version = "0.0.7" }
# `SimulatedClock` for the deterministic identifier test. The feature is
# test-only; it adds no code to the library build.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["test-clock"] }

# The process control of the native side effects: `prctl` for the parent-death
# signal and `kill` for a signal and a liveness check. The slave also uses it for
# `fork`, `execve`, `mount`, `signalfd` and `openat2`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The slave engine (feature 01) is a Linux guest program: process control,
# signals and PID 1 duties have no meaning on another target. The dependencies
# are Linux-only and enabled by the `slave` feature.
[target.'cfg(target_os = "linux")'.dependencies]
# The shared reactor and fd readiness: every pipe is non-blocking and parks an
# async task until it is ready.
foundation_reactor = { path = "../foundation_reactor", version = "0.0.5", optional = true }
# `fork`, `execve`, `mount`, `signalfd`, `openat2` and the other system calls.
libc = { version = "0.2", optional = true }

[features]
# The guest-artifact store (feature 03) and its manifest.
artifacts = [
    "dep:flate2",
    "dep:tar",
    "dep:sha2",
    "foundation_netio/ssl",
]
# The command structures and the two programs (feature 06). Native only. The
# feature pulls the signal handle of `agent-sandbox run` and the HTTP server of
# `serve`; it pulls no C TLS library, so `agent-slave` stays a static musl
# program (decision D11).
cli = [
    "dep:clap",
    "dep:foundation_nativeapis",
]
# The Cloudflare part (feature 07).
cloudflare = []
# `SandboxManager` (feature 02).
control = []
default = ["control", "firecracker", "artifacts"]
# The Docker driver (feature 10). It talks to the Docker Engine through the
# client of `foundation_deployment_docker` and builds the slave tar with the
# `tar` crate.
docker = [
    "dep:foundation_deployment_docker",
    "dep:tar",
]
# The Firecracker API client and driver (features 04 and 05). Linux only in use.
# The generator writes one `firecracker_<group>` feature for each operation
# group; this feature turns them all on, below the one `firecracker` gate.
firecracker = [
    # The driver resolves the kernel, the initramfs and the root file system
    # from the artifact store (feature 03).
    "artifacts",
    "dep:base85rs",
    "dep:foundation_codegentools",
    "dep:foundation_deployment",
    "dep:sha2",
    "firecracker_actions",
    "firecracker_balloon",
    "firecracker_boot_source",
    "firecracker_config",
    "firecracker_cpu_config",
    "firecracker_create",
    "firecracker_default",
    "firecracker_drives",
    "firecracker_enclave",
    "firecracker_entropy",
    "firecracker_load",
    "firecracker_logger",
    "firecracker_machine_config",
    "firecracker_memory",
    "firecracker_metrics",
    "firecracker_mmds",
    "firecracker_network_interfaces",
    "firecracker_pmem",
    "firecracker_serial",
    "firecracker_start",
    "firecracker_statistics",
    "firecracker_status",
    "firecracker_stop",
    "firecracker_version",
    "firecracker_vm",
    "firecracker_vsock",
]
firecracker_actions = []
firecracker_all = [
    "firecracker_actions",
    "firecracker_balloon",
    "firecracker_boot_source",
    "firecracker_config",
    "firecracker_cpu_config",
    "firecracker_create",
    "firecracker_default",
    "firecracker_drives",
    "firecracker_enclave",
    "firecracker_entropy",
    "firecracker_load",
    "firecracker_logger",
    "firecracker_machine_config",
    "firecracker_memory",
    "firecracker_metrics",
    "firecracker_mmds",
    "firecracker_network_interfaces",
    "firecracker_pmem",
    "firecracker_serial",
    "firecracker_start",
    "firecracker_statistics",
    "firecracker_status",
    "firecracker_stop",
    "firecracker_version",
    "firecracker_vm",
    "firecracker_vsock",
]
firecracker_balloon = []
firecracker_boot_source = []
firecracker_config = []
firecracker_cpu_config = []
firecracker_create = []
firecracker_default = []
firecracker_drives = []
firecracker_enclave = []
firecracker_entropy = []
firecracker_load = []
firecracker_logger = []
firecracker_machine_config = []
firecracker_memory = []
firecracker_metrics = []
firecracker_mmds = []
firecracker_network_interfaces = []
firecracker_pmem = []
firecracker_serial = []
firecracker_start = []
firecracker_statistics = []
firecracker_status = []
firecracker_stop = []
firecracker_version = []
firecracker_vm = []
firecracker_vsock = []
# The libkrun driver (feature 09).
libkrun = []
# The `Provider` facade over any control plane (feature 06). The `Provider`
# trait itself stays in `foundation_deployment_platform` (decision D1).
provider = ["dep:foundation_deployment_platform"]
# The slave engine (feature 01). Native only.
slave = [
    "dep:foundation_reactor",
    "dep:foundation_nativeapis",
    "foundation_nativeapis/fd",
    "foundation_core/multi",
]
# The simulation helpers (feature 02).
testing = []

# The control-plane program (feature 06). `serve` needs the control plane; the
# `run` path also needs a driver, which this build gives when a driver feature
# is on. The static program of `agent-slave` needs `slave` and `cli` only.
[[bin]]
name = "agent-sandbox"
path = "src/bin/agent_sandbox.rs"
required-features = ["cli", "control"]

# The guest program (feature 06). `default-features = false, features = ["slave",
# "cli"]` builds it with no TLS library and no Docker client (decision D11).
[[bin]]
name = "agent-slave"
path = "src/bin/agent_slave.rs"
required-features = ["cli", "slave"]

# The slave process of the tests. A libtest test cannot be that process: the
# harness starts a thread before the test, and the process main thread keeps
# `SIGCHLD` unblocked, so the reaper's `signalfd` misses a child. This program
# blocks `SIGCHLD` in `main`, before any thread starts. `tests/slave/support.rs`
# starts it through `CARGO_BIN_EXE_slave_test_driver`.
[[bin]]
name = "slave_test_driver"
path = "tests/support/slave_main.rs"
test = false
required-features = ["slave"]

[lints]
workspace = true
