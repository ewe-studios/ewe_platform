[package]
name = "foundation_auth"
version = "0.0.16"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Authentication and authorization — OAuth2/OIDC flows, JWT handling, password hashing (Argon2), TOTP, and session management with Turso/SQLite and wasm-bindgen backends"
keywords.workspace = true

[dependencies]
hex = { workspace = true, optional = true }
foundation_core = { path = "../foundation_core", version = "0.0.23" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_netio = { path = "../foundation_netio", version = "0.0.18", default-features = false }
foundation_db = { path = "../foundation_db", version = "0.0.11", default-features = false }
foundation_http = { path = "../foundation_http", version = "0.0.17", optional = true }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4", optional = true }
foundation_compact = { path = "../foundation_compact", version = "0.2.7" }
# The VFS trait that the operator key files read through. It builds on wasm:
# only `NativeFs` is native. Feature `secret`.
foundation_nativeapis = { workspace = true, optional = true }

# Signed secrets (spec 81). Ed25519 is pure Rust and builds for wasm; `ssh-key`
# reads OpenSSH private key files, and `p256` reads the P-256 PKCS#8 and SEC1
# forms. All three are pure Rust, so the key module builds on every target.
ed25519-compact = { version = "2.3", default-features = false, features = ["std", "pem"], optional = true }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "p256"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"], optional = true }

# Error handling (derive_more::From + manual Display, NO thiserror)
derive_more = { version = "2.0", features = ["from", "error", "display"] }

# Cryptography
zeroize = { workspace = true }
chacha20poly1305 = "0.10" # Encrypted session data
sha1 = { workspace = true }             # SHA-1 for TOTP (RFC 6238 default)
sha2 = { workspace = true }             # SHA256 for PKCE, PBKDF2 HMAC
hmac = { workspace = true }             # TOTP, HMAC, PBKDF2
getrandom = { version = "0.2", optional = true }

# Token formats. The pure-Rust backend: the default `boring` backend links
# BoringSSL, which cannot share a binary with the OpenSSL that `ssh2` links
# (the VM tests of foundation_deployment_platform).
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }

# Encoding
base64 = "0.22"
urlencoding = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = { version = "0.11", optional = true }

# Time handling
chrono = "0.4"

# Utilities
uuid = { version = "1.0", features = ["v4"], optional = true }
bytes = "1.5"
async-trait = "0.1"
# Diagnostics for a refused handshake (spec 87).
tracing = { workspace = true }

# Async stream plumbing. `futures-core` is always on: the trust store trait
# (spec 87) streams its clients on every target.
futures-core = "0.3"
# Async lock for the key-value trust store's use counter.
futures-util = { workspace = true }
futures-lite = { version = "2", optional = true }

# WebAuthn/FIDO2 — native only (openssl dep, does not compile to wasm32).
# `danger-allow-state-serialisation` lets us persist the in-progress
# PasskeyRegistration/PasskeyAuthentication ceremony state into the shared
# server-side KV cache (the crate's supported use of this flag) instead of a
# process-local map, so register/start and register/finish can be served by
# different handler instances / nodes.
webauthn-rs = { version = "0.5", optional = true, features = ["danger-allow-state-serialisation"] }
# Build OpenSSL from source (vendored) so `server-native` links without a system
# OpenSSL 3 installation. `webauthn-rs` pulls the same `openssl` version, so this
# declaration only adds the `vendored` feature to the unified build.
openssl = { version = "0.10", features = ["vendored"], optional = true }
url = { workspace = true, optional = true }

# Wasm-bindgen OAuth support (gated behind wasm-bindgen-oauth feature)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "AbortController",
  "ServiceWorkerGlobalScope",
  "Window",
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The defaults are off so a consumer that must not link a C TLS library can
# leave them off. The `netio-ssl` feature restores them and is in the default
# set, so every existing consumer keeps today's set.
foundation_netio = { path = "../foundation_netio", version = "0.0.18", default-features = false, features = ["multi", "std", "wire-native", "standard", "compression"] }
# RSA-PSS signed-secret keys (feature `secret-rsa`). The `ring` crate seals
# its random source to the operating system, so it cannot take the entropy of
# `Ctx`. `rsa` takes a caller-supplied random source instead, and
# `rand_chacha` 0.3 expands the 32 bytes that the `Ctx` entropy source gives.
# Both build only for a native target.
rsa = { version = "0.9", optional = true }
rand_chacha = { version = "0.3", optional = true }
# Password hashing (native only — the wasm build uses Web Crypto instead).
argon2 = "0.5"
pbkdf2 = { workspace = true }
# Certificate authority, trust verifier and TLS configuration (spec 87). The
# `mtls` feature names them: they link `ring`, which has C code, so a consumer
# that must stay free of C code, such as the static musl slave, leaves it off.
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
# Certificate authority, trust verifier and TLS configuration (spec 87).
time = { workspace = true }

# NOTE: `default-features = false` is required here. Cargo unions default-features
# across a crate's dependency declarations, so without it this target line would
# re-enable foundation_netio's `default` feature (→ `ssl` + `multi` + `wire-native`,
# all native-only) on wasm and break the build. Only `wasm-fetch` belongs on wasm.
[target.'cfg(target_family = "wasm")'.dependencies]
foundation_netio = { path = "../foundation_netio", version = "0.0.18", default-features = false, features = ["wasm-fetch"] }

[dev-dependencies]
tempfile = "3"
# `test-clock` provides `SimulatedClock`, so a test can prove that the auth
# code reads the injected clock instead of the real wall clock.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["test-clock"] }
foundation_testing = { path = "../foundation_testing" }
# The in-memory file system for the key-loading tests.
foundation_nativeapis = { workspace = true, features = ["vfs"] }
foundation_compact = { path = "../foundation_compact", version = "0.2.7" }
base64 = "0.22"
serde_json = "1.0"
serial_test = { workspace = true }
ntest = { workspace = true }

[lints]
workspace = true

[features]
# Turso/SQLite backend (native only)
default = ["turso", "secret", "jwt", "mtls", "netio-ssl"]
turso = ["foundation_db/turso"]
# Signed secrets (spec 81) and the operator key module. Ed25519, OpenSSH key
# parsing and P-256 key parsing are pure Rust, so this builds for wasm.
secret = ["dep:foundation_nativeapis", "dep:ed25519-compact", "dep:ssh-key", "dep:p256"]
# Mutual TLS (spec 87): the certificate authority, the trust verifier and the
# TLS providers. They link `ring`, which has C code; a consumer that must stay
# free of C code, such as the static musl slave, leaves this off.
mtls = ["dep:rcgen", "dep:rustls", "dep:rustls-pemfile", "dep:x509-parser"]
# The TLS provider of foundation_netio, for the HTTPS clients of this crate.
netio-ssl = ["foundation_netio/ssl"]
# Operator-supplied RSA-PSS keys for signed secrets (spec 81). The crate is
# native only: a wasm build never enables it, and it refuses an RSA secret
# with `SecretError::UnsupportedAlgorithm`.
secret-rsa = ["secret", "dep:rsa", "dep:rand_chacha"]
# The JSON Web Token (JWT) provider (`JwtAuth`). `jwt-simple` is always a
# dependency for the application modules; this flag gates the server provider.
jwt = []
# IdP server module (pulls in foundation_http + foundation_db for storage)
server = ["dep:hex", "dep:foundation_http", "dep:futures-lite", "dep:foundation_errstacks", "dep:uuid"]
# Integration tests for IdP server (real TCP, thread pool)
server-test = ["server", "foundation_core/multi", "foundation_netio/multi", "foundation_http/multi"]
# Social login end-to-end tests against a local provider simulator (spec 57,
# F011). The tests live in the `server-test` target and need no Docker.
social-integration-tests = ["server-test"]
# Wasm compatibility — browser crypto and JS time APIs
wasm = ["chrono/wasmbind", "dep:getrandom", "getrandom/js"]
# Wasm-bindgen OAuth client using browser fetch API
wasm-bindgen-oauth = [
  "wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
]

# PBKDF2 on WASM (needs web-sys for SubtleCrypto, js-sys/wasm-bindgen-futures for JS interop)
wasm-pbkdf2 = [
  "wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
]
# Async session manager for wasm32 (D1-backed)
wasm-bindgen-session = [
  "wasm",
  "foundation_db/wasm-bindgen-storage",
  "dep:uuid",
  "uuid/js",
]
# Native server with WebAuthn (openssl dep, wasm-incompatible)
server-native = ["server", "dep:webauthn-rs", "dep:openssl", "dep:url", "dep:serde_cbor"]

# Test module tree (units/ + integration/ via lib.rs)
[[test]]
name = "foundation_auth_tests"
path = "tests/lib.rs"
required-features = ["server-test"]

# Spec 87: the certificate authority, the trust store, the mutual-TLS verifier
# and the mTLS providers. No extra feature is needed, so the verify commands of
# the specification run this target.
[[test]]
name = "mtls_tests"
path = "tests/mtls/mod.rs"

# Spec 81 feature 00: signed secrets and the operator key files.
[[test]]
name = "secret_tests"
path = "tests/secret/mod.rs"
required-features = ["secret"]

[[test]]
name = "keys_tests"
path = "tests/keys/mod.rs"
required-features = ["secret"]

# Spec 81 feature 00: the signed-secret, JWT, plaintext and composite providers.
[[test]]
name = "client_auth_tests"
path = "tests/client_auth/mod.rs"
required-features = ["secret", "jwt"]
