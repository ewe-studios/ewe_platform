[package]
name = "foundation_auth"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Authentication and authorization — OAuth2/OIDC flows, JWT handling, password hashing (Argon2), TOTP, and session management with Turso/SQLite and wasm-bindgen backends"
keywords.workspace = true

[dependencies]
foundation_core = { workspace = true }
foundation_netio = { workspace = true }
foundation_db = { workspace = true, default-features = false }
foundation_http = { workspace = true, optional = true }
foundation_errstacks = { workspace = true }

# Error handling (derive_more::From + manual Display, NO thiserror)
derive_more = { version = "2.0", features = ["from", "error", "display"] }

# Cryptography
zeroize = { version = "1" }
argon2 = "0.5"            # Password hashing (memory-hard)
chacha20poly1305 = "0.10" # Encrypted session data
sha2 = "0.10"             # SHA256 for PKCE
hmac = "0.12"             # TOTP, HMAC
rand = "0.8"              # Secure random generation
getrandom = { version = "0.2", optional = true }

# Token formats
jwt-simple = "0.12"       # JWT support

# Encoding
base64 = "0.22"
urlencoding = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = { version = "0.11", optional = true }

# Time handling
time = "0.3"
chrono = "0.4"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.5"
async-trait = "0.1"

# Async stream plumbing for the async storage layer (gated behind `server`)
futures-core = { version = "0.3", optional = true }
futures-lite = { version = "2", optional = true }

# WebAuthn/FIDO2 — native only (openssl dep, does not compile to wasm32).
# `danger-allow-state-serialisation` lets us persist the in-progress
# PasskeyRegistration/PasskeyAuthentication ceremony state into the shared
# server-side KV cache (the crate's supported use of this flag) instead of a
# process-local map, so register/start and register/finish can be served by
# different handler instances / nodes.
webauthn-rs = { version = "0.5", optional = true, features = ["danger-allow-state-serialisation"] }
url = { version = "2", optional = true }

# Wasm-bindgen OAuth support (gated behind wasm-bindgen-oauth feature)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "AbortController",
  "ServiceWorkerGlobalScope",
  "Window",
  "Crypto",
], optional = true }

[dev-dependencies]
tempfile = "3"
serial_test = { workspace = true }
ntest = { workspace = true }

[lints]
workspace = true

[features]
# Turso/SQLite backend (native only)
default = ["turso"]
turso = ["foundation_db/turso"]
# IdP server module (pulls in foundation_http + foundation_db for storage)
server = ["dep:foundation_http", "dep:futures-core", "dep:futures-lite"]
# Integration tests for IdP server (real TCP, thread pool)
server-test = ["server", "foundation_core/multi", "foundation_http/multi"]
# Wasm compatibility — browser crypto and JS time APIs
wasm = ["uuid/js", "chrono/wasmbind", "dep:getrandom", "getrandom/js"]
# Wasm-bindgen OAuth client using browser fetch API
wasm-bindgen-oauth = [
  "wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
]
# Async session manager for wasm32 (D1-backed)
wasm-bindgen-session = [
  "wasm",
  "foundation_db/wasm-bindgen-storage",
]
# Native server with WebAuthn (openssl dep, wasm-incompatible)
server-native = ["server", "dep:webauthn-rs", "dep:url", "dep:serde_cbor"]
