[package]
description = "Foundation deployment providers for multi-cloud deployments"
keywords = [
    "ewe-platform",
    "deployment",
    "cloud",
    "infrastructure",
]
name = "foundation_deployment"
version = "0.0.3"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[dependencies]
base85rs = "0.1"
bytes = "1"
futures-core = "0.3"
# `StreamExt` (`.next().await`) for the async body streams in providers/common/body.rs.
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
http = "1.4.0"
regex = "1.10"
sha2 = "0.10"
foundation_core = { path = "../foundation_core", version = "0.0.7" }
foundation_netio = { path = "../foundation_netio", version = "0.0.4", features = ["ssl", "multi"] }
foundation_db = { path = "../foundation_db", version = "0.0.5" }
foundation_macros = { path = "../foundation_macros", version = "0.0.7" }

[dependencies.chrono]
workspace = true

[dependencies.derive_more]
workspace = true


[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies]
tracing-subscriber = "0.3"
tracing-test = "0.2"

[features]
default = []
multi = ["foundation_core/multi", "foundation_netio/multi", "foundation_db/multi"]
aws = []
huggingface = []
mongodb = []
standard = []

[lints]
workspace = true
