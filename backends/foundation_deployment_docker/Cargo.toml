[dependencies]
base85rs = "0.1"
bytes = "1"
# Build contexts for `POST /build`: the daemon takes the context as a tar stream.
tar = { version = "0.4", optional = true }
sha2 = "0.10"
futures-lite = "2"

# BuildKit gRPC message types (generated by buffa-build in build.rs). Optional;
# only pulled in by the `buildkit` feature.
[dependencies.buffa]
version = "0.8.1"
features = ["json"]
optional = true

# Streaming combinators referenced by the generated ConnectRPC service code.
[dependencies.futures]
version = "0.3"
optional = true

# Google well-known types (Timestamp, Any, …) referenced by the generated
# BuildKit message code as `buffa_types::google::protobuf::*`.
[dependencies.buffa-types]
version = "0.8.1"
features = ["json"]
optional = true

[build-dependencies.buffa-build]
version = "0.8.1"
optional = true

# ConnectRPC service codegen (trait + register fn + typed client) from the
# BuildKit .proto service definitions — the same generator the connectrpc
# build.rs pattern uses (README Mode 1), driven per-service here.
[build-dependencies.foundation_connectrpc_codegen]
path = "../foundation_connectrpc_codegen"
version = "0.0.1"
optional = true

[build-dependencies.prost]
version = "0.12"
optional = true

[build-dependencies.prost-types]
version = "0.12"
optional = true

[dependencies.chrono]
workspace = true

[dependencies.derive_more]
workspace = true

[dependencies.foundation_connectrpc]
optional = true
path = "../foundation_connectrpc"
version = "0.0.1"

[dependencies.foundation_core]
path = "../foundation_core"
version = "0.0.5"

[dependencies.foundation_deployment]
path = "../foundation_deployment"
version = "0.0.1"

[dependencies.foundation_db]
path = "../foundation_db"
version = "0.0.3"

[dependencies.foundation_errstacks]
path = "../foundation_errstacks"
version = "0.0.2"

# HTTP/2 server for the BuildKit session sidecar (serves FileSync back to
# buildkitd). Optional; only the `buildkit` feature needs it.
[dependencies.foundation_http]
path = "../foundation_http"
version = "0.0.1"
optional = true

[dependencies.foundation_macros]
path = "../foundation_macros"
version = "0.0.5"

[dependencies.foundation_netio]
features = [
    "ssl",
    "multi",
]
path = "../foundation_netio"
version = "0.0.3"

[dependencies.foundation_sshkit]
path = "../foundation_sshkit"
version = "0.1.0"
optional = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tracing]
workspace = true

[features]
buildkit = [
    "foundation_connectrpc",
    "dep:buffa",
    "dep:buffa-types",
    "dep:buffa-build",
    "dep:foundation_connectrpc_codegen",
    "dep:prost",
    "dep:prost-types",
    "dep:futures",
    "dep:foundation_http",
