# `ssh://` Docker host support (DockerClient::connect_ssh).
#
# Separate from `docker` because it links libssh2/OpenSSL, which cannot coexist
# in one binary with the BoringSSL that `buildkit` pulls in (via jwt-simple ->
# foundation_auth -> foundation_connectrpc): two libcryptos, one set of EVP_*
# symbols, and the link fails. Enable it when you need an ssh:// daemon; leave it
# off to use `buildkit`.
ssh = ["dep:foundation_sshkit"]
