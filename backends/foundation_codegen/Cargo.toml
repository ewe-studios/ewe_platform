[package]
name = "foundation_codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Build-time source scanning library for finding macro-annotated Rust items"
keywords = ["codegen", "source-scanning", "syn", "ast-parsing"]

[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
toml = { workspace = true }
serde = { version = "1", features = ["derive"] }
derive_more = { workspace = true }

# wasm module (ported from wasmbin v0.9.2, Apache-2.0 — see NOTICE)
foundation_macros = { workspace = true }
leb128 = "0.2.5"
thiserror = "2"
custom_debug = "0.6.2"
once_cell = "1"
serde_bytes = { version = "0.11", optional = true }
# WAT (text) <-> binary boundary deps — small, isolated, opt-in (F14 boundary rules);
# enabled only by the `wat` feature.
wat = { version = "1", optional = true }
wasmprinter = { version = "0.207", optional = true }

[features]
default = []
# wasm proposals (ported from wasmbin; same gating)
proposals = ["extended-name-section", "threads", "custom-page-sizes"]
extended-name-section = []
threads = []
custom-page-sizes = []
# serde impls for the wasm model (upstream `serde` feature, renamed: this crate has a
# non-optional serde dependency, and cargo forbids a feature sharing its name)
wasm-serde = ["dep:serde_bytes"]
# WAT (text) <-> binary conversion for the wasm model (feature 15 extension)
wat = ["dep:wat", "dep:wasmprinter"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
