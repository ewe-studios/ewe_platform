[package]
name = "foundation_deployment_platform"
version = "0.1.9"
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation deployment platform — VM/container orchestration, Docker runtime, guest infrastructure"
keywords = ["ewe-platform", "deployment", "platform", "docker", "testcontainers"]

[dependencies]
hex = { workspace = true, optional = true }
# Foundation crates
foundation_core = { path = "../foundation_core", version = "0.0.23" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
# The injected clock reads `foundation_compact::SystemTime`; the timestamp
# conversions (`unix_millis`, `unix_seconds`) live here (AGENTS rule 11).
foundation_compact = { path = "../foundation_compact", version = "0.2.7" }
foundation_netio = { path = "../foundation_netio", version = "0.0.19", features = ["ssl", "multi"] }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
foundation_macros = { workspace = true }
# WireGuard mesh (for docker/wireguard.rs, optional). `default-features = false`
# drops the native mesh (`native-mesh`) so BoringSSL is not linked — this crate
# only needs the pure-Rust key/seed types (WgSeed/NetworkId/SeedBits) for env
# injection. Linking BoringSSL here clashes with libssh2/OpenSSL (foundation_sshkit).
foundation_wireguard = { path = "../foundation_wireguard", version = "0.0.10", optional = true, default-features = false }

# Docker API — our own bollard-free client (spec-54)
foundation_deployment_docker = { path = "../foundation_deployment_docker", version = "0.1.8", features = ["docker"] }

# Async utilities
futures-lite = "2"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling + derive
derive_more.workspace = true

# Logging
tracing.workspace = true

# Time
chrono.workspace = true

# VM infrastructure deps (moved from foundation_testbed, spec-53 Feature 11)
ssh2 = { version = "0.9", features = ["vendored-openssl"], optional = true }
indicatif = { version = "0.17", optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
xz2 = { version = "0.1", optional = true }
dirs = { version = "6", optional = true }
anyhow = { version = "1", optional = true }
image = { workspace = true, features = ["default-formats", "rayon"], optional = true }
libc = { version = "0.2", optional = true }
toml = { version = "0.8", optional = true }
fs2 = { version = "0.4", optional = true }
sha2 = { workspace = true, optional = true }
whoami = { version = "2", optional = true }
which = { version = "7", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["docker", "wireguard"]
# Enable when using with valtron multi executor
multi = ["foundation_core/multi", "foundation_netio/multi"]

# VM orchestration (QEMU/UTM providers, moved from foundation_testbed)
vms = [
    "dep:ssh2", "dep:indicatif", "dep:tar", "dep:flate2", "dep:xz2",
    "dep:dirs", "dep:anyhow", "dep:image", "dep:libc",
    "dep:toml", "dep:fs2", "dep:sha2", "dep:hex", "dep:whoami", "dep:which",
    "dep:foundation_wireguard",
]

# VM testbed CLI (`cli::command()` / `cli::run()`, moved from foundation_testbed),
# built as the standalone `testbed` binary below. Requires the VM orchestration
# it drives. It is not mounted in ewe_platform: `vms` links libssh2's vendored
# OpenSSL, which cannot share a binary with the BoringSSL ewe_platform already
# links via foundation_ai -> foundation_auth -> jwt-simple (duplicate SSL_*/EVP_*
# symbols; same constraint as foundation_deployment_docker's `ssh` feature).
cli = ["vms", "dep:clap"]

# WireGuard mesh integration (gated, depends on foundation_wireguard)
wireguard = ["dep:foundation_wireguard"]

# Docker runtime only (default)
docker = ["foundation_deployment_docker/docker"]

# Build images through a standalone buildkitd (BuildBackend::BuildKit).
# Off by default: it pulls in the gRPC/BuildKit stack, and the classic
# POST /build backend needs nothing beyond dockerd.
buildkit = ["foundation_deployment_docker/buildkit"]

# All providers
all-providers = ["vms", "docker"]

# The `foundation_sandbox` provider tests (spec 77 feature 06). The facade and
# its tests live in `foundation_sandbox`; this feature gates the integration
# test file that proves the `Provider` trait sees the same outcomes as the
# control plane. It adds no code to the library build.
sandbox = []

[dev-dependencies]
tracing-subscriber = "0.3"
# The `Provider` facade tests of spec 77 feature 06. The facade is in
# `foundation_sandbox::providers`; this crate keeps the trait. The dev cycle is
# allowed: a dev-dependency does not enter the normal build of either crate.
foundation_sandbox = { path = "../foundation_sandbox", version = "0.0.8", features = ["provider", "cli", "testing"] }
# `SimulatedClock` for the clock-injection tests. The feature is additive, so
# the normal dependency above stays as it is.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["test-clock"] }
foundation_wireguard = { path = "../foundation_wireguard", version = "0.0.10", default-features = false }
foundation_sshkit = { path = "../foundation_sshkit", version = "0.1.7" }

[[bin]]
name = "testbed"
path = "src/bin/testbed.rs"
required-features = ["cli"]

[lints]
workspace = true
