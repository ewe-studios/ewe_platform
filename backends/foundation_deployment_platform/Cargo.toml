[package]
name = "foundation_deployment_platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Foundation deployment platform — VM/container orchestration, Docker runtime, guest infrastructure"
keywords = ["ewe-platform", "deployment", "platform", "docker", "testcontainers"]

[dependencies]
# Foundation crates
foundation_core = { path = "../foundation_core", version = "0.0.3" }
foundation_netio = { path = "../foundation_netio", version = "0.0.1", features = ["ssl", "multi"] }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.1" }
foundation_macros = { path = "../foundation_macros", version = "0.0.4" }
foundation_wireguard = { path = "../foundation_wireguard", version = "0.0.1" }

# Docker API — our own bollard-free client (spec-54)
foundation_deployment_docker = { path = "../foundation_deployment_docker", version = "0.1.0", features = ["docker"] }

# Async utilities
futures-lite = "2"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling + derive
derive_more.workspace = true

# Logging
tracing.workspace = true

# Time
chrono.workspace = true

[features]
default = []
# Enable when using with valtron multi executor
multi = ["foundation_core/multi", "foundation_netio/multi"]

[dev-dependencies]
foundation_sshkit = { path = "../foundation_sshkit", version = "0.1.0", features = ["russh-backend"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
