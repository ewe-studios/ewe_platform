[package]
name = "foundation_packager"
version = "0.1.6"
description = "File generation and templating stack — creates projects from embedded templates with minijinja/tinytemplate support"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["templating", "code-generation", "project-scaffolding"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.21" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.9" }
foundation_macros = { path = "../foundation_macros", version = "0.0.21" }
derive_more = { workspace = true }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
cargo_toml = { version = "0.22.3" }
toml = { version = "0.8.19" }
tracing = { version = "0.1.40" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
minijinja = { version = "2.0.0", features = ["loader"] }

[dev-dependencies]
rand = { version = "0.9.2" }
tracing-test = { version = "0.2.5" }

[features]
debug_block = []
trace_block = []

[lints]
workspace = true
