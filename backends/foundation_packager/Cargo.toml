[package]
name = "foundation_packager"
version = "0.1.2"
description = "File generation and templating stack — creates projects from embedded templates with minijinja/tinytemplate support"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["templating", "code-generation", "project-scaffolding"]

[dependencies]
foundation_core = { path = "../foundation_core", version = "0.0.5" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.5" }
foundation_macros = { path = "../foundation_macros", version = "0.0.5" }
derive_more = { workspace = true }
foundation_conditional = { path = "../foundation_conditional", version = "0.1.1" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.2" }
cargo_toml = { version = "0.20.5" }
toml = { version = "0.8.19" }
rand = { version = "0.9.2" }
tracing = { version = "0.1.40" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114" }
serde_with = { version = "3.6.1" }
minijinja = { version = "2.0.0", features = ["loader"] }

[dev-dependencies]
tracing-test = { version = "0.2.5" }

[features]
debug_block = ["foundation_conditional/debug_block"]
trace_block = ["foundation_conditional/trace_block"]

[lints]
workspace = true
