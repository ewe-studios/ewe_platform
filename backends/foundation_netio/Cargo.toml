[package]
name = "foundation_netio"
version = "0.0.17"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Network I/O abstractions — async HTTP/WebSocket/SOCKS5 clients, TLS backend (rustls/native-tls), compression, and cross-platform netcap with wasm support"
keywords.workspace = true


[lints]
workspace = true

[dependencies]
# -- Workspace dependencies

foundation_core = { path = "../foundation_core", version = "0.0.23" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_nostd = { path = "../foundation_nostd", version = "0.0.10" }
# RNG/entropy from foundation_compact's vendored path (no upstream rand/getrandom
# → wasm-clean). std is followed from this crate's `std` feature.
foundation_compact = { path = "../foundation_compact", version = "0.2.7", default-features = false }
# `shared::mime` expands `data/mime.json` at build time. A proc-macro crate
# compiles for the host, so the wasm build stays clean.
foundation_macros = { workspace = true }
# The map type that the macro emits. `foundation_nostd` re-exports it.
phf = { workspace = true }

# -- Other dependencies
futures-core = { version = "0.3", default-features = false }
# `StreamExt` (`.next().await`, `.try_next()`) for `AsyncSendSafeBody`. futures-core
# alone has only the `poll_next` method; the extension trait lives here.
futures-lite = { version = "2", default-features = false, features = ["alloc"] }
derive_more = { version = "2.0", features = ["from", "debug", "error", "display"] }
serde = { version = "1", features = ["derive"] }
concurrent-queue = { version = "2.5.0" }
toml_datetime = { version = "0.7" }
serde_json = { version = "1" }
toml = { version = "0.9" }
fastrand = "2.3.0"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

async-trait = { version = "0.1.88" }
memchr = "2.7.4"
tracing = { version = "0.1.41" }
regex = "1.12.2"
base64 = "0.22"
sha1 = { workspace = true }
bytes = "1.5"
zeroize = { workspace = true }

# Compression dependencies
flate2 = { workspace = true, optional = true }
brotli = { version = "6.0", optional = true }

# JS event loop yield (wasm-bindgen backend)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window", "DedicatedWorkerGlobalScope", "ServiceWorkerGlobalScope", "console",
    "Request", "RequestInit", "RequestMode",
    "Response", "Headers",
    "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamDefaultController",
    # Streaming responses (wasm::response)
    "ResponseInit", "UnderlyingSource",
    # WebSocket (F51 — unified cross-platform WebSocket client)
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Event",
] }

# workers-rs types for the Durable Object stub client (wasm + `cloudflare`
# only). The version matches foundation_db and foundation_deployment_cloudflare.
[target.'cfg(target_family = "wasm")'.dependencies]
worker = { version = "0.8.3", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The I/O reactor (poll readiness) is used only by the native `raw_stream`
# path; it has no wasm32 poll backend, so keep it off the wasm build.
foundation_reactor = { path = "../foundation_reactor", version = "0.0.5" }
# SSL/TLS backends — not available on wasm32 (require C compilation or OS APIs)
ring = { version = "0.17.14", optional = true }
aws-lc-rs = { version = "1.16.1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "0.26", optional = true }
native-tls = { version = "0.2", optional = true }
openssl = { version = "0.10", optional = true }
# Always available on native targets (feature 04 non-blocking connect), not just
# under `nightly`. The `nightly` feature no longer needs to pull it in.
socket2 = { version = "0.6" }
quinn-proto = { version = "0.11", optional = true, features = ["rustls", "ring"] }

# poll(2) for socket readiness: the H1 client parks its non-blocking sockets on
# `TaskStatus::Depends(SocketReadiness)` instead of blocking a worker in a read.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `test-clock` provides `SimulatedClock`, so the load-tracker tests move the
# rate window by hand instead of sleeping.
foundation_core = { path = "../foundation_core", version = "0.0.23", features = ["test-clock"] }
# F52: wasm-bindgen browser tests via foundation_testbed (wasm32-only).
# All wasm-bindgen ecosystem re-exported by foundation_testbed.
foundation_testbed = { path = "../foundation_testbed", default-features = false, features = ["wasm-bindgen-test"] }
wasm-bindgen-test.workspace = true
# Proc-macro crate — always compiled for host, safe for all targets.
foundation_macros = { workspace = true }
# The wasm tests implement `HttpClient`, which is an `#[async_trait]` trait.
async-trait.workspace = true
# The embedded-asset pipeline in `foundation_macros` keeps `new_mime_guess`.
# The agreement test proves both tables give the same answer on common types.
new_mime_guess = { workspace = true }
# Feature 04 TLS regression tests build a slow rustls server, which needs the
# same `Zeroizing` wrapper the crate's `RustlsAcceptor::from_pem` takes.
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
foundation_testing = { path = "../foundation_testing" }

serial_test = { workspace = true }
tracing-subscriber = "0.3"
reqwest = { version = "0.12.15", features = ["blocking"] }
futures-lite = "2"
ntest = { workspace = true }
smol = "2"

[features]
debug_trace = ["standard", "log_debug"]
debug_block = []
trace_block = []
standard = ["log_info", "log_errors", "log_warnings"]
log_warnings = []
log_errors = []
log_debug = []
log_info = []
nightly = []

socks5 = []
# QUIC (F33). quinn-proto is sans-IO and needs a rustls crypto provider; declare
# them here rather than relying on the default feature set happening to enable
# rustls, which is what made `--no-default-features --features quic` fail to build.
quic = ["std", "dep:quinn-proto", "dep:rustls", "rustls/std", "rustls/ring", "ssl-provider-ring", "dep:rustls-pemfile"]
ssl-provider-ring = ["dep:ring"]
ssl-provider-awsrc = ["dep:aws-lc-rs"]
ssl-openssl = ["std", "dep:openssl"]
# Only the `quic` module reads PEM files, so `rustls-pemfile` stays in `quic`.
ssl-rustls = ["std", "dep:rustls", "dep:webpki-roots", "rustls/std", "rustls/tls12", "rustls/logging"]
ssl-rustls-awsrc =  ["ssl-rustls", "ssl-provider-awsrc", "rustls/aws-lc-rs"]
ssl-rustls-ring =  ["ssl-rustls", "ssl-provider-ring", "rustls/ring", "rustls/tls12", "rustls/logging", "rustls/std"]
ssl-native-tls = ["std", "dep:native-tls", "native-tls/vendored"]
ssl = ["ssl-rustls-ring"]
# ssl = ["ssl-openssl"]
# ssl = ["ssl-native-tls"]


# Compression features
# `dep:brotli` suppresses the implicit `brotli` feature, but the code guards its
# brotli paths with `cfg(feature = "brotli")` — so those paths compiled out
# silently. Name the feature so the cfg means something.
brotli = ["dep:brotli"]
# Compression means all three encodings; gzip/deflate are the flate2 users, so
# enabling this feature without them left the dependency unused.
compression = ["gzip", "deflate", "brotli"]
gzip = ["dep:flate2"]
deflate = ["dep:flate2"]

# Wire module features
# wire-native: includes socket/TLS-dependent wire modules (simple_http client, websocket, event_source, http_stream)
# On non-wasm32 targets this is enabled by default via std. On wasm32, opt in if you have alternative netcap bindings.
wire-native = ["std"]

# Valtron utilities features
std = ["futures-core/std", "foundation_nostd/std", "foundation_compact/std"]
alloc = ["futures-core/alloc"]
multi = ["std", "foundation_core/multi"]  # Multi-threaded executor requires foundation_core multi

# JS event loop yield backends (mutually exclusive — pick one for wasm32)
# Each also picks foundation_compact's matching wasm32 time/entropy backend.
js-event-loop = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "foundation_compact/wasm-bindgen"]
js-foundation-wasm = ["foundation_compact/host-abi"]

# wasm fetch HTTP client — outbound fetch() for browser + CF Workers.
# Enables foundation_core/js-wasmbindgen for valtron's JS ReadableStream bridge.
wasm-fetch = ["js-event-loop", "dep:wasm-bindgen-futures", "foundation_core/js-wasmbindgen"]

# A `NetClient` over a Cloudflare Durable Object stub (wasm only). Pulls
# workers-rs; a browser build must not enable it.
cloudflare = ["wasm-fetch", "dep:worker"]

# default flags (removed ssl to avoid conflicts - users must explicitly choose TLS backend)
default = ["standard", "std", "ssl", "compression", "wire-native", "multi"]

[[test]]
name = "foundation_netio_tests"
path = "tests/mod.rs"
required-features = ["multi"]

# QUIC backend acceptance (F33). Its own target: the traits and driver are behind
# the `quic` feature, and the suite drives real UDP sockets on loopback.
[[test]]
name = "quic"
path = "tests/quic/mod.rs"
required-features = ["quic"]

# HTTP/3 framing + QPACK (F34).
[[test]]
name = "http3"
path = "tests/http3/mod.rs"
required-features = ["quic"]

# F52: wasm32 browser tests (wasm-bindgen). Only compiled for wasm32 targets.
[[test]]
name = "wasm"
path = "tests/wasm/mod.rs"
required-features = ["wasm-fetch"]

# WebTransport protocol + session tests (spec-55, F06).
[[test]]
name = "webtransport"
path = "tests/webtransport/mod.rs"
required-features = ["quic"]

[package.metadata.docs.rs]
# enable one of these as default implementation
features = ["ssl-rustls"]
