[package]
name = "foundation_vfs"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Virtual file system (VFS) traits and shared types. `foundation_nativeapis` re-exports them and adds the implementations."
keywords = ["vfs", "filesystem", "async"]

[dependencies]
foundation_compact = { path = "../foundation_compact", version = "0.2.6" }
foundation_context = { path = "../foundation_context", version = "0.0.4" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.4" }
foundation_arrow = { path = "../foundation_arrow", version = "0.0.5", optional = true }

derive_more = { workspace = true }
serde = { workspace = true }
async-trait = "0.1"

[features]
# Arrow serialization of the VFS types. The implementations live here
# because the types are local to this crate (the orphan rule).
arrow = ["dep:foundation_arrow"]

[lints]
workspace = true
