[package]
name = "foundation_db"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified storage backend with Turso sync API, D1, R2, and in-memory fallback"
keywords = ["database", "storage", "turso", "foundation"]

[dependencies]
# -- Workspace dependencies
# Multi-threaded support is optional - enable with `multi` feature
foundation_core = { path = "../foundation_core", version = "0.0.3", features = ["std"] }
foundation_netio = { path = "../foundation_netio", version = "0.0.1" }
foundation_compact = { path = "../foundation_compact", version = "0.2.0", features = ["crypto-chacha"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
derive_more = { version = "2.0", features = ["from", "error", "display"] }

# Security
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

# Hashing
sha2 = "0.10"
chrono = { workspace = true }

# Utilities
tracing = "0.1"
futures-core = "0.3"
futures-lite = "2"
async-trait = "0.1"
async-stream = "0.3"

# Optional wasm-bindgen dependencies
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# workers-rs interop
worker = { version = "0.8.3", optional = true, default-features = false, features = ["d1"] }

# Native-only storage backends — excluded on wasm32 to avoid
# transitive deps (e.g. tracing-appender → symlink) that don't compile.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
turso = { version = "0.5.3", optional = true, default-features = false }
libsql = { version = "0.6", optional = true }

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tempfile = "3"
serial_test = { workspace = true }
ntest = { workspace = true }
foundation_core = { path = "../foundation_core", version = "0.0.3", features = ["std", "multi"] }

[features]
default = ["turso", "d1", "r2"]
turso = ["dep:turso", "multi"]
libsql = ["dep:libsql", "multi"]
d1 = ["foundation_netio/multi"]
r2 = ["foundation_netio/multi"]

# Multi-threaded support - enables foundation_core's multi feature
multi = ["foundation_core/multi", "foundation_netio/multi"]

# Wasm compatibility — browser time APIs (entropy via foundation_compact)
wasm = ["chrono/wasmbind"]

# Wasm-bindgen bridge types for Cloudflare Workers (D1/R2/KV)
wasm-bindgen-bindings = ["dep:wasm-bindgen", "dep:js-sys"]

# Wasm-bindgen storage trait implementations (calls CF JS APIs directly)
wasm-bindgen-storage = ["wasm-bindgen-bindings", "wasm", "dep:wasm-bindgen-futures"]

# workers-rs interop: From<worker::D1Database> for foundation_db::D1Database
workers-rs = ["dep:worker"]

[lints]
workspace = true
