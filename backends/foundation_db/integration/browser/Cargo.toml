[package]
name = "foundation_db_browser_tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
foundation_db = { path = "../..", default-features = false, features = ["browser-storage"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
futures-lite = "2"

[lib]
path = "consumer.rs"
crate-type = ["cdylib", "rlib"]

