[package]
name = "foundation_wireguard"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Userspace WireGuard mesh: seed-derived keys, boringtun tunnels, SWIM gossip, and a smoltcp/TUN data plane — no kernel module, no privileges, no tokio"
keywords = ["wireguard", "mesh", "userspace", "boringtun", "smoltcp"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# WireGuard Noise state machine + x25519 re-export (decision 01: pin crates.io release).
boringtun = { version = "0.7.1", default-features = false }

# Data plane primitives (feature 00). wasm gets the netstack only; native additionally
# needs poll/fd for the UDP socket + reactor used by the tunnel driver.
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.1", default-features = false, features = ["netstack"] }
foundation_core = { path = "../foundation_core", version = "0.0.3" }
foundation_errstacks = { path = "../foundation_errstacks", version = "0.0.1" }

# Seed -> key derivation (decision 03: HKDF-BLAKE2s).
hkdf = "0.12"
blake2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }
base64 = "0.22"
hex = "0.4"
zeroize = "1"

tracing = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
serde = { workspace = true }

# Native builds add the poll/fd reactor + UDP socket the tunnel driver runs on.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.1", default-features = false, features = ["netstack", "poll", "fd"] }

[dev-dependencies]
tracing-test.workspace = true
tracing-subscriber.workspace = true
serial_test = "3.3"

[lints]
workspace = true
