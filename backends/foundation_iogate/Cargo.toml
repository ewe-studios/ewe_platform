[package]
name = "foundation_iogate"
version = "0.0.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The I/O gate: bridges foundation_netio transports to the foundation_nativeapis reactor (io_uring completion read path, Decision 14 F4 / Feature 48)"
keywords = ["io-uring", "completion", "netio", "reactor", "transport"]

[dependencies]
tracing = { workspace = true }

# ── Native-only bridge crates ───────────────────────────────────────────
# WHY: iogate is the one place that owns *both* netio (Connection,
# CompletionReadWrite) and nativeapis (Reactor, RegisteredFd). Seating those
# edges here — not in netio — keeps netio free of the nativeapis→foundation_db
# →netio dependency cycle. See Feature 48.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The defaults are off so a consumer that must not link a C TLS library can
# leave them off. This crate itself needs only the netcap connection types.
foundation_netio = { path = "../foundation_netio", version = "0.0.18", default-features = false, features = ["wire-native"] }
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.16", features = ["fd"] }
foundation_reactor = { path = "../foundation_reactor", version = "0.0.5" }
foundation_core = { path = "../foundation_core", version = "0.0.23" }

# ── Linux gains the io_uring completion path ────────────────────────────
# WHY: the `uring` feature pulls the `io-uring` crate, which only builds on
# Linux. Cargo unions features across matching target tables, so on Linux
# nativeapis is built with ["fd", "uring"] and the completion registration
# compiles; everywhere else it is ["fd"] and CompletionSocket falls back to
# read(2). This is a target property, not a build-time choice — no feature flag.
[target.'cfg(target_os = "linux")'.dependencies]
foundation_nativeapis = { path = "../foundation_nativeapis", version = "0.0.16", features = ["fd", "uring"] }

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
serial_test = { version = "3" }

[features]
# Keeps the behaviour of the crate before the split: the netio default set,
# with TLS. foundation_http enables `netio-core` instead for a TLS-free build.
default = ["netio-defaults"]
netio-core = []
netio-defaults = ["netio-core", "foundation_netio/ssl"]

[lints]
workspace = true
