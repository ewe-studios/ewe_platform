<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proposed iPhone todo screen</title>
<style>
:root{color-scheme:light dark;font:17px -apple-system,BlinkMacSystemFont,sans-serif;color:CanvasText;background:Canvas}body{max-width:390px;margin:0 auto;background:light-dark(#f2f2f7,#1c1c1e);min-height:100vh}main{padding:44px 20px}header,article,footer{display:flex;align-items:center;justify-content:space-between}h1{font-size:34px;margin:12px 0}header span{font-size:26px;color:#007aff}nav{display:flex;background:light-dark(#e3e3e8,#353539);padding:3px;border-radius:10px;margin:12px 0 30px}nav span{flex:1;text-align:center;font-size:14px;padding:6px;border-radius:7px}nav span:first-child,section{background:Canvas}section{border-radius:13px;padding:0 16px}article{min-height:54px;justify-content:start;gap:12px}article+article{border-top:1px solid GrayText}i{font-style:normal;color:#007aff}footer{margin:12px 4px;color:GrayText;font-size:14px}
</style>
<main><header><h1>Todos</h1><span aria-label="Add todo">⊕</span></header><nav><span>All</span><span>Open</span><span>Done</span></nav><section><article><i>◯</i>Buy milk</article><article><i>☑</i><s>Swift and Rust demo</s></article></section><footer>1 open todo</footer></main></html>
