<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo search and entry proposal</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui;background:#eee;margin:24px;color:#19181c}main{display:flex;gap:20px;flex-wrap:wrap}article{width:min(310px,100%)}section{border:1px solid #999;border-radius:30px;height:400px;overflow:hidden;position:relative;padding:18px;background:#fff}h1{font-size:22px}h2{margin-bottom:12px}.search{display:flex;align-items:center;gap:10px;background:#e7e0ec;padding:14px 18px;border-radius:32px}.apple{background:#ececf0;border-radius:12px;padding:9px 12px}.lens{width:14px;height:14px;border:2px solid currentColor;border-radius:50%;position:relative}.lens:after{content:'';position:absolute;width:7px;height:2px;right:-5px;bottom:-2px;background:currentColor;transform:rotate(45deg)}.dim{background:#999}.sheet{position:absolute;bottom:0;left:0;right:0;background:white;border-radius:22px 22px 0 0;padding:16px 18px 36px}.field{border:1px solid #aaa;border-radius:9px;padding:10px}.actions{text-align:right;color:#075bb8}.home{position:absolute;bottom:8px;left:33%;width:34%;height:4px;border-radius:9px;background:#222}
</style><h1>Todo search and entry proposal</h1><main>
<article><h2>Android search</h2><section><h2>Todos</h2><div class="search"><i class="lens"></i>Search todos</div><p>All　 Open　 Done</p><hr>Package starter check</section></article>
<article><h2>iPhone search</h2><section><h2>Todos</h2><div class="search apple"><i class="lens"></i>Search todos</div><p>All　 Open　 Done</p><hr>Package starter check</section></article>
<article><h2>iPhone entry</h2><section class="dim"><h2>Todos</h2><div class="sheet"><strong>New todo</strong><p class="field">Todo title</p><div class="actions">Cancel　　 Add</div></div><div class="home"></div></section></article></main></html>
