# Generated code is never reformatted by hand.
#
# The Cloudflare per-group crates are written by `cargo run --bin genapi
# generate`. Their build script (`backends/foundation_deployment_cloudflare/
# build.rs`) compares the committed files against a fresh generation and
# regenerates on any difference. Reformatting them here would mark them stale
# and undo itself on the next build. Keep them exactly as the generator
# writes them.
ignore = [
    "backends/foundation_cloudflare_access",
    "backends/foundation_cloudflare_accounts",
    "backends/foundation_cloudflare_ai",
