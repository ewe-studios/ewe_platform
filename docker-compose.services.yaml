# Optional local services for the tests.
#
# Start only what you need with a profile:
#
#   docker compose -f docker-compose.services.yaml --profile object-store up -d minio
#
# The MinIO service serves the live S3 test. Point the gate at it:
#
#   EWE_S3_ENDPOINT=http://127.0.0.1:9000 \
#   EWE_S3_ACCESS_KEY=ewetest EWE_S3_SECRET_KEY=ewetest123 \
#   EWE_S3_BUCKET=ewe-durable EWE_REQUIRE_LIVE_S3=1 \
#   bash ci/durable_conformance.sh
#
# The service uses the pinned release and digest from the CI job. The official
# `minio/minio` image is not public, so this is the Alpine rebuild of the same
# release. The image runs as root because the anonymous `/data` volume is not
# writable by its default user.

name: ewe-services

services:
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    user: root
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ewetest
      MINIO_ROOT_PASSWORD: ewetest123
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    profiles: ["object-store"]

volumes:
  minio-data:
